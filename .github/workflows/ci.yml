name: ci

# Backend, UI and Mac app tests, as independent jobs. Each job runs the same make
# target you run locally (`make test-server`, `make test-web`), so a red job
# reproduces with one command.
#
# Runner: ubuntu-24.04-arm is the largest free GitHub-hosted runner (4 vCPU,
# 16 GB on public repositories, the same as ubuntu-latest). Its vCPUs are
# physical Cobalt 100 cores rather than hyperthreads, which helps the CPU-bound
# Go suite. Larger runners are billed even for public repositories.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels its older run; runs on main always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  server:
    name: server tests (${{ matrix.shard }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [httpapi, runner, other]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lazyagents
          POSTGRES_PASSWORD: lazyagents
          POSTGRES_DB: lazyagents
        ports: ["5432:5432"]
        options: >-
          --tmpfs /var/lib/postgresql/data:rw,size=2g
          --health-cmd "pg_isready -U lazyagents" --health-interval 2s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://lazyagents:lazyagents@localhost:5432/lazyagents?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Run server tests (${{ matrix.shard }})
        working-directory: server
        run: |
          case "${{ matrix.shard }}" in
            httpapi) go test -timeout 30m ./internal/httpapi ;;
            runner)  go test -timeout 30m ./internal/runner ;;
            other)   go test -timeout 30m $(go list ./... | grep -v -E 'internal/httpapi$|internal/runner$') ;;
          esac

  web:
    name: web tests
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make test-web

  # The native Mac app's logic (macos/Sources/VesperCore) and its AppKit target. No stack is needed:
  # the integration test that starts the real stack only runs with VESPER_STACK_IT=1. macOS runners
  # use more billable minutes than Linux ones; drop this job if that matters.
  macos:
    name: macos app tests
    # macOS 26 with Xcode 26: the app targets macOS 26 (Live Voice's SpeechAnalyzer).
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: macos/.build
          key: swiftpm-ci-${{ runner.os }}-${{ hashFiles('macos/Package.resolved', 'macos/Package.swift') }}-${{ hashFiles('macos/Sources/**', 'macos/Tests/**') }}
          restore-keys: |
            swiftpm-ci-${{ runner.os }}-${{ hashFiles('macos/Package.resolved', 'macos/Package.swift') }}-
            swiftpm-ci-${{ runner.os }}-
      - name: Build and test
        working-directory: macos
        run: swift build && swift test
