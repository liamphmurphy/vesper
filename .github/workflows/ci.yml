name: ci

# Backend and UI tests, as two independent jobs. Each job runs the same make
# target you run locally (`make test-server`, `make test-web`), so a red job
# reproduces with one command.
#
# Runner: ubuntu-24.04-arm is the largest free GitHub-hosted runner (4 vCPU,
# 16 GB on public repositories, the same as ubuntu-latest). Its vCPUs are
# physical Cobalt 100 cores rather than hyperthreads, which helps the CPU-bound
# Go suite. Larger runners are billed even for public repositories.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels its older run; runs on main always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  server:
    name: server tests
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lazyagents
          POSTGRES_PASSWORD: lazyagents
          POSTGRES_DB: lazyagents
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lazyagents" --health-interval 2s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://lazyagents:lazyagents@localhost:5432/lazyagents?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: make test-server

  web:
    name: web tests
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make test-web
