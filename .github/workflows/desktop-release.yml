name: desktop-release

# Builds Vesper.app for a version tag and publishes it as a GitHub release:
# the DMG for people to install, and agent-base.erofs, which a fresh install
# downloads on first launch. Installed apps with Settings › Updates › "Check for
# new versions daily" on are told about the new release (desktop/src/updates.ts).
#
# Release: bump nothing, just tag and push:  git tag v0.2.0 && git push origin v0.2.0
# The app's version comes from the tag. A tag with a suffix (v0.2.0-rc.1) is
# published as a pre-release, which installed apps don't announce.
#
# Builds are ad-hoc signed and not notarised (docs/dev/desktop-updates.md), so a
# downloaded DMG needs `xattr -cr /Applications/Vesper.app` once.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing tag to build and (re)publish, e.g. v0.2.0"
        required: true

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - id: v
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          tag="$REF_NAME"
          if [ "$EVENT" = "workflow_dispatch" ]; then tag="$INPUT_TAG"; fi
          # Semver only, as desktop/src/updates.ts parses it; anything else never reaches a shell or a URL.
          if ! [[ "$tag" =~ ^v[0-9]{1,6}\.[0-9]{1,6}\.[0-9]{1,6}(-[0-9A-Za-z.-]{1,64})?$ ]]; then
            echo "::error::Tag '$tag' isn't vMAJOR.MINOR.PATCH (optionally -suffix)"
            exit 1
          fi
          version="${tag#v}"
          prerelease=false
          if [[ "$version" == *-* ]]; then prerelease=true; fi
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

  # The guest kernel and agent image are linux/arm64 Docker builds, and macOS
  # runners have no Docker, so they're built here and handed to the other jobs.
  images:
    needs: version
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    env:
      VESPER_IMAGES_DIR: ${{ github.workspace }}/.images
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: docker/setup-buildx-action@v3
      # The kernel only changes with its Dockerfile, config fragment or version.
      - uses: actions/cache@v4
        with:
          path: |
            .images/vmlinux
            .images/vmlinux.sha256
            .images/kernel.config
          key: vmlinux-${{ hashFiles('deploy/microvm/kernel.Dockerfile', 'deploy/microvm/kernel.fragment.config', 'deploy/microvm/build-images.sh') }}
      - name: Build kernel and agent image
        run: bash deploy/microvm/build-images.sh --kernel --rootfs
      - name: Check the agent image fits a release asset
        run: |
          size=$(stat -c %s "$VESPER_IMAGES_DIR/agent-base.erofs")
          echo "agent-base.erofs: $size bytes"
          # GitHub release assets are limited to 2 GiB each.
          if [ "$size" -ge 2147483648 ]; then
            echo "::error::agent-base.erofs is $size bytes, over GitHub's 2 GiB release asset limit"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: kernel
          retention-days: 3
          if-no-files-found: error
          path: |
            .images/vmlinux
            .images/vmlinux.sha256
            .images/agent-base.erofs.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: rootfs
          retention-days: 3
          if-no-files-found: error
          compression-level: 0
          path: |
            .images/agent-base.erofs
            .images/agent-base.erofs.sha256

  dmg:
    needs: [version, images]
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json
      # scripts/bundle-postgres-darwin.sh takes Postgres 17 from nixpkgs.
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      # The kernel and the agent image's checksum go into the DMG; the image itself is downloaded on first launch.
      - uses: actions/download-artifact@v4
        with:
          name: kernel
          path: ~/.cache/vesper/images
      - name: Set the app version from the tag
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: npm --prefix desktop version "$VERSION" --no-git-tag-version --allow-same-version
      - name: Build the DMG
        run: make desktop-dmg
      - name: Checksum
        working-directory: desktop/release
        run: shasum -a 256 Vesper-arm64.dmg > Vesper-arm64.dmg.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: dmg
          retention-days: 3
          if-no-files-found: error
          compression-level: 0
          path: |
            desktop/release/Vesper-arm64.dmg
            desktop/release/Vesper-arm64.dmg.sha256

  # Publishes only after every artifact built, so a release never exists without its DMG.
  publish:
    needs: [version, images, dmg]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dmg
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: rootfs
          path: dist
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          ls -l dist
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            flags=()
            if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
            gh release create "$TAG" dist/* --verify-tag --title "Vesper $VERSION" --generate-notes "${flags[@]}"
          fi
