<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:"
    />
    <title>Vesper Logs</title>
    <link rel="stylesheet" href="./native.css" />
    <style>
      body {
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 18px;
        border-bottom: 1px solid var(--border);
        background: var(--surface);
      }
      header .spacer {
        flex: 1;
      }
      #health {
        padding: 10px 18px;
        border-bottom: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      pre {
        flex: 1;
        margin: 0;
        padding: 12px 18px;
        overflow: auto;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11.5px;
        line-height: 1.45;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .follow {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--fg-muted);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Stack logs</h1>
      <span class="pill"><span class="dot" id="health-dot"></span><span id="health-title">…</span></span>
      <span class="spacer"></span>
      <label class="follow"><input type="checkbox" id="follow" checked /> Follow</label>
      <button type="button" id="copy">Copy</button>
      <button type="button" id="reveal">Show in Finder</button>
      <button type="button" class="primary" id="restart">Restart Stack</button>
    </header>
    <div id="health" class="hidden">
      <span id="health-message"></span>
      <span class="muted small" id="health-step"></span>
    </div>
    <pre id="log" aria-live="off"></pre>
    <script src="./logs.js"></script>
  </body>
</html>
