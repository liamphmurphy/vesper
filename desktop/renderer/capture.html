<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:"
    />
    <title>Quick Capture</title>
    <link rel="stylesheet" href="./native.css" />
    <style>
      body {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 14px 16px 12px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--surface);
        -webkit-app-region: drag;
      }
      .top {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .top .segmented,
      .top select,
      textarea,
      .bottom {
        -webkit-app-region: no-drag;
      }
      .top select {
        margin-left: auto;
        max-width: 210px;
      }
      textarea {
        flex: 1;
        width: 100%;
        font-size: 14px;
      }
      .bottom {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .bottom .spacer {
        flex: 1;
      }
      .open-after {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--fg-muted);
      }
    </style>
  </head>
  <body>
    <div class="top">
      <div class="segmented" role="group" aria-label="What to capture" id="kinds">
        <button type="button" data-kind="note" aria-pressed="true">Note</button>
        <button type="button" data-kind="message" aria-pressed="false">Message</button>
        <button type="button" data-kind="ticket" aria-pressed="false">Ticket</button>
      </div>
      <select id="persona" class="hidden" aria-label="Persona"></select>
      <select id="project" class="hidden" aria-label="Project"></select>
    </div>
    <textarea id="text" rows="5" aria-label="What to capture" placeholder="Capture a note to your Knowledge inbox…"></textarea>
    <div class="bottom">
      <label class="open-after"><input type="checkbox" id="open-after" /> Open in Vesper after</label>
      <span class="error" id="error" role="alert"></span>
      <span class="spacer"></span>
      <span class="muted small"><kbd>esc</kbd> to close</span>
      <button type="button" class="primary" id="submit">Save <kbd>⌘↵</kbd></button>
    </div>
    <script src="./capture.js"></script>
  </body>
</html>
