appId: com.vesper.desktop
productName: Vesper
afterSign: scripts/after-pack.cjs
directories:
  buildResources: build
  output: release
files:
  - dist/**/*
  - renderer/**/*
  - package.json
extraResources:
  - from: resources/bin
    to: bin
    filter:
      - "**/*"
  - from: resources/postgres
    to: postgres
    filter:
      - "**/*"
  - from: resources/images
    to: images
    filter:
      - "**/*"
  - from: resources/web
    to: web
    filter:
      - "**/*"
protocols:
  # vesper:// deep links (LAZYAGENTS-244); parsed and validated in src/deeplink.ts.
  - name: Vesper
    schemes:
      - vesper
fileAssociations:
  # Lets files be dropped on the Dock icon or opened with Vesper to send them to a
  # chat (LAZYAGENTS-247). Alternate: Vesper shows in Open With but never becomes
  # the default app for these types.
  - ext: [pdf, png, jpg, jpeg, gif, webp, txt, md, markdown, csv, json, zip]
    name: Vesper attachment
    role: Viewer
    rank: Alternate
mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  identity: null
  extendInfo:
    # Alerts (not banners) by default, so Approve/Decline and Reply buttons show (LAZYAGENTS-241).
    NSUserNotificationAlertStyle: alert
  target:
    - target: dmg
      arch:
        - arm64
dmg:
  title: Vesper
  icon: build/icon.icns
  contents:
    - x: 140
      y: 200
    - x: 400
      y: 200
      type: link
      path: /Applications
  window:
    width: 540
    height: 380
artifactName: ${productName}-${arch}.${ext}
