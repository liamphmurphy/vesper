appId: com.vesper.desktop
productName: Vesper
afterSign: scripts/after-pack.cjs
directories:
  buildResources: build
  output: release
files:
  - dist/**/*
  - renderer/**/*
  - package.json
extraResources:
  - from: resources/bin
    to: bin
    filter:
      - "**/*"
  - from: resources/postgres
    to: postgres
    filter:
      - "**/*"
  - from: resources/images
    to: images
    filter:
      - "**/*"
  - from: resources/web
    to: web
    filter:
      - "**/*"
mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  identity: null
  target:
    - target: dmg
      arch:
        - arm64
dmg:
  title: Vesper
  icon: build/icon.icns
  contents:
    - x: 140
      y: 200
    - x: 400
      y: 200
      type: link
      path: /Applications
  window:
    width: 540
    height: 380
artifactName: ${productName}-${arch}.${ext}
