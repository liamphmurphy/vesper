<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200">
  <defs>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="white"/>
      <stop offset="1" stop-color="black"/>
    </linearGradient>
    <mask id="m"><rect width="300" height="200" fill="url(#fade)"/></mask>
    <mask id="hole" maskContentUnits="objectBoundingBox">
      <rect width="1" height="1" fill="white"/>
      <circle cx="0.5" cy="0.5" r="0.25" fill="black"/>
    </mask>
  </defs>
  <rect width="300" height="200" fill="#F1F5F9"/>
  <rect x="10" y="10" width="280" height="80" fill="#2563EB" mask="url(#m)"/>
  <rect x="100" y="100" width="100" height="90" fill="#DC2626" mask="url(#hole)"/>
</svg>
