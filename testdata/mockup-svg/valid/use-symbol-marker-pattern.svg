<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 300">
  <defs>
    <symbol id="icon" viewBox="0 0 24 24">
      <path d="M12 2 L22 22 H2 Z" fill="#F59E0B"/>
    </symbol>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M0 0 L10 5 L0 10 z" fill="#111827"/>
    </marker>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(10)">
      <circle cx="5" cy="5" r="2" fill="#9CA3AF"/>
    </pattern>
    <g id="card"><rect width="80" height="50" rx="4" fill="#FFFFFF" stroke="#6B7280"/></g>
  </defs>
  <rect width="400" height="300" fill="url(#dots)"/>
  <use href="#icon" x="20" y="20" width="48" height="48"/>
  <use xlink:href="#card" x="120" y="20"/>
  <use href="#card" transform="translate(240 20)"/>
  <polyline points="20,200 120,150 220,220 380,160" fill="none" stroke="#111827" stroke-width="2" marker-start="url(#arrow)" marker-mid="url(#arrow)" marker-end="url(#arrow)"/>
</svg>
