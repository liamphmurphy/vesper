<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1" spreadMethod="pad">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0.8"/>
    </linearGradient>
    <radialGradient id="rg" cx="50%" cy="50%" r="50%" fx="30%" fy="30%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="white"/>
      <stop offset="1" stop-color="rgb(14, 165, 233)"/>
    </radialGradient>
    <linearGradient id="lg2" href="#lg" gradientTransform="rotate(45 .5 .5)"/>
    <clipPath id="clip" clipPathUnits="userSpaceOnUse">
      <circle cx="300" cy="80" r="60"/>
    </clipPath>
    <mask id="fade" maskUnits="userSpaceOnUse" x="0" y="160" width="400" height="140">
      <rect x="0" y="160" width="400" height="140" fill="url(#lg)"/>
    </mask>
  </defs>
  <rect x="20" y="20" width="160" height="120" rx="12" fill="url(#lg)"/>
  <rect x="220" y="20" width="160" height="120" fill="url(#rg)" clip-path="url(#clip)"/>
  <rect x="20" y="170" width="360" height="110" fill="url(#lg2) #6366F1" mask="url(#fade)"/>
</svg>
