        title: { type: string, minLength: 1, maxLength: 200, description: Rename the display title and derive a unique last path segment in the current folder; the old path remains an alias }
        body_md: { type: string }
        properties: { $ref: "#/components/schemas/PageProperties" }
        tags: { type: array, items: { type: string }, description: Explicit tags; response also includes inline body tags }
        aliases: { type: array, items: { type: string }, description: Link names; old moved paths are preserved separately }

