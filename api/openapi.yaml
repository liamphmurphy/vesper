      description: "research: a deep research report written in one of the space's chats, added when it was saved"
    ChatSpaceSource:
      type: object
      required: [id, kind, title, size_bytes, tokens, delivery, created_at]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/ChatSpaceSourceKind" }
        title: { type: string }
        url: { type: string, description: "For a web page or saved link: where it was read from" }
        filename: { type: string }
        chat_id: { type: string, format: uuid, description: "For a research report: the chat it was written in, while that chat exists" }
        content_type: { type: string }
        size_bytes: { type: integer, format: int64 }
        tokens: { type: integer, description: "Estimated from its text; 0 for a file that isn't text" }
        delivery:
          type: string
          enum: [inline, searched]
          x-enum-varnames: [SpaceSourceInline, SpaceSourceSearched]
          description: "inline: offered to every turn to read; searched: too long, or past the inline budget, so turns search inside it"
        created_at: { type: string, format: date-time }
    ChatSpaceSourceList:
      type: object
      required: [sources, inline_tokens, inline_budget]
      properties:
        sources: { type: array, items: { $ref: "#/components/schemas/ChatSpaceSource" } }
        inline_tokens: { type: integer }
        inline_budget: { type: integer }
    NewChatSpaceSource:
      type: object
      required: [kind]
      description: |
        text needs text (and a title); website needs url; library needs
        item_id (an image, diagram or saved link); link needs item_id (a saved
        link); canvas needs canvas_id. title, when given, names the source.
      properties:
        kind:
          type: string
          enum: [text, website, library, link, canvas]
          x-enum-varnames: [NewSpaceSourceText, NewSpaceSourceWebsite, NewSpaceSourceLibrary, NewSpaceSourceLink, NewSpaceSourceCanvas]
        title: { type: string, maxLength: 300 }
        text: { type: string, maxLength: 400000 }
        url: { type: string, maxLength: 2000 }
        item_id: { type: string, format: uuid }
        canvas_id: { type: string, format: uuid }
    DeckSummary:
      type: object
      required: [id, title, chat_id, updated_at, slide_count, cover]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        chat_id: { type: string, format: uuid }
        updated_at: { type: string, format: date-time }
        slide_count: { type: integer }
        cover: { type: string, description: "The deck JSON cut down to its first slide, for the list's thumbnail" }
    SlideThemeFonts:
      type: object
      required: [heading, body]
      additionalProperties: false
      properties:
        heading: { type: string, enum: [sans, serif, mono], x-enum-varnames: [SlideFontSans, SlideFontSerif, SlideFontMono] }
        body: { type: string, enum: [sans, serif, mono], x-enum-varnames: [SlideBodyFontSans, SlideBodyFontSerif, SlideBodyFontMono] }
    SlideThemeColors:
      type: object
      required: [background, text, heading, accent, accent2, muted, surface]
      additionalProperties: false
      properties:
        background: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
        text: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
        heading: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
        accent: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
        accent2: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
        muted: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
        surface: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
    SlideThemeInput:
      type: object
      required: [name, fonts, colors]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        fonts: { $ref: "#/components/schemas/SlideThemeFonts" }
        colors: { $ref: "#/components/schemas/SlideThemeColors" }
    SlideStarter:
      type: object
      required: [key, name, description, slide_count, cover]
      properties:
        key: { type: string, description: "Pass as createDeck's starter" }
        name: { type: string }
        description: { type: string }
        slide_count: { type: integer }
        cover: { type: string, description: "The starter deck JSON cut down to its first slide, in the light theme, for the chooser's preview" }
    SlideTheme:
      type: object
      required: [id, name, fonts, colors, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        fonts: { $ref: "#/components/schemas/SlideThemeFonts" }
        colors: { $ref: "#/components/schemas/SlideThemeColors" }
        updated_at: { type: string, format: date-time }
    DeckAsset:
      type: object
      required: [id, mime, w, h]
      properties:
        id: { type: string }
        mime: { type: string, enum: [image/png, image/jpeg] }
        w: { type: integer }
        h: { type: integer }
    DesignSummary:
      type: object
      required: [id, title, chat_id, updated_at, seq, pages, frames, pending_proposals, persona_edited]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        chat_id: { type: string, format: uuid }
        updated_at: { type: string, format: date-time }
        seq: { type: integer, format: int32, description: "The current version, for its body (getDesignVersion)" }
        persona_edited: { type: boolean, description: "A persona wrote at least one of its versions" }
        project_id: { type: string, format: uuid, nullable: true }
        pages: { type: integer }
        frames: { type: integer, description: "Top-level frames across its pages" }
        pending_proposals: { type: integer }
    DesignSettings:
      type: object
      required: [direct_edit, persona_paused]
      properties:
        direct_edit: { type: boolean }
        persona_paused: { type: boolean }
        project_id: { type: string, format: uuid, nullable: true }
    Design:
      allOf:
        - { $ref: "#/components/schemas/MyCanvas" }
        - type: object
          required: [seq, settings, pending_proposals]
          properties:
            seq: { type: integer, format: int32, description: The current version }
            settings: { $ref: "#/components/schemas/DesignSettings" }
            pending_proposals: { type: integer }
    DesignVersion:
      allOf:
        - { $ref: "#/components/schemas/ChatCanvasVersion" }
        - type: object
          required: [body]
          properties:
            body: { type: string, description: "The design JSON (schema 1), normalised" }
    DesignDecision:
      type: object
      required: [i, state]
      properties:
        i: { type: integer }
        state: { type: string, enum: [accepted, rejected, stale], x-enum-varnames: [DesignDecisionAccepted, DesignDecisionRejected, DesignDecisionStale] }
        reason: { type: string }
    DesignProposal:
      type: object
      required: [id, agent_id, base_seq, summary, ops, status, decisions, created_at]
      properties:
        id: { type: string, format: uuid }
        chat_id: { type: string, format: uuid, nullable: true }
        run_id: { type: string, format: uuid, nullable: true }
        agent_id: { type: string, format: uuid }
        base_seq: { type: integer, format: int32 }
        summary: { type: string }
        ops:
          type: array
          description: "design_patch ops ({op, …fields, why}), with ids the server minted for what they add"
          items: { type: object, additionalProperties: true }
        deps:
          type: array
          description: "Per op, the earlier ops it needs (they create something it refers to)"
          items: { type: array, items: { type: integer } }
        status: { type: string, enum: [pending, resolved, applied, withdrawn], x-enum-varnames: [DesignProposalPending, DesignProposalResolved, DesignProposalApplied, DesignProposalWithdrawn] }
        decisions: { type: array, items: { $ref: "#/components/schemas/DesignDecision" } }
        result_seq: { type: integer, format: int32, nullable: true }
        created_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time, nullable: true }
    MyCanvas:
      type: object
      required: [id, kind, title, chat_id, chat_title, updated_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [text, svg, deck, design], x-enum-varnames: [MyCanvasText, MyCanvasSvg, MyCanvasDeck, MyCanvasDesign] }
        title: { type: string }
        chat_id: { type: string, format: uuid }
        chat_title: { type: string }
        updated_at: { type: string, format: date-time }
        reviewed_seq: { type: integer, format: int32, description: "The last version the person reviewed; 0 before any review" }
    MemoryAbout:
      type: string
      enum: [all, person, persona]
      default: all
    MemoryCreate:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        summary: { type: string, maxLength: 300 }
        body: { type: string, maxLength: 20000 }
        tags: { type: array, maxItems: 12, items: { type: string, maxLength: 40 } }
        type: { $ref: "#/components/schemas/MemoryType" }
        persona_id: { type: string, format: uuid, description: "Save to this persona's own memory; absent saves to the person's" }
    Memory:
      type: object
      description: |
        One thing the personal assistant remembers about its person, kept apart
        from the shared wiki. superseded_by marks a retired entry and names the
        entry that replaced it; retired_reason and retired_at say why and when
        (a periodic consolidation pass retires duplicates this way). Restoring
        an entry clears all three. persona_id marks a persona's own memory
        (who it is, and the moments it shared with the person); absent, the
        entry is about the person.
      required: [id, title, summary, body, tags, type, source, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        persona_id: { type: string, format: uuid, description: "The persona whose own memory this is; absent for the person's memory" }
        space_id: { type: string, format: uuid, description: "The space whose memory this is: only chats in that space see it. Absent for the general memory." }
        space_name: { type: string }
        title: { type: string }
        summary: { type: string, description: One line }
        body: { type: string }
        tags: { type: array, items: { type: string } }
        type: { $ref: "#/components/schemas/MemoryType" }
        source: { type: string, description: "Where it came from in words, e.g. chat <id> or manual" }
        source_chat_id: { type: string, format: uuid, description: The chat it came from, while that chat exists }
        source_run_id: { type: string, format: uuid, description: The run that wrote it, while that run exists }
        superseded_by: { type: string, format: uuid, description: Set when retired in favour of this newer entry }
        retired_reason: { type: string, description: "Why it was retired, e.g. merged by memory consolidation; empty while current" }
        retired_at: { type: string, format: date-time, description: When it was retired }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    MemoryList:
      type: object
      required: [memories, total, has_more]
      properties:
        memories: { type: array, items: { $ref: "#/components/schemas/Memory" } }
        total: { type: integer, description: "Entries matching type and include_retired (q not applied)" }
        has_more: { type: boolean }
    MemoryExport:
      type: object
      required: [exported_at, memories]
      properties:
        exported_at: { type: string, format: date-time }
        memories: { type: array, items: { $ref: "#/components/schemas/Memory" } }
    MemoryImport:
      type: object
      required: [memories]
      properties:
        memories:
          type: array
          minItems: 1
          maxItems: 200
          items: { $ref: "#/components/schemas/MemoryImportEntry" }
    MemoryImportEntry:
      type: object
      description: One memory to add. Limits match MemoryPatch and are checked per entry.
      required: [title]
      properties:
        title: { type: string }
        summary: { type: string }
        body: { type: string }
        tags: { type: array, items: { type: string } }
        type: { $ref: "#/components/schemas/MemoryType" }
    MemoryImportResult:
      type: object
      required: [created, updated, failed]
      properties:
        created: { type: integer, description: New entries added }
        updated: { type: integer, description: Existing near-duplicate entries updated instead }
        failed:
          type: array
          description: Entries that weren't saved, in request order
          items: { $ref: "#/components/schemas/MemoryImportFailure" }
    MemoryImportFailure:
      type: object
      required: [index, title, error]
      properties:
        index: { type: integer, description: Position in the request's memories }
        title: { type: string }
        error: { type: string, description: "Why, e.g. title: must be 1–200 characters" }
    MemoryPatch:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        summary: { type: string, maxLength: 300 }
        body: { type: string, maxLength: 20000 }
        tags: { type: array, maxItems: 12, items: { type: string, maxLength: 40 } }
        type: { $ref: "#/components/schemas/MemoryType" }
        superseded_by: { type: string, format: uuid, description: Retire this entry in favour of another current entry }
        restore: { type: boolean, description: true clears superseded_by }
    Ticket:
      type: object
      required: [id, key, project, title, description_md, status, priority, labels, criteria, artifacts, approvals, blocked_by, blocks, revision, dependency_revision, requires_mockup, epic_review, mockup_gate, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        key: { type: string }
        project: { $ref: "#/components/schemas/Project" }
        title: { type: string }
        description_md: { type: string }
        revision: { type: integer, description: Bumped on every field change; send it back in TicketPatch.revision }
        dependency_revision: { type: integer }
        blocked_by: { type: array, items: { $ref: '#/components/schemas/TicketDependency' } }
        blocks: { type: array, items: { $ref: '#/components/schemas/TicketDependency' } }
        status: { $ref: "#/components/schemas/TicketStatus" }
        priority: { $ref: "#/components/schemas/Priority" }
        epic: { $ref: "#/components/schemas/EpicRef" }
        assignee: { $ref: "#/components/schemas/AgentRef" }
        reviewer: { $ref: "#/components/schemas/UserRef" }
        created_by: { $ref: "#/components/schemas/UserRef" }
        labels: { type: array, items: { $ref: "#/components/schemas/Label" } }
        criteria: { type: array, items: { $ref: "#/components/schemas/Criterion" } }
        artifacts: { type: array, items: { $ref: "#/components/schemas/DocCard" } }
        run: { $ref: "#/components/schemas/Run" }
        approvals:
          type: array
          description: Pending approval requests on this ticket
          items: { $ref: "#/components/schemas/Approval" }
        estimate: { type: string, description: "Legacy free-text sizing note (e.g. \"L · ~6h\"); kept as is, superseded by estimate_points" }
        estimate_points: { $ref: "#/components/schemas/EstimatePoints" }
        estimate_rationale: { type: string, description: Why the estimator chose the points (agents give one; people may leave it empty) }
        estimated_by: { $ref: "#/components/schemas/Actor" }
        estimated_at: { type: string, format: date-time }
        due_date: { type: string, format: date }
        branch: { type: string }
        pr: { $ref: "#/components/schemas/PullRequest" }
        requires_mockup: { type: boolean, description: This ticket itself is flagged (its epic may also require one) }
        epic_review: { type: boolean, description: "The epic's final review: created by the server, it consolidates the epic's branches and runs its tests once" }
        mockup_gate: { $ref: "#/components/schemas/MockupGate" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    MockupRef:
      type: object
      required: [id, title, version_id, version_label, review_state, review_note]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        version_id: { type: string, format: uuid }
        version_label: { type: string }
        review_state: { $ref: "#/components/schemas/MockupReviewState" }
        review_note: { type: string }
    MockupGate:
      type: object
      description: Whether the ticket needs a person-approved UI mockup before implementation can finish
      required: [required, from_epic, approved, mockups]
      properties:
        required: { type: boolean }
        from_epic: { type: boolean, description: Required only because the ticket's epic says so }
        approved: { type: boolean, description: A candidate mockup's current version is approved }
        mockups:
          type: array
          description: Mockups attached to the ticket or in its epic (current versions)
          items: { $ref: "#/components/schemas/MockupRef" }
    MockupReviewState:
      type: string
      enum: [pending, approved, changes_requested]
    MockupReview:
      type: object
      required: [state, note, pins]
      properties:
        state: { $ref: "#/components/schemas/MockupReviewState" }
        note: { type: string, description: "The reviewer's note, followed by the pinned comments as a numbered list" }
        pins:
          type: array
          description: Comments pinned on this version, numbered by position (the first is 1)
          items: { $ref: "#/components/schemas/MockupPin" }
        reviewed_by: { $ref: "#/components/schemas/UserRef" }
        reviewed_at: { type: string, format: date-time }
    ChatCanvasSave:
      type: object
      required: [base_seq, body]
      properties:
        base_seq: { type: integer, format: int32, description: The version this edit started from }
        body: { type: string }
        note: { type: string, maxLength: 200 }
    ChatCanvasPoint:
      type: object
      required: [x, y]
      properties:
        x: { type: number, format: double, minimum: 0, maximum: 1 }
        y: { type: number, format: double, minimum: 0, maximum: 1 }
    ChatCanvasAnchor:
      type: object
      description: A passage (start, end and quote, in UTF-16 code units) or an SVG element (vid). Empty on a reply.
      properties:
        start: { type: integer }
        end: { type: integer }
        quote: { type: string }
        prefix: { type: string }
        suffix: { type: string }
        vid: { type: string }
        node: { type: string, description: "Design: the node id (n_…) the comment is on" }
        tag: { type: string }
        label: { type: string }
        point: { $ref: "#/components/schemas/ChatCanvasPoint" }
    ChatCanvasComment:
      type: object
      required: [id, seq, author_type, body, anchor, target_lost, status, created_at]
      properties:
        id: { type: string, format: uuid }
        parent_id: { type: string, format: uuid, nullable: true }
        seq: { type: integer, format: int32 }
        author_type: { type: string }
        body: { type: string }
        anchor: { $ref: "#/components/schemas/ChatCanvasAnchor" }
        target_lost: { type: boolean }
        status: { type: string, description: "draft, open, addressed or resolved" }
        suggestion: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
    ChatCanvasComments:
      type: object
      required: [comments]
      properties:
        comments:
          type: array
          items: { $ref: "#/components/schemas/ChatCanvasComment" }
    NewChatCanvasComment:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 4000 }
        seq: { type: integer, format: int32, description: The version the anchor is in; required unless replying }
        parent_id: { type: string, format: uuid, description: The thread to reply to }
        start: { type: integer }
        end: { type: integer }
        vid: { type: string }
        node: { type: string, pattern: "^n_[a-z0-9_]{1,40}$", description: "Design: the node (n_…) to anchor on; with point, where in its box (fractions 0 to 1)" }
        point: { $ref: "#/components/schemas/ChatCanvasPoint" }
    ChatCanvasSummary:
      type: object
      required: [id, kind, title, seq, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [text, svg, deck, design], x-enum-varnames: [CanvasKindText, CanvasKindSvg, CanvasKindDeck, CanvasKindDesign] }
        title: { type: string }
        seq: { type: integer, format: int32, description: The current version number }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ChatCanvases:
      type: object
      required: [canvases]
      properties:
        canvases:
          type: array
          items: { $ref: "#/components/schemas/ChatCanvasSummary" }
    ChatCanvasVersion:
      type: object
      required: [seq, note, author_type, created_at]
      properties:
        seq: { type: integer, format: int32 }
        note: { type: string }
        author_type: { type: string, enum: [user, agent], x-enum-varnames: [CanvasAuthorUser, CanvasAuthorAgent] }
        created_at: { type: string, format: date-time }
    ChatPlaygroundState:
      type: object
      required: [playground, saved_spec]
      properties:
        playground:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/Playground" }]
        saved_spec:
          type: boolean
          description: The chat's repository has a playground spec from an earlier start, so start works here without asking an agent
    Playground:
      type: object
      required: [id, chat_id, state, step, branch, error_log, stop_reason, processes, services, routes, openapi, openapi_inferred, openapi_commit, updated_at]
      properties:
        id: { type: string, format: uuid }
        chat_id: { type: string, format: uuid }
        state: { type: string, enum: [starting, running, stopped, failed] }
        step: { type: string, description: "What it's doing while it starts or resets, e.g. Running setup" }
        action: { type: string, enum: [reset, restart, stop], nullable: true, description: Asked for and not yet carried out }
        port: { type: integer, format: int32, nullable: true, description: "Where the runner serves it on Vesper's host, while it's starting or running" }
        branch: { type: string, description: The branch checked out when it started }
        error: { type: string, nullable: true }
        error_log: { type: string, description: The end of the failing setup's or process's output }
        stop_reason: { type: string }
        idle_ttl_seconds: { type: integer, format: int32, nullable: true, description: It stops after this long unused }
        started_at: { type: string, format: date-time, nullable: true }
        data_reset_at: { type: string, format: date-time, nullable: true }
        last_used_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time }
        processes:
          type: array
          items:
            type: object
            required: [name, port]
            properties:
              name: { type: string }
              port: { type: integer, format: int32 }
        services:
          type: array
          items:
            type: object
            required: [name, image]
            properties:
              name: { type: string }
              image: { type: string }
        routes:
          type: array
          items:
            type: object
            required: [path, process]
            properties:
              path: { type: string }
              process: { type: string }
        openapi: { type: string, description: "The app's OpenAPI document in the workspace, when it serves none itself; the gateway serves whichever applies as JSON at /__vesper/openapi. Empty when it names none." }
        openapi_inferred: { type: boolean, description: The persona wrote the document from the code }
        openapi_commit: { type: string, description: The commit an inferred document was read from }
    ChatCanvas:
      allOf:
        - { $ref: "#/components/schemas/ChatCanvasSummary" }
        - type: object
          required: [viewing_seq, body, versions]
          properties:
            viewing_seq: { type: integer, format: int32, description: The version body belongs to }
            promoted_artifact_id: { type: string, format: uuid, nullable: true }
            body: { type: string }
            versions:
              type: array
              description: Newest first
              items: { $ref: "#/components/schemas/ChatCanvasVersion" }
    MockupPin:
      type: object
      required: [x, y, text]
      properties:
        x: { type: number, format: double, minimum: 0, maximum: 1, description: Horizontal position as a fraction of the drawing's width }
        y: { type: number, format: double, minimum: 0, maximum: 1, description: Vertical position as a fraction of the drawing's height }
        text: { type: string, minLength: 1, maxLength: 500 }
    Criterion:
      type: object
      required: [id, position, text, done]
      properties:
        id: { type: string, format: uuid }
        position: { type: integer }
        text: { type: string }
        done: { type: boolean }

    NewTicket:
      type: object
      required: [project_key, title]
      properties:
        project_key: { type: string }
        title: { type: string, minLength: 1, maxLength: 300 }
        description_md: { type: string }
        status: { $ref: "#/components/schemas/TicketStatus" }
        priority: { $ref: "#/components/schemas/Priority" }
        epic_id: { type: string, format: uuid }
        assignee_agent_id: { type: string, format: uuid }
        reviewer_user_id: { type: string, format: uuid }
        label_ids: { type: array, items: { type: string, format: uuid } }
        estimate: { type: string }
        estimate_points: { $ref: "#/components/schemas/EstimatePoints" }
        due_date: { type: string, format: date }
        criteria: { type: array, items: { type: string } }
        requires_mockup: { type: boolean }
    TicketPatch:
      type: object
      properties:
        revision:
          type: integer
          description: "Expected current Ticket.revision; stale → 409. Not allowed in BulkUpdate.patch (422)."
        title: { type: string, minLength: 1, maxLength: 300 }
        description_md: { type: string }
        status: { $ref: "#/components/schemas/TicketStatus" }
        priority: { $ref: "#/components/schemas/Priority" }
        epic_id: { type: string, format: uuid, nullable: true }
        assignee_agent_id: { type: string, format: uuid, nullable: true }
        reviewer_user_id: { type: string, format: uuid, nullable: true }
        estimate: { type: string, nullable: true }
        estimate_points:
          type: integer
          minimum: 0
          maximum: 100
          nullable: true
          description: "Same scale as EstimatePoints; null clears. Records the person as estimated_by and clears the rationale."
        due_date: { type: string, format: date, nullable: true }
        label_ids: { type: array, items: { type: string, format: uuid } }
        requires_mockup: { type: boolean }
        criteria: { $ref: "#/components/schemas/TicketCriteriaDraft" }
    TicketCriteriaDraft:
      type: object
      description: |
        Replaces the ticket's acceptance criteria atomically with the ticket
        fields (ADR-034). Requires revision. expected is the complete criteria
        list the client started from; if it no longer matches, nothing changes
        and the server answers 409 with field criteria. items order defines the
        final positions; existing IDs are kept, items without id are created and
        omitted IDs are deleted. Not allowed in BulkUpdate.patch (422).
      required: [expected, items]
      properties:
        expected:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/Criterion" }
        items:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/TicketCriterionDraft" }
    TicketCriterionDraft:
      type: object
      required: [text, done]
      properties:
        id: { type: string, format: uuid, description: "Existing criterion of this ticket; omit to create" }
        text: { type: string, minLength: 1, maxLength: 1000 }
        done: { type: boolean }
    BulkUpdate:
      type: object
      required: [keys, patch]
      properties:
        keys:
          type: array
          minItems: 1
          maxItems: 200
          items: { type: string }
        patch: { $ref: "#/components/schemas/TicketPatch" }
        attach_artifact_id:
          type: string
          format: uuid
          description: Also attach this artifact (as context) to every ticket

    ArtifactType:
      type: string
      enum: [prd, spec, adr, report, design, note, mockup]
    ArtifactRelation:
      type: string
      enum: [context, generated]
    ArtifactContent:
      type: object
      required: [kind, content_type, size_bytes, sections]
      properties:
        kind: { type: string, enum: [markdown, svg, file] }
        content_type: { type: string }
        size_bytes: { type: integer, format: int64 }
        filename: { type: string }
        sections: { type: integer, description: Headings in the outline (markdown only) }
    ArtifactSummary:
      type: object
      required: [id, type, title, summary, author, content, ticket_count, updated_at]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/ArtifactType" }
        title: { type: string }
        display_id: { type: string, description: "ADR-012; set for numbered types" }
        summary: { type: string }
        project: { $ref: "#/components/schemas/Project" }
        path: { type: string, description: Notes only }
        epic: { $ref: "#/components/schemas/EpicRef" }
        author: { $ref: "#/components/schemas/Actor" }
        version_label: { type: string }
        content: { $ref: "#/components/schemas/ArtifactContent" }
        review_state: { $ref: "#/components/schemas/MockupReviewState" }
        ticket_count: { type: integer }
        updated_at: { type: string, format: date-time }
    ArtifactCounts:
      type: object
      required: [all, prd, spec, adr, report, design, note, mockup]
      properties:
        all: { type: integer, description: Everything except notes }
        note: { type: integer }
        prd: { type: integer }
        spec: { type: integer }
        adr: { type: integer }
        report: { type: integer }
        design: { type: integer }
        mockup: { type: integer }
    ArtifactList:
      type: object
      required: [artifacts, counts]
      properties:
        artifacts: { type: array, items: { $ref: "#/components/schemas/ArtifactSummary" } }
        counts: { $ref: "#/components/schemas/ArtifactCounts" }
    ArtifactVersion:
      type: object
      required: [id, seq, label, note, content, created_by, created_at]
      properties:
        id: { type: string, format: uuid }
        seq: { type: integer }
        label: { type: string }
        note: { type: string }
        content: { $ref: "#/components/schemas/ArtifactContent" }
        review: { $ref: "#/components/schemas/MockupReview" }
        created_by: { $ref: "#/components/schemas/Actor" }
        created_at: { type: string, format: date-time }
    OutlineSection:
      type: object
      required: [id, level, anchor, heading, citations]
      properties:
        id: { type: string, format: uuid }
        level: { type: integer }
        anchor: { type: string }
        heading: { type: string }
        citations: { type: integer, description: Times agents cited this section (by anchor, across versions) }
    ArtifactReader:
      type: object
      required: [agent, reads, last_read_at]
      properties:
        agent: { $ref: "#/components/schemas/AgentRef" }
        reads: { type: integer }
        last_read_at: { type: string, format: date-time }
    LinkedTicket:
      type: object
      required: [key, title, status, relation]
      properties:
        key: { type: string }
        title: { type: string }
        status: { $ref: "#/components/schemas/TicketStatus" }
        relation: { $ref: "#/components/schemas/ArtifactRelation" }
    Artifact:
      type: object
      required: [id, type, title, summary, author, current_version, body_md, outline, read_by, versions, tickets, suggestions, created_at, updated_at]
      properties:
        audience: { type: string, description: "private, shared or agent; only a person can change private/shared" }
        id: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/ArtifactType" }
        title: { type: string }
        properties: { $ref: "#/components/schemas/PageProperties" }
        tags: { type: array, items: { type: string }, description: Explicit tags; response also includes inline body tags }
        aliases: { type: array, items: { type: string }, description: Link names; old moved paths are preserved separately }
        display_id: { type: string }
        summary: { type: string }
        project: { $ref: "#/components/schemas/Project" }
        path: { type: string, description: "Notes: Payments/Ledger/Rollback runbook" }
        kind: { $ref: "#/components/schemas/PageKind" }
        canvas_id: { type: string, format: uuid, description: The deck or design this page is (kind deck or design) }
        suggestions: { type: integer, description: Pending agent suggestions (notes) }
        epic: { $ref: "#/components/schemas/EpicRef" }
        author: { $ref: "#/components/schemas/Actor" }
        current_version: { $ref: "#/components/schemas/ArtifactVersion" }
        body_md:
          type: string
          nullable: true
          description: Markdown, or SVG source for mockups; null for files
        outline: { type: array, items: { $ref: "#/components/schemas/OutlineSection" } }
        read_by: { type: array, items: { $ref: "#/components/schemas/ArtifactReader" } }
        versions: { type: array, items: { $ref: "#/components/schemas/ArtifactVersion" } }
        tickets: { type: array, items: { $ref: "#/components/schemas/LinkedTicket" } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    DocCard:
      type: object
      required: [id, type, title, relation, author, read_by_assignee]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/ArtifactType" }
        title: { type: string }
        display_id: { type: string }
        version_label: { type: string }
        relation: { $ref: "#/components/schemas/ArtifactRelation" }
        author: { $ref: "#/components/schemas/Actor" }
        read_by_assignee: { type: boolean, description: "The ticket's agent has read it (\"Read by Atlas\")" }
        review_state: { $ref: "#/components/schemas/MockupReviewState" }
    NewArtifact:
      type: object
      required: [project_key, type]
      properties:
        project_key: { type: string }
        type: { $ref: "#/components/schemas/ArtifactType" }
        title: { type: string }
        summary: { type: string }
        epic_id: { type: string, format: uuid }
        version_label: { type: string }
        body_md: { type: string, description: "Markdown text, or SVG source for type mockup (self-contained: no scripts or external references)" }
        file: { type: string, format: binary, description: "Mockups accept an .svg file, which is stored as text" }
        ticket_key: { type: string, description: "Also attach the new artifact to this ticket (relation context) in the same transaction. The ticket must be in the artifact's project; nothing is created on failure." }
    NewArtifactVersion:
      type: object
      properties:
        version_label: { type: string }
        note: { type: string }
        body_md: { type: string, description: "Markdown text, or SVG source for a mockup" }
        file: { type: string, format: binary }

    ScopeMode:
      type: string
      enum: [allowed, requires_approval, denied]
    Harness:
      type: string
      enum: [claude-code, codex, antigravity]
    Budget:
      type: object
      properties:
        max_runtime: { type: string, description: "Go duration, e.g. 2h" }
        max_turns: { type: integer }
    McpServer:
      type: object
      required: [name, url]
      properties:
        name: { type: string }
        url: { type: string }
        description: { type: string }
    HarnessFallback:
      type: object
      required: [harness, model]
      properties:
        harness: { $ref: "#/components/schemas/Harness" }
        model: { type: string }
        harness_options:
          type: object
          additionalProperties: { type: string }
    AgentSpec:
      type: object
      required: [harness, model, instructions, scopes, budget, max_concurrency, mcp_servers, harness_options]
      properties:
        harness: { $ref: "#/components/schemas/Harness" }
        model: { type: string }
        fallbacks: { type: array, maxItems: 8, items: { $ref: "#/components/schemas/HarnessFallback" } }
        instructions: { type: string }
        review_required: { type: boolean, default: false, description: Require independent reviewer or QA approval before Done }
        scopes:
          type: object
          additionalProperties: { $ref: "#/components/schemas/ScopeMode" }
        budget: { $ref: "#/components/schemas/Budget" }
        max_concurrency: { type: integer }
        mcp_servers: { type: array, items: { $ref: "#/components/schemas/McpServer" } }
        harness_options:
          type: object
          description: Per-harness key/values passed only to that harness's adapter
          additionalProperties:
            type: object
            additionalProperties: { type: string }
        memory: { $ref: "#/components/schemas/AgentMemory" }
        skills:
          type: array
          description: Playbooks the agent loads on demand (native skills on Claude Code, an AGENTS.md index elsewhere)
          items: { $ref: "#/components/schemas/AgentSkill" }
    AgentSkill:
      type: object
      required: [name, description, body]
      properties:
        name: { type: string, description: "Lowercase letters, digits and -; becomes the skill's folder" }
        description: { type: string, description: When to use it. The agent matches tasks against this line }
        body: { type: string, description: Markdown instructions }
    AgentService:
      type: object
      description: A container each turn of a run can reach by name, e.g. the database its tests need. Started next to every turn on a network of that turn's own, sandboxed like the turn but with Docker's default capabilities, and removed when the turn ends.
      required: [name, image]
      properties:
        name: { type: string, description: "Hostname turns use; lowercase letters, digits, - or _" }
        image: { type: string, description: "Image, pulled if missing, e.g. postgres:17-alpine" }
        command: { type: array, items: { type: string }, description: Replaces the image's default command }
        user: { type: string, description: "Run as this user instead of the image's" }
        env: { type: object, additionalProperties: { type: string } }
        tmpfs: { type: array, items: { type: string }, description: Writable scratch directories (absolute paths) }
        healthcheck: { type: array, items: { type: string }, description: "Docker healthcheck test, e.g. [CMD, pg_isready]; turns start once it passes" }
        expose: { type: object, additionalProperties: { type: string }, description: "Environment variables set in each turn, e.g. TEST_DATABASE_URL" }
    TestRecipe:
      type: object
      properties:
        services: { type: array, maxItems: 5, items: { $ref: "#/components/schemas/AgentService" } }
        nix_packages: { type: array, maxItems: 40, items: { type: string }, description: "Flake installables, e.g. nixpkgs#protobuf" }
    TestEnvironment:
      type: object
      required: [repo, recipe, inferred_from, created_at, updated_at]
      properties:
        repo: { type: string, description: "Repository key: host and path, e.g. github.com/acme/app" }
        recipe: { $ref: "#/components/schemas/TestRecipe" }
        inferred_from: { type: array, items: { type: string }, description: Files the first recipe was read from }
        learned_from_run_id: { type: string, format: uuid, description: The run whose turn last added a package }
        edited_at: { type: string, format: date-time, description: When a person last replaced it }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TestEnvironmentInput:
      type: object
      required: [repo, recipe]
      properties:
        repo: { type: string, description: "A repository URL or key; stored as its key" }
        recipe: { $ref: "#/components/schemas/TestRecipe" }
    TestEnvironmentList:
      type: object
      required: [environments]
      properties:
        environments: { type: array, items: { $ref: "#/components/schemas/TestEnvironment" } }
    AgentOverride:
      type: object
      properties:
        harness: { $ref: "#/components/schemas/Harness" }
        model: { type: string }
        instructions_append: { type: string }
        skills_add: { type: array, maxItems: 30, items: { $ref: "#/components/schemas/AgentSkill" }, description: "Skills appended after removals; existing names are skipped unless removed first." }
        skills_remove: { type: array, items: { type: string }, description: "Agent skill names to remove; unknown names are ignored." }
        scopes:
          type: object
          additionalProperties: { $ref: "#/components/schemas/ScopeMode" }
        budget: { $ref: "#/components/schemas/Budget" }
        mcp_servers_add: { type: array, items: { $ref: "#/components/schemas/McpServer" } }
        setup: { type: array, items: { type: string } }
        services: { type: array, maxItems: 5, items: { $ref: "#/components/schemas/AgentService" }, description: "What the project's tests need running (Docker runner only)" }
    ResolvedScope:
      type: object
      required: [scope, mode, source, enforcement, how, description]
      properties:
        scope: { type: string }
        mode: { $ref: "#/components/schemas/ScopeMode" }
        source: { type: string, enum: [agent, project] }
        enforcement: { type: string, enum: [credential, brokered, harness, none] }
        how: { type: string }
        description: { type: string }
    ResolvedDefinition:
      type: object
      required: [harness, model, instructions, scopes, budget, max_concurrency, mcp_servers, harness_options, setup, provenance]
      properties:
        harness: { $ref: "#/components/schemas/Harness" }
        model: { type: string }
        fallbacks: { type: array, items: { $ref: "#/components/schemas/HarnessFallback" } }
        instructions: { type: string }
        scopes: { type: array, items: { $ref: "#/components/schemas/ResolvedScope" } }
        budget: { $ref: "#/components/schemas/Budget" }
        max_concurrency: { type: integer }
        mcp_servers: { type: array, items: { $ref: "#/components/schemas/McpServer" } }
        harness_options:
          type: object
          additionalProperties: { type: string }
        setup: { type: array, items: { type: string } }
        services: { type: array, items: { $ref: "#/components/schemas/AgentService" } }
        memory: { $ref: "#/components/schemas/AgentMemory" }
        skills: { type: array, items: { $ref: "#/components/schemas/AgentSkill" } }
        provenance:
          type: object
          description: Fields a project changed, e.g. {"harness":"project"}
          additionalProperties: { type: string, enum: [agent, project] }
    DefinitionVersion:
      type: object
      required: [id, version, note, created_at]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer }
        note: { type: string }
        created_by: { $ref: "#/components/schemas/UserRef" }
        created_at: { type: string, format: date-time }
    ProjectOverride:
      type: object
      required: [project, override, changes, version, updated_at]
      properties:
        project: { $ref: "#/components/schemas/Project" }
        override: { $ref: "#/components/schemas/AgentOverride" }
        changes: { type: array, items: { type: string } }
        version: { type: integer }
        updated_at: { type: string, format: date-time }
    HarnessInfo:
      type: object
      required: [name, label, tool_gating, permission_prompt, native_cost, resume]
      properties:
        name: { $ref: "#/components/schemas/Harness" }
        label: { type: string }
        tool_gating: { type: boolean }
        permission_prompt: { type: boolean }
        native_cost: { type: boolean }
        resume: { type: boolean }
    ScopeInfo:
      type: object
      required: [scope, description, brokered]
      properties:
        scope: { type: string }
        description: { type: string }
        secret: { type: string }
        brokered: { type: boolean }
        api_only: { type: boolean, description: "Only possible through the Vesper API (wiki edits), so every mode is enforced server-side" }
    AgentDetail:
      type: object
      required: [agent, specialty, definition, spec, versions, overrides, harnesses, catalog]
      properties:
        agent: { $ref: "#/components/schemas/Agent" }
        specialty: { type: string }
        definition: { $ref: "#/components/schemas/DefinitionVersion" }
        spec: { $ref: "#/components/schemas/AgentSpec" }
        versions: { type: array, items: { $ref: "#/components/schemas/DefinitionVersion" } }
        overrides: { type: array, items: { $ref: "#/components/schemas/ProjectOverride" } }
        harnesses: { type: array, items: { $ref: "#/components/schemas/HarnessInfo" } }
        catalog: { type: array, items: { $ref: "#/components/schemas/ScopeInfo" } }

    AgentToken:
      type: object
      required: [id, prefix, label, created_at]
      properties:
        id: { type: string, format: uuid }
        prefix: { type: string }
        label: { type: string }
        created_by: { $ref: "#/components/schemas/UserRef" }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time }
    SecretInfo:
      type: object
      description: Secret metadata. Values are write-only; no part of a value is ever returned.
      required: [id, name, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        project: { $ref: "#/components/schemas/Project" }
        grants_scope: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }
    SecretList:
      type: object
      required: [secrets, key_configured, sign_in_available, known]
      properties:
        secrets: { type: array, items: { $ref: "#/components/schemas/SecretInfo" } }
        key_configured: { type: boolean, description: SECRETS_KEY is set }
        sign_in_available: { type: boolean, description: "A Docker runner is online, so Claude, Codex and GitHub can be signed in from Settings" }
        harness_keys_required: { type: boolean, description: "Runs authenticate with the stored harness keys (the Docker backend); false when they use the host's claude and codex sign-ins, so there is no key to paste" }
        known:
          type: array
          description: Well-known secret names and the scope each backs
          items:
            type: object
            required: [name, description]
            properties:
              name: { type: string }
              grants_scope: { type: string }
              description: { type: string }

    SignInProvider:
      type: string
      enum: [claude, codex, github]

    SignIn:
      type: object
      required: [id, provider, status, url, user_code, needs_code, error, expires_at]
      properties:
        id: { type: string, format: uuid }
        provider: { $ref: "#/components/schemas/SignInProvider" }
        status:
          type: string
          enum: [pending, running, verifying, done, failed, cancelled]
          description: "pending: waiting for the runner. running: the CLI is up, url is set once it printed one. verifying: the pasted code is being checked."
        url: { type: string, description: The provider's sign-in page; empty until the CLI printed it }
        user_code: { type: string, description: The one-time code to enter on that page (Codex and GitHub) }
        needs_code: { type: boolean, description: Claude is waiting for the code its sign-in page shows }
        error: { type: string }
        expires_at: { type: string, format: date-time }

    PlanStep:
      type: object
      required: [position, text, state]
      properties:
        position: { type: integer }
        text: { type: string }
        state: { type: string, enum: [pending, current, done, needs_human, failed] }
    HighlightsBucket:
      type: object
      required: [persona_id, persona, harness, model, effort, effort_level, reasons, turns, duration_ms, timed_turns]
      properties:
        persona_id: { type: string, description: Empty when the replying persona was not recorded or was deleted }
        persona: { type: string }
        harness: { type: string }
        model: { type: string, description: Recorded reply model; empty when unknown }
        effort: { type: string, description: Actual effort; empty means model default or unrecorded }
        effort_level: { type: string, description: Requested automatic effort; empty means chosen or unrecorded }
        reasons: { type: array, items: { type: string } }
        turns: { type: integer, format: int64 }
        duration_ms: { type: integer, format: int64, description: "Sum of completed turn durations from process start to end, excluding queue time" }
        timed_turns: { type: integer, format: int64, description: Completed turns with valid process start and end timestamps }

    CostReport:
      type: object
      required: [total, unpriced_runs, estimated, days, agents, projects, models, purposes, top_tickets]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        total: { $ref: "#/components/schemas/CostSlice" }
        unpriced_runs: { type: integer, description: Runs whose cost is unknown or partial; totals are lower bounds }
        estimated:
          type: object
          description: Spend on estimated tickets and their points, for cost per point
          required: [tickets, points, cost_micros]
          properties:
            tickets: { type: integer }
            points: { type: integer }
            cost_micros: { type: integer, format: int64 }
        days: { type: array, description: Every UTC day in the range, oldest first, empty days included, items: { $ref: "#/components/schemas/CostDay" } }
        agents: { type: array, items: { $ref: "#/components/schemas/CostSlice" } }
        projects: { type: array, items: { $ref: "#/components/schemas/CostSlice" } }
        models: { type: array, description: "Keyed harness/model", items: { $ref: "#/components/schemas/CostSlice" } }
        purposes: { type: array, items: { $ref: "#/components/schemas/CostSlice" } }
        top_tickets: { type: array, description: The 10 most expensive tickets in the range, items: { $ref: "#/components/schemas/CostTicket" } }
    CostSlice:
      type: object
      description: One breakdown row; slices of a breakdown add up to the total. Runs can appear in several model slices.
      required: [key, label, runs, tokens, cost_micros, unpriced_runs]
      properties:
        key: { type: string }
        label: { type: string }
        detail: { type: string, description: "Harness for models, project key for projects" }
        runs: { type: integer }
        tokens: { type: integer, format: int64 }
        cost_micros: { type: integer, format: int64, description: Spend in millionths of a US dollar }
        unpriced_runs: { type: integer }
    CostPart:
      type: object
      required: [key, cost_micros]
      properties:
        key: { type: string }
        cost_micros: { type: integer, format: int64 }
    CostDay:
      type: object
      required: [date, runs, cost_micros, agents, models]
      properties:
        date: { type: string, format: date }
        runs: { type: integer }
        cost_micros: { type: integer, format: int64 }
        agents: { type: array, description: Keyed by agent handle, items: { $ref: "#/components/schemas/CostPart" } }
        models: { type: array, description: "Keyed harness/model", items: { $ref: "#/components/schemas/CostPart" } }
    CostTicket:
      type: object
      required: [key, title, project_key, cost_micros, runs]
      properties:
        key: { type: string }
        title: { type: string }
        project_key: { type: string }
        points: { type: integer }
        cost_micros: { type: integer, format: int64 }
        runs: { type: array, description: Runs behind the spend, sub agents included, newest first, items: { $ref: "#/components/schemas/CostRun" } }
    CostRun:
      type: object
      required: [id, agent, model, state, started_at, cost_micros]
      properties:
        id: { type: string, format: uuid }
        parent_run_id: { type: string, format: uuid }
        agent: { type: string, description: Agent handle }
        model: { type: string }
        state: { type: string }
        started_at: { type: string, format: date-time }
        cost_micros: { type: integer, format: int64 }
    Run:
      type: object
      required: [id, ticket_key, purpose, agent, mode, state, harness, model, started_at, tool_calls, input_tokens, output_tokens, cost_usd, plan, approval_scopes, scopes]
      properties:
        id: { type: string, format: uuid }
        ticket_key: { type: string, description: Empty for standalone planning runs }
        purpose: { type: string, enum: [ticket, planning, chat, research, workflow, learning], description: "What the run works on: a ticket, a plan or a chat" }
        planning_id: { type: string, format: uuid }
        chat_id: { type: string, format: uuid, description: The chat session of a chat run }
        project_key: { type: string, description: "Project of the ticket, plan or chat" }
        work_title: { type: string, description: "Ticket title, plan goal or chat title" }
        branch: { type: string, description: "Ticket runs: the ticket's branch" }
        pr_number: { type: integer }
        pr_url: { type: string }
        pr_state: { type: string }
        child_count: { type: integer, description: "Direct delegated runs" }
        agent: { $ref: "#/components/schemas/AgentRef" }
        mode: { type: string, enum: [managed, unmanaged] }
        state: { type: string, enum: [queued, starting, running, waiting, waiting_for_quota, paused, blocked, completed, failed, cancelled] }
        hold_until: { type: string, format: date-time, description: "waiting_for_quota: when the run next tries to resume" }
        hold_reset_known: { type: boolean, description: "waiting_for_quota: hold_until is the provider's stated reset time, not a backoff" }
        hold_attempts: { type: integer, description: "Consecutive times this run has been held at a provider limit" }
        checkpoint_branch: { type: string, description: "Branch holding the run's unpushed work, pushed before its workspace was given up" }
        checkpoint_error: { type: string, description: "Why the last checkpoint push failed; the workspace is kept until one succeeds" }
        workspace_path: { type: string, description: "The folder on the person's machine holding the run's checkout, while it exists; absent for a checkout in a Docker volume" }
        session_id: { type: string, description: The harness session turns resume }
        dispatched_by: { $ref: "#/components/schemas/UserRef" }
        wait_reason: { type: string, enum: [approval, human_reply, pause, delegation, mockup_review, checks], description: "delegation: waiting for a sub agent the run delegated to; checks: a delegated run that finished, waiting for the server to check its result; mockup_review: waiting for a person to review a UI mockup" }
        parent_run_id: { type: string, format: uuid, description: "Set on a run a main agent delegated to a sub agent; it works in the parent's checkout" }
        harness: { type: string }
        model: { type: string }
        outcome: { type: string }
        started_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time }
        tool_calls: { type: integer }
        input_tokens: { type: integer, format: int64 }
        output_tokens: { type: integer, format: int64 }
        cached_input_tokens: { type: integer, format: int64, description: Input served from cache where the provider reported cache usage }
        uncached_input_tokens: { type: integer, format: int64, description: Reported input not served from cache }
        unreported_input_tokens: { type: integer, format: int64, description: Input whose cache breakdown was not reported }
        cost_usd: { type: number }
        cost_source: { type: string, description: "harness, computed, self_reported, unknown, or partial" }
        setup_ms: { type: integer, format: int64, description: "Cumulative workspace setup time in milliseconds; absent if not timed" }
        harness_ms: { type: integer, format: int64, description: "Cumulative harness process time across all turns, in milliseconds; absent if not timed" }
        checks_ms: { type: integer, format: int64, description: "Time spent on the runner's post-run checks of this delegated run, in milliseconds; absent if not timed" }
        plan: { type: array, items: { $ref: "#/components/schemas/PlanStep" } }
        scopes:
          type: array
          description: Allowed scopes in the run's frozen definition
          items: { type: string }
        approval_scopes:
          type: array
          description: Scopes that need approval in this run
          items: { type: string }
    Approval:
      type: object
      required: [id, run_id, ticket_key, agent, scope, action_summary, action_detail, risk_summary, state, brokered, created_at]
      properties:
        id: { type: string, format: uuid }
        run_id: { type: string, format: uuid }
        ticket_key: { type: string }
        agent: { $ref: "#/components/schemas/AgentRef" }
        scope: { type: string }
        action_summary: { type: string }
        action_detail:
          type: object
          additionalProperties: true
        action_preview: { type: string, description: "What will run, e.g. the SQL, for brokered scopes" }
        risk_summary: { type: string }
        state: { type: string, enum: [pending, approved, denied, expired] }
        brokered: { type: boolean }
        decided_by: { $ref: "#/components/schemas/UserRef" }
        decided_at: { type: string, format: date-time }
        decision_note: { type: string }
        executed_at: { type: string, format: date-time }
        result:
          type: object
          additionalProperties: true
        created_at: { type: string, format: date-time }
    RunTurn:
      type: object
      required: [seq, trigger, input_message, started_at, status, has_log]
      properties:
        seq: { type: integer }
        trigger: { type: string, enum: [start, approval, comment, resume, delegation, image_followup], description: "image_followup: the automatic chat turn that shows the assistant the results of its generate_image calls (no user message)" }
        input_message: { type: string }
        started_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time }
        exit_code: { type: integer }
        status: { type: string, enum: [pending, running, done], description: "Managed turns: waiting for the runner, executing, exited" }
        process_started_at: { type: string, format: date-time }
        has_log: { type: boolean, description: "The raw stream is stored (GET …/turns/{seq}/log)" }
        usage:
          type: object
          additionalProperties: true
    RunEvent:
      type: object
      required: [seq, type, payload, at]
      properties:
        seq: { type: integer, format: int64 }
        type: { type: string, enum: [message, tool_call, tool_result, usage, error, lifecycle] }
        payload:
          type: object
          additionalProperties: true
        at: { type: string, format: date-time }
    RunDetail:
      type: object
      required: [run, turns, approvals, events, child_runs]
      properties:
        run: { $ref: "#/components/schemas/Run" }
        child_runs:
          type: array
          description: Direct delegated runs, including active and finished runs. Fetch each run for its own events and cursor.
          items: { $ref: "#/components/schemas/Run" }
        turns: { type: array, items: { $ref: "#/components/schemas/RunTurn" } }
        approvals: { type: array, items: { $ref: "#/components/schemas/Approval" } }
        events: { type: array, items: { $ref: "#/components/schemas/RunEvent" } }

    NewComment:
      type: object
