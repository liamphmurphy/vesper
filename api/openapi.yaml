        kind:
          type: string
          description: "question is a run waiting on await_human (summary is the question); blocked is a failed or blocked run; stalled is a running run with no event for 30 minutes; merged is a pull request merged in the last 14 days"
          enum: [approval, question, blocked, stalled, mockup, planning, review, dispatch, mention, suggestion, workflow_gate, scheduled, connector_approval, secret_approval, secret_expiring, merged]
        title: { type: string }
        summary: { type: string }
        href: { type: string }
        project: { type: string }
        ticket_key: { type: string }
        created_at: { type: string, format: date-time, description: "When the item last changed; the wait starts here" }
        resolved: { type: boolean }
        read: { type: boolean, description: "Marked done by this person since the item last changed" }
        agent: { $ref: "#/components/schemas/AgentRef" }
        run_id: { type: string, format: uuid, description: "The run to reply to, retry or cancel" }
        artifact_id: { type: string, format: uuid, description: "The mockup or wiki page under review" }
        needs_you:
          type: boolean
          description: "True when the person has something to do (the Needs you tab and badge); false for news that asks nothing (the Updates tab): scheduled results, merged pull requests and mentions that ask no question"

    WorkflowCounts:
      type: object
      required: [total, backlog, todo, in_progress, in_review, done]
      properties:
        total: { type: integer }
        backlog: { type: integer }
        todo: { type: integer }
        in_progress: { type: integer }
        in_review: { type: integer }
        done: { type: integer }

    PerformanceStats:
      type: object
      required: [completed, median_cycle_seconds, merged_prs, closed_prs, spend_usd]
      properties:
        completed: { type: integer }
        median_cycle_seconds: { type: number, format: double, nullable: true }
        merged_prs: { type: integer }
        closed_prs: { type: integer }
        spend_usd: { type: number, format: double }
        unpriced_runs: { type: integer, description: "Runs with unknown or partially priced usage in this window" }

    DailyCompletions:
      type: object
      required: [date, count]
      properties:
        date: { type: string, format: date }
        count: { type: integer }

    RangeStats:
      type: object
      required: [range, generated_at, performance, daily]
      properties:
        range: { type: string }
        generated_at: { type: string, format: date-time }
        performance: { $ref: "#/components/schemas/PerformanceStats" }
        daily: { type: array, items: { $ref: "#/components/schemas/DailyCompletions" } }

    WorkTicket:
      type: object
      required: [id, key, title, status, priority]
      properties:
        id: { type: string, format: uuid }
        key: { type: string }
        title: { type: string }
        status: { $ref: "#/components/schemas/TicketStatus" }
        priority: { $ref: "#/components/schemas/Priority" }

    AgentWork:
      type: object
      required: [run_id, ticket, state, harness, model, started_at, step, step_position, steps_done, steps_total]
      properties:
        run_id: { type: string, format: uuid }
        ticket: { $ref: "#/components/schemas/WorkTicket" }
        state: { type: string }
        harness: { type: string }
        model: { type: string }
        started_at: { type: string, format: date-time }
        step: { type: string }
        step_position: { type: integer }
        steps_done: { type: integer }
        steps_total: { type: integer }

    PlanningWork:
      type: object
      required: [id, run_id, goal, state, harness, model]
      properties:
        id: { type: string, format: uuid }
        run_id: { type: string, format: uuid }
        goal: { type: string }
        state: { type: string }
        harness: { type: string }
        model: { type: string }

    AgentScopeSummary:
      type: object
      required: [scope, mode, enforcement, how]
      properties:
        scope: { type: string }
        mode: { $ref: "#/components/schemas/ScopeMode" }
        enforcement: { type: string, enum: [credential, brokered, harness, none] }
        how: { type: string }

    AgentOverview:
      type: object
      required: [agent, max_concurrency, harness, planning_runs, assignments, queue, queue_count, stats, scopes]
      properties:
        agent: { $ref: "#/components/schemas/Agent" }
        max_concurrency: { type: integer }
        harness: { type: string }
        planning_runs: { type: array, items: { $ref: "#/components/schemas/PlanningWork" } }
        assignments: { type: array, items: { $ref: "#/components/schemas/AgentWork" } }
        queue: { type: array, items: { $ref: "#/components/schemas/WorkTicket" } }
        queue_count: { type: integer }
        stats: { $ref: "#/components/schemas/PerformanceStats" }
        scopes: { type: array, items: { $ref: "#/components/schemas/AgentScopeSummary" } }

    DelegationEfficiency:
      type: object
      required: [agent_id, handle, name, delegations, checked, first_pass, first_pass_rate, repair_loops, bounces, child_cost_usd_micros, parent_cost_usd_micros, total_cost_usd_micros, avg_seconds, avg_setup_seconds, avg_harness_seconds, avg_checks_seconds]
      properties:
        agent_id: { type: string, format: uuid }
        handle: { type: string }
        name: { type: string }
        delegations: { type: integer, description: "Finished delegated runs" }
        checked: { type: integer, description: "Delegated runs the runner checked (older runs were never checked)" }
        first_pass: { type: integer, description: "Runs whose result passed the runner's checks on the first attempt (the server never sent a check failure back) and needed no repeat delegation to the same agent" }
        first_pass_rate: { type: number, format: double, description: "first_pass / checked, 0 to 1; 0 when nothing was checked" }
        repair_loops: { type: integer, description: "Runs followed by another delegation to the same agent under the same parent run" }
        bounces: { type: integer, description: "Times the server sent a mechanical check failure back to the sub agent before waking the main agent, summed over its runs" }
        child_cost_usd_micros: { type: integer, format: int64 }
        parent_cost_usd_micros: { type: integer, format: int64, description: "Main-agent run cost attributed to this agent: each parent run's cost is split evenly by count across its child runs, and this sums the shares of this agent's children" }
        total_cost_usd_micros: { type: integer, format: int64 }
        avg_seconds: { type: number, format: double, description: "Mean elapsed time of a delegated run" }
        avg_setup_seconds: { type: number, format: double, description: "Mean setup time over delegated runs that have timings" }
        avg_harness_seconds: { type: number, format: double, description: "Mean harness time over delegated runs that have timings" }
        avg_checks_seconds: { type: number, format: double, description: "Mean checks time over delegated runs that have timings" }

    DelegationEfficiencyList:
      type: object
      required: [agents]
      properties:
        agents: { type: array, items: { $ref: "#/components/schemas/DelegationEfficiency" } }

    AgentOverviewList:
      type: object
      required: [agents, stats_as_of]
      properties:
        agents: { type: array, items: { $ref: "#/components/schemas/AgentOverview" } }
        stats_as_of: { type: string, format: date-time }

    ProjectOverview:
      type: object
      required: [project, counts, agents, updated_at]
      properties:
        project: { $ref: "#/components/schemas/Project" }
        counts: { $ref: "#/components/schemas/WorkflowCounts" }
        agents: { type: array, items: { $ref: "#/components/schemas/AgentRef" } }
        updated_at: { type: string, format: date-time }

    OverviewArtifact:
      type: object
      required: [id, title, type, href, updated_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        type: { $ref: "#/components/schemas/ArtifactType" }
        href: { type: string }
        updated_at: { type: string, format: date-time }

    EpicOverview:
      type: object
      required: [epic, project, objective, counts, agents, agent_seconds, tickets]
      properties:
        epic: { $ref: "#/components/schemas/Epic" }
        project: { $ref: "#/components/schemas/Project" }
        objective: { type: string }
        owner: { $ref: "#/components/schemas/UserRef" }
        source: { $ref: "#/components/schemas/OverviewArtifact" }
        start_date: { type: string, format: date }
        target_date: { type: string, format: date }
        counts: { $ref: "#/components/schemas/WorkflowCounts" }
        agents: { type: array, items: { $ref: "#/components/schemas/AgentRef" } }
        agent_seconds: { type: number, format: double }
        tickets: { type: array, items: { $ref: "#/components/schemas/WorkTicket" } }

    EpicOverviewList:
      type: object
      required: [epics]
      properties:
        epics: { type: array, items: { $ref: "#/components/schemas/EpicOverview" } }

    Dashboard:
      type: object
      required: [stats, counts, review_over_day, agents, projects, attention, recent_artifacts, runner]
      properties:
        stats: { $ref: "#/components/schemas/RangeStats" }
        counts: { $ref: "#/components/schemas/WorkflowCounts" }
        review_over_day: { type: integer }
        agents: { type: array, items: { $ref: "#/components/schemas/AgentOverview" } }
        projects: { type: array, items: { $ref: "#/components/schemas/ProjectOverview" } }
        attention: { type: array, items: { $ref: "#/components/schemas/InboxItem" } }
        recent_artifacts: { type: array, items: { $ref: "#/components/schemas/OverviewArtifact" } }
        runner: { $ref: "#/components/schemas/RunnerStatus" }
        weekly_spend: { $ref: "#/components/schemas/WeeklySpend" }

    WeeklySpend:
      type: object
      description: Reported cost of runs started since Monday 00:00 UTC
      required: [since, cost_usd, runs, unpriced_runs]
      properties:
        since: { type: string, format: date-time, description: "Start of the week: Monday 00:00 UTC" }
        cost_usd: { type: number, format: double }
        runs: { type: integer, description: Runs started this week }
        unpriced_runs: { type: integer, description: "Runs whose cost is unknown or partial, so cost_usd may be low" }

    AgentRunSummary:
      type: object
      required: [id, ticket, state, harness, model, started_at, cost_usd, tool_calls, tokens]
      properties:
        id: { type: string, format: uuid }
        ticket: { $ref: "#/components/schemas/WorkTicket" }
        state: { type: string }
        harness: { type: string }
        model: { type: string }
        started_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time }
        cached_input_tokens: { type: integer, format: int64, description: Input served from cache where the provider reported cache usage }
        uncached_input_tokens: { type: integer, format: int64, description: Reported input not served from cache }
        unreported_input_tokens: { type: integer, format: int64, description: Input whose cache breakdown was not reported }
        cost_usd: { type: number, format: double }
        cost_source: { type: string }
        tool_calls: { type: integer }
        tokens: { type: integer, format: int64 }

    TicketProposal:
      type: object
      required: [title, description, criteria]
      properties:
        ref: { type: string, description: Stable unique proposal reference }
        depends_on: { type: array, items: { type: string }, description: References to other proposals }
        blocked_by: { type: array, items: { type: string }, description: Existing blocker ticket keys }
        title: { type: string, minLength: 1, maxLength: 300 }
        description: { type: string }
        criteria:
          type: array
          items: { type: string }
        agent_id: { type: string, format: uuid }
        requires_mockup: { type: boolean, description: "The ticket changes UI: a person must approve a mockup before implementation" }
        estimate_points: { $ref: "#/components/schemas/EstimatePoints" }
        estimate_rationale: { type: string, maxLength: 2000 }
        planner_estimate:
          type: object
          readOnly: true
          description: Original planner estimate, preserved across reviewer saves.
          properties:
            points: { $ref: "#/components/schemas/EstimatePoints" }
            rationale: { type: string }
    PlanningInput:
      type: object
      required: [project, agent_id, goal]
      properties:
        project: { type: string }
        agent_id: { type: string, format: uuid }
        goal: { type: string, maxLength: 20000 }
        epic_id: { type: string, format: uuid }
        artifact_id: { type: string, format: uuid }
        context_refs:
          type: array
          maxItems: 20
          description: Wiki pages, sections, artifacts and tickets anywhere in the workspace for the planner to read; delivered as context files when the run starts.
          items: { $ref: "#/components/schemas/ChatContextRef" }
    PlanningSession:
      type: object
      required: [id, project, goal, run_id, run_state, state, revision, proposals, proposal_count, context_refs, ticket_keys, ready_keys, created_at, updated_at, harness, model]
      properties:
        id: { type: string, format: uuid }
        project: { type: string }
        epic_id: { type: string, format: uuid }
        artifact_id: { type: string, format: uuid }
        source_version_id: { type: string, format: uuid }
        goal: { type: string }
        run_id: { type: string, format: uuid }
        run_state: { type: string }
        outcome: { type: string }
        harness: { type: string }
        model: { type: string }
        state: { type: string, enum: [planning, review, accepted, dismissed] }
        revision: { type: integer }
        proposals:
          type: array
          items: { $ref: '#/components/schemas/TicketProposal' }
        proposal_count: { type: integer, description: How many proposals the planner submitted (0 until it does); ticket_keys counts the accepted ones }
        context_refs: { type: array, items: { $ref: "#/components/schemas/ChatContextRef" }, description: What the person attached when starting the plan }
        ready_keys: { type: array, items: { type: string }, description: Created tickets currently ready for manual dispatch }
        ticket_keys:
          type: array
          items: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    NewProject:
      type: object
      required: [key, name, color, repo_url, default_branch]
      properties:
        key: { type: string }
        name: { type: string }
        color: { type: string }
        repo_url: { type: string, description: "GitHub URL: https://github.com/owner/repo[.git] (stored as https://github.com/owner/repo.git; runs use the git:pat token), git@github.com:owner/repo[.git] or ssh://git@github.com/owner/repo[.git] (runs use the git:ssh key). Legacy values are kept until changed." }
        default_branch: { type: string }
    ProjectUpdate:
      type: object
      required: [name, color, repo_url, default_branch, archived, revision]
      properties:
        name: { type: string }
        color: { type: string }
        repo_url: { type: string, description: "GitHub URL: https://github.com/owner/repo[.git] (stored as https://github.com/owner/repo.git; runs use the git:pat token), git@github.com:owner/repo[.git] or ssh://git@github.com/owner/repo[.git] (runs use the git:ssh key). Legacy values are kept until changed." }
        default_branch: { type: string }
        archived: { type: boolean }
        revision: { type: integer }
    TicketDependency:
      type: object
      required: [id, key, title, status]
      properties:
        id: { type: string, format: uuid }
        key: { type: string }
        title: { type: string }
        status: { $ref: '#/components/schemas/TicketStatus' }
    ChatState:
      type: string
      enum: [idle, running, failed]
      description: "idle: waiting for the person; running: a turn is queued or executing; failed: the last turn failed (posting again retries)"
    ChatContextRef:
      type: object
      required: [kind]
      description: Something attached to a message for the assistant to read. Exactly one of id or key; anything in the workspace, whichever project the chat has attached (a canvas must be this chat's).
      properties:
        kind: { type: string, enum: [artifact, section, ticket, page, canvas] }
        id: { type: string, format: uuid, description: "Artifact, wiki page or canvas id" }
        key: { type: string, description: Ticket key, e.g. PAY-214 }
        anchor: { type: string, description: Section anchor when kind is section }
        selection: { $ref: "#/components/schemas/ChatDesignSelection" }
    ChatDesignSelection:
      type: object
      required: [page, nodes, viewport]
      description: What the person had selected in a design when they sent the message. Only on a canvas ref that points at a design (422 otherwise). The assistant is told the design, page, viewport and the selected nodes, and that "this" means them.
      properties:
        page: { type: string, pattern: "^p_[a-z0-9_]{1,40}$" }
        nodes:
          type: array
          maxItems: 100
          items: { type: string, pattern: "^n_[a-z0-9_]{1,40}$" }
        viewport:
          type: object
          required: [x, y, w, h, zoom]
          properties:
            x: { type: number }
            y: { type: number }
            w: { type: number, minimum: 0 }
            h: { type: number, minimum: 0 }
            zoom: { type: number, exclusiveMinimum: 0 }
    ChatCitation:
      type: object
      required: [target]
      description: Something the assistant read while answering (from read_artifact / read_page / get_ticket)
      properties:
        target: { $ref: "#/components/schemas/LinkTarget" }
        artifact_id: { type: string, format: uuid, description: The artifact (or wiki page) that was read }
        title: { type: string }
        path: { type: string, description: Wiki path, for pages }
        version_id: { type: string, format: uuid, description: The exact version that was read }
        version: { type: string, description: "Version label, e.g. v3" }
        section: { type: string, description: Section anchor, when only one section was read }
    ChatSession:
      type: object
      required: [id, title, agent, harness, model, state, archived, revision, message_count, unread, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        project: { type: string, description: "Key of the attached project; absent when none is attached" }
        title: { type: string, description: "Defaults to the start of the first message" }
        agent: { $ref: "#/components/schemas/AgentRef" }
        harness: { $ref: "#/components/schemas/Harness" }
        model: { type: string, description: The model the next turn uses }
        auto_model: { type: boolean, description: "The model is routed per turn: a fresh session starts on the tier the message calls for, and a running one only moves up. Picking a model turns it off." }
        effort: { $ref: "#/components/schemas/ChatEffort" }
        state: { $ref: "#/components/schemas/ChatState" }
        error: { type: string, description: Why the last turn failed, when state is failed }
        current_run_id: { type: string, format: uuid, description: The run serving the current harness segment; its events show live activity }
        workspace_path: { type: string, description: "The folder on the person's machine holding the current run's checkout, while it exists; absent for a checkout in a Docker volume" }
        persona: { $ref: "#/components/schemas/PersonaSummary" }
        participants:
          type: array
          items: { $ref: "#/components/schemas/PersonaSummary" }
          description: "Every persona in the chat: the host first, then the ones mentioned in (by @name or an approved proposal), in the order they joined"
        speaker: { $ref: "#/components/schemas/PersonaSummary" }
        pending_repo_url: { type: string, description: "Repository selected for the next turn while a reply is running" }
        repo_url: { type: string, description: "The active repository; other attached checkouts are preserved when it changes." }
        repositories: { type: array, items: { $ref: "#/components/schemas/ChatRepository" } }
        work_branches:
          type: array
          items: { type: string }
          description: "The branches the coding persona pushed in this chat, oldest first (feat/..., fix/..., chore/...). It makes them as changes are asked for, so a new chat has none. Absent when the chat has no repository."
        commit_email: { type: string, description: "The address picked for this chat's commits. Absent until one is picked, or once it is no longer one of the creator's emails; commits then use their primary email." }
        archived: { type: boolean }
        temporary: { type: boolean, description: "A temporary chat: it doesn't use the person's memory or past chats, stays out of search, and is deleted after a day without messages" }
        parent_chat_id: { type: string, format: uuid, description: "Set on an aside: the chat whose running reply it answers a question about" }
        anchor_message_id: { type: string, format: uuid, description: "Set on a thread (an aside anchored to a message): the parent chat's message it is about" }
        revision: { type: integer }
        message_count: { type: integer }
        unread: { type: integer, description: "Assistant replies newer than the person's read position (POST /chats/{id}/read)" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        last_message_at: { type: string, format: date-time }
        space: { $ref: "#/components/schemas/ChatSpaceRef" }
        preview: { type: string, description: "The start of the newest reply as plain text; only when listing one space's chats" }
    NewChat:
      type: object
      properties:
        project: { type: string, description: "Project to attach from the start; omit for a chat with no project" }
        title: { type: string, maxLength: 200 }
        harness: { $ref: "#/components/schemas/Harness" }
        model: { type: string, description: "Defaults to the harness's default model in GET /chat-models; auto routes the model per turn (see ChatSession.auto_model)" }
        effort: { $ref: "#/components/schemas/ChatEffort" }
        persona_id: { type: string, format: uuid, description: "One of the caller's personas; defaults to their default persona (none when they have no default). Fixed for the chat's life." }
        repo_url: { type: string, description: "A GitHub URL, owner/repository or an unambiguous saved name for a coding persona. Saved repositories aid discovery and never restrict access." }
        commit_email: { type: string, description: "One of the caller's emails for the chat's commits. Only with a repository; 422 otherwise." }
        hidden: { type: boolean, description: "Leave the chat out of chat lists, search and the dock; it stays reachable by id. For a chat that lives behind another screen, like the workflow editor. Fixed for the chat's life." }
        temporary: { type: boolean, description: "Start a temporary chat: its persona neither reads nor writes the caller's memory and can't search their past chats; the chat stays out of search and suggestions and is deleted after a day without messages. Fixed for the chat's life." }
        space_id: { type: string, format: uuid, description: "Start the chat in one of the caller's spaces. Its default persona, project and connectors apply unless persona_id or project is given. 422 for an unknown space." }
        message: { $ref: "#/components/schemas/NewChatMessage" }
    ChatPatch:
      type: object
      required: [revision]
      properties:
        revision: { type: integer }
        title: { type: string, minLength: 1, maxLength: 200 }
        archived: { type: boolean }
        project: { type: string, description: "Key of the project to attach; empty detaches. The next message starts a fresh session with the conversation handed off." }
    NewChatMessage:
      type: object
      required: [body]
      properties:
        research: { type: boolean, description: "Ask for a research plan to approve instead of an answer" }
        body: { type: string, minLength: 1, maxLength: 100000 }
        harness: { $ref: "#/components/schemas/Harness" }
        model: { type: string, description: "From this message on; auto routes it per turn (see ChatSession.auto_model), and any other model turns that off. Omit to keep the chat's." }
        effort:
          type: string
          enum: [default, low, medium, high, xhigh, max]
          description: "Reasoning effort from this message on; default clears it back to the harness's own default. Omit to keep the chat's effort."
        context_refs:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/ChatContextRef" }
        attachment_ids:
          type: array
          maxItems: 5
          description: "Uploads from POST /chat-attachments that you made and haven't attached yet; the assistant gets the files with this message"
          items: { type: string, format: uuid }
    LinkPreview:
      type: object
      required: [url, kind, title, description, site, saved]
      properties:
        url: { type: string }
        kind: { type: string, enum: [site, video] }
        title: { type: string, description: "Empty when the page couldn't be read" }
        description: { type: string }
        site: { type: string, description: "The site's name, or a video's channel" }
        video_id: { type: string, description: The YouTube id, for videos }
        image_url: { type: string, description: Where Vesper serves the stored image }
        saved: { type: boolean, description: Whether the caller has this link in their Library }
    LinkPreviews:
      type: object
      required: [previews]
      properties:
        previews: { type: array, items: { $ref: "#/components/schemas/LinkPreview" } }
    ChatMessageEdit:
      type: object
      required: [body]
      properties:
        body: { type: string }
    ChatAsideStart:
      type: object
      required: [body]
      properties:
        body: { type: string }
        anchor_message_id: { type: string, format: uuid, description: "Starts a thread about this message of the chat instead of an aside about the running reply" }
    ChatFollowup:
      type: object
      required: [id, body, created_at]
      properties:
        id: { type: string, format: uuid }
        body: { type: string }
        created_at: { type: string, format: date-time }
    ChatFollowupList:
      type: object
      required: [followups]
      properties:
        followups:
          type: array
          items: { $ref: "#/components/schemas/ChatFollowup" }
    ChatAsideList:
      type: object
      required: [asides]
      properties:
        asides:
          type: array
          items: { $ref: "#/components/schemas/ChatSession" }
    ChatSearchHit:
      type: object
      required: [message_id, chat_id, chat_title, role, archived, snippet, created_at]
      properties:
        message_id: { type: string, format: uuid }
