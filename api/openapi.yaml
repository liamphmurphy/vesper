openapi: 3.0.3
info:
  title: Vesper API
  version: 0.2.0
  description: |
    REST contract for the Vesper UI and agents. This file is the source of
    truth: `make gen` regenerates the Go server interfaces and the TypeScript client.

    There is no login for now: every request acts as the workspace's local
    user (its first user). Errors share the `Error` shape: 404 not found,
    422 validation (with `field` set when one input is at fault).

    Realtime: `GET /events` (outside /api/v1) is an SSE stream of
    invalidation hints `{"type": "...", "ids": [...]}`; clients refetch.
    Types include `ticket.updated` (ids: the changed ticket ids),
    `epic.updated` (ids: the changed epic ids, sent when an epic, its
    criteria or its tickets' status/estimate change), `activity.created`,
    `approval.created`, `run.updated`, `chat.updated` (ids: the chat id)
    when a chat's messages, state, title, archive flag, harness/model or
    embedded persona summary change, and `persona.updated` (ids: the persona
    ids) when one of the caller's personas is created, edited, deleted, made
    default (old and new default) or gets a new avatar.

    Personas: see the wiki page `Architecture/ADR - Assistant personas`.

    Board, estimates and epic criteria: see the wiki page
    `Architecture/ADR - Kanban board, estimates and epic criteria`.
servers:
  - url: /api/v1
tags:
  - name: learn
    description: Guided Learning modules
  - name: system
  - name: workspace
  - name: tickets
  - name: artifacts
  - name: agents
  - name: secrets
  - name: runs
  - name: chats
  - name: memories
  - name: personas
  - name: library
  - name: spaces
  - name: finance
  - name: docs
  - name: slides
    description: Slide decks in the Slides app
  - name: designs
    description: Flows, diagrams and wireframes in the Designs app
paths:
  /agents/{handle}/runs:
    get:
      operationId: listAgentRuns
      parameters:
        - { name: handle, in: path, required: true, schema: { type: string } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 100000, default: 0 } }
      responses:
        "200":
          description: Run history, newest first, 50 per page
          content:
            application/json:
              schema:
                type: object
                required: [runs, has_more]
                properties:
                  runs: { type: array, items: { $ref: "#/components/schemas/AgentRunSummary" } }
                  has_more: { type: boolean }
        default: { $ref: "#/components/responses/Error" }
  /dashboard:
    get:
      operationId: getDashboard
      summary: Live Dashboard data and recorded performance statistics
      parameters:
        - { name: range, in: query, schema: { type: string, enum: [24h, 7d, 30d], default: 7d } }
      responses:
        "200":
          description: Overview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dashboard" }
        default: { $ref: "#/components/responses/Error" }
  /epics:
    get:
      operationId: listEpicOverviews
      summary: Live EpicOverviewList data and recorded performance statistics
      responses:
        "200":
          description: Overview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EpicOverviewList" }
        default: { $ref: "#/components/responses/Error" }
  /epics/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: updateEpic
      summary: Change an epic. Omitted fields are untouched.
      description: |
        Setting `status: done` is gated: every acceptance criterion must be
        checked and every ticket in the epic must be `done` or `canceled`.
        Otherwise 409, with a message naming the open tickets and the
        unchecked criterion positions. Moving back to `open` is always allowed.
      tags: [tickets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                requires_mockup:
                  type: boolean
                  description: Every ticket in the epic needs a person-approved UI mockup before it can be finished
                status: { $ref: "#/components/schemas/EpicStatus" }
      responses:
        "200":
          description: The updated epic
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Epic" }
        default: { $ref: "#/components/responses/Error" }
  /epics/{id}/review:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: createEpicReview
      summary: Add the epic's final review ticket now
      description: |
        The server creates an epic's final review ticket automatically once its
        last regular ticket finishes (in review, done or canceled). This adds it
        early so it can be dispatched at the end: until the epic's other tickets
        finish, dispatching it is refused. Idempotent: returns the existing
        review ticket if there is one. 409 when the epic is done or its project
        is archived.
      tags: [tickets]
      responses:
        "200":
          description: The epic's final review ticket
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkTicket" }
        default: { $ref: "#/components/responses/Error" }
  /epics/{id}/criteria:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listEpicCriteria
      summary: The epic's final acceptance criteria, in order
      tags: [tickets]
      responses:
        "200":
          description: Criteria
          content:
            application/json:
              schema:
                type: object
                required: [criteria]
                properties:
                  criteria: { type: array, items: { $ref: "#/components/schemas/EpicCriterion" } }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createEpicCriterion
      summary: Append an acceptance criterion to an epic (409 when the epic is done)
      tags: [tickets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EpicCriterion" }
        default: { $ref: "#/components/responses/Error" }
  /epic-criteria/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: updateEpicCriterion
      summary: Edit or tick an epic acceptance criterion
      description: Unticking or editing a criterion of a done epic is 409 (reopen the epic first).
      tags: [tickets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text: { type: string, minLength: 1, maxLength: 1000 }
                done: { type: boolean }
                position: { type: integer, minimum: 1, description: "Move to this 1-based position; other criteria shift to keep positions contiguous." }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EpicCriterion" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteEpicCriterion
      summary: Remove an epic acceptance criterion (later positions move up; 409 when the epic is done)
      tags: [tickets]
      responses:
        "204":
          description: Deleted
        default: { $ref: "#/components/responses/Error" }
  /agent-overviews:
    get:
      operationId: listAgentOverviews
      summary: Live AgentOverviewList data and recorded performance statistics
      responses:
        "200":
          description: Overview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentOverviewList" }
        default: { $ref: "#/components/responses/Error" }
  /delegation-efficiency:
    get:
      operationId: listDelegationEfficiency
      summary: What delegating to each sub agent costs, and how often its first attempt passes the runner's checks
      responses:
        "200":
          description: Per sub agent efficiency
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DelegationEfficiencyList" }
        default: { $ref: "#/components/responses/Error" }
  /inbox:
    get:
      operationId: listInbox
      summary: Attention items for the local user, including resolved history
      parameters:
        - { name: project, in: query, schema: { type: string } }
      responses:
        "200":
          description: Inbox items
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/InboxItem" } }
        default: { $ref: "#/components/responses/Error" }
  /inbox/read:
    post:
      operationId: readInboxItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "204": { description: Marked read }
        default: { $ref: "#/components/responses/Error" }
  /search:
    get:
      operationId: search
      summary: Search tickets, artifacts, wiki pages, epics, agents, runs and the local user's chats, messages, workflows, personas, memories and Library
      parameters:
        - $ref: "#/components/parameters/IncludeAgent"
        - { name: q, in: query, required: true, schema: { type: string, maxLength: 500 } }
        - { name: project, in: query, schema: { type: string } }
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: object
                required: [hits]
                properties:
                  hits: { type: array, items: { $ref: "#/components/schemas/SearchHit" } }
        default: { $ref: "#/components/responses/Error" }
  /health:
    get:
      operationId: getHealth
      summary: Liveness and dependency status
      tags: [system]
      responses:
        "200":
          description: All dependencies reachable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: One or more dependencies are unreachable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /me:
    get:
      operationId: getProfile
      summary: The signed-in person's profile
      tags: [workspace]
      responses:
        "200":
          description: The caller
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateProfile
      summary: Edit your display name, role title and email addresses
      description: |
        Only the caller's own profile. Initials are recomputed from the new
        name. 422 for an empty name, anything over the limits, or an invalid
        or repeated email; 409 when the primary email belongs to someone else.
      tags: [workspace]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfilePatch" }
      responses:
        "200":
          description: The updated profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /me/avatar:
    put:
      operationId: uploadProfileAvatar
      summary: Set or replace your profile picture
      description: |
        Same rules as PUT /personas/{id}/avatar: PNG, JPEG or WebP, at most
        1 MB (1,048,576 bytes), sniffed by the server; SVG is never accepted.
        413 over the limit, 415 for any other type, 422 for an empty file.
      tags: [workspace]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "200":
          description: Your profile with its new avatar_url
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteProfileAvatar
      summary: Remove your profile picture (idempotent)
      tags: [workspace]
      responses:
        "200":
          description: Your profile without an avatar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        default: { $ref: "#/components/responses/Error" }
  /me/onboarding/complete:
    post:
      operationId: completeOnboarding
      summary: Mark the Welcome Wizard finished
      description: Idempotent; running the wizard again from Settings keeps the first completion time.
      tags: [workspace]
      responses:
        "200":
          description: Your profile with onboarded_at set
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        default: { $ref: "#/components/responses/Error" }
  /harness/{harness}/verify:
    parameters:
      - { name: harness, in: path, required: true, schema: { $ref: "#/components/schemas/Harness" } }
    post:
      operationId: verifyHarness
      summary: Store a harness credential and check that chats can list its models
      description: |
        With a credential, checks it and stores it as the harness's key secret
        (harness:anthropic for claude-code, harness:openai for codex), replacing
        any earlier one only when it works: an API key is checked before it is
        stored; a plan login is stored, listed through a runner, and the earlier
        value put back when the listing fails, or is still pending (a first
        login stays while pending: verify again without a credential to follow
        it). Only models listed
        for the new login count. Without a credential, only checks what is
        already configured (a stored key, or the host's CLI login when runs use
        it). A credential is refused (422) when runs use the host's CLI
        sign-ins (SecretList.harness_keys_required false), since it would
        never be checked there. A subscription
        is a Claude setup-token (sk-ant-oat…) or a Codex auth.json; an api_key
        is an Anthropic (sk-ant-…) or OpenAI (sk-…) API key. The credential is
        never echoed back. 409 when secrets are off (SECRETS_KEY unset) and a
        credential was sent; 422 when it doesn't have the expected shape.
      tags: [chats]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HarnessVerifyRequest" }
      responses:
        "200":
          description: What discovery found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HarnessVerifyResult" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /users/{userId}/avatar:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getUserAvatar
      summary: A workspace member's profile picture
      description: |
        Any member of the caller's workspace. Served like persona avatars:
        the type sniffed at upload, `X-Content-Type-Options: nosniff` and a
        locked-down CSP. 404 when the person has no picture or is in another
        workspace.
      tags: [workspace]
      responses:
        "200":
          description: The image
          headers:
            X-Content-Type-Options: { schema: { type: string, enum: [nosniff] } }
            Content-Security-Policy: { schema: { type: string } }
            Cache-Control: { schema: { type: string } }
          content:
            image/*:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /bootstrap:
    get:
      operationId: getBootstrap
      summary: Everything the shell and pickers need in one call (`me` is the local user)
      tags: [workspace]
      responses:
        "200":
          description: Workspace context for the signed-in user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bootstrap" }
        default: { $ref: "#/components/responses/Error" }

  /tickets:
    get:
      operationId: listTickets
      summary: List tickets for a view, with optional filters
      tags: [tickets]
      parameters:
        - name: project
          in: query
          description: Project key, e.g. PAY
          schema: { type: string }
        - name: view
          in: query
          schema:
            type: string
            enum: [active, backlog, agent_owned, needs_human, all]
            default: active
        - name: status
          in: query
          description: Restrict to one status (applied within the view)
          schema: { $ref: "#/components/schemas/TicketStatus" }
        - { name: ready, in: query, description: Assigned tickets ready for manual dispatch, schema: { type: boolean } }
        - name: assignee
          in: query
          description: Agent handle
          schema: { type: string }
        - name: label
          in: query
          description: Label id
          schema: { type: string, format: uuid }
        - name: q
          in: query
          description: Free-text search over key, title and description
          schema: { type: string }
        - { name: epic, in: query, description: Epic id, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Matching tickets, ordered by status then priority
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketList" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createTicket
      summary: Create a ticket
      tags: [tickets]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewTicket" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        default: { $ref: "#/components/responses/Error" }

  /tickets/bulk:
    post:
      operationId: bulkUpdateTickets
      summary: Apply one patch to many tickets
      tags: [tickets]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                required: [updated]
                properties:
                  updated: { type: integer }
        default: { $ref: "#/components/responses/Error" }

  /tickets/{key}:
    parameters:
      - $ref: "#/components/parameters/TicketKey"
    get:
      operationId: getTicket
      summary: A ticket with its criteria
      tags: [tickets]
      responses:
        "200":
          description: The ticket
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateTicket
      summary: Change ticket fields. Omitted fields are untouched; null clears.
      description: |
        Revision-checked: when `revision` is sent it must equal the ticket's
        current `revision`, otherwise 409 (`conflict`) and nothing changes;
        refetch and retry. The board and the edit modal always send it;
        callers that omit it get last-write-wins. Every applied change bumps
        `revision` by one (including runner, agent and PR-sync changes);
        criteria edits through `/criteria` don't.
        422 (`invalid`, with `field`) on an unknown status or priority, an
        `estimate_points` value outside the scale, or an epic from another
        project. Setting `canceled` while the ticket has a live run is 409.
      tags: [tickets]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TicketPatch" }
      responses:
        "200":
          description: The updated ticket
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        default: { $ref: "#/components/responses/Error" }

  /tickets/{key}/activity:
    parameters:
      - $ref: "#/components/parameters/TicketKey"
    get:
      operationId: listTicketActivity
      summary: The ticket timeline, oldest first
      tags: [tickets]
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/ActivityEvent" }
        default: { $ref: "#/components/responses/Error" }

  /tickets/{key}/comments:
    parameters:
      - $ref: "#/components/parameters/TicketKey"
    post:
      operationId: createComment
      summary: Comment on a ticket (appears in the timeline)
      tags: [tickets]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewComment" }
      responses:
        "201":
          description: The timeline event for the comment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivityEvent" }
        default: { $ref: "#/components/responses/Error" }

  /tickets/{key}/criteria:
    parameters:
      - $ref: "#/components/parameters/TicketKey"
    post:
      operationId: createCriterion
      summary: Add an acceptance criterion
      tags: [tickets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Criterion" }
        default: { $ref: "#/components/responses/Error" }

  /criteria/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: updateCriterion
      summary: Edit or tick an acceptance criterion
      tags: [tickets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text: { type: string, minLength: 1, maxLength: 1000 }
                done: { type: boolean }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Criterion" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteCriterion
      summary: Remove an acceptance criterion
      tags: [tickets]
      responses:
        "204":
          description: Deleted
        default: { $ref: "#/components/responses/Error" }

  /tickets/{key}/artifacts:
    parameters:
      - $ref: "#/components/parameters/TicketKey"
    post:
      operationId: attachArtifact
      summary: Attach an artifact to a ticket as context (or as generated output)
      tags: [tickets, artifacts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [artifact_id]
              properties:
                artifact_id: { type: string, format: uuid }
                relation: { $ref: "#/components/schemas/ArtifactRelation" }
      responses:
        "200":
          description: The ticket with its artifacts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        default: { $ref: "#/components/responses/Error" }

  /tickets/{key}/artifacts/{artifactId}:
    parameters:
      - $ref: "#/components/parameters/TicketKey"
      - name: artifactId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: detachArtifact
      summary: Remove an artifact from a ticket
      tags: [tickets, artifacts]
      responses:
        "200":
          description: The ticket with its artifacts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        default: { $ref: "#/components/responses/Error" }

  /artifacts:
    get:
      operationId: listArtifacts
      summary: Artifacts, newest first, with per-type counts for the tabs
      tags: [artifacts]
      parameters:
        - name: type
          in: query
          schema: { $ref: "#/components/schemas/ArtifactType" }
        - name: project
          in: query
          description: Project key
          schema: { type: string }
        - name: q
          in: query
          description: Full-text search over titles, summaries and contents
          schema: { type: string }
      responses:
        "200":
          description: Matching artifacts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArtifactList" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createArtifact
      summary: Create an artifact from markdown (body_md) or an uploaded file
      description: |
        Send exactly one of `body_md` or `file`. Markdown files (.md, text/markdown)
        are stored as text so they can be outlined and searched; anything else is
        stored in object storage. The title defaults to the first heading, then
        the filename.
      tags: [artifacts]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/NewArtifact" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Artifact" }
        default: { $ref: "#/components/responses/Error" }

  /artifacts/{id}:
    parameters:
      - $ref: "#/components/parameters/ArtifactId"
    get:
      operationId: getArtifact
      summary: An artifact with its current version, outline, readers, history and tickets
      tags: [artifacts]
      responses:
        "200":
          description: The artifact
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Artifact" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateArtifact
      summary: Edit title, summary or epic (contents change via new versions)
      tags: [artifacts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, minLength: 1, maxLength: 300 }
                summary: { type: string, maxLength: 2000 }
                epic_id: { type: string, format: uuid, nullable: true }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Artifact" }
        default: { $ref: "#/components/responses/Error" }

  /artifacts/{id}/versions:
    parameters:
      - $ref: "#/components/parameters/ArtifactId"
    post:
      operationId: createArtifactVersion
      summary: Add a version (markdown, SVG source in body_md for mockups, or file); it becomes current
      tags: [artifacts]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/NewArtifactVersion" }
      responses:
        "201":
          description: The artifact at its new version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Artifact" }
        default: { $ref: "#/components/responses/Error" }

  /artifacts/{id}/versions/{versionId}/review:
    parameters:
      - $ref: "#/components/parameters/ArtifactId"
      - name: versionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: reviewArtifactVersion
      summary: Approve a mockup version or request changes. Only the current version can be reviewed; waiting agent runs resume with the decision.
      tags: [artifacts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approved, changes_requested] }
                note: { type: string, maxLength: 2000, description: Required when requesting changes }
                pins:
                  type: array
                  maxItems: 50
                  description: Comments pinned on the drawing. They're saved with the review and appended to its note as a numbered list.
                  items: { $ref: "#/components/schemas/MockupPin" }
      responses:
        "200":
          description: The reviewed mockup
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Artifact" }
        default: { $ref: "#/components/responses/Error" }

  /artifacts/{id}/versions/{versionId}/content:
    parameters:
      - $ref: "#/components/parameters/ArtifactId"
      - name: versionId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: download
        in: query
        description: Send Content-Disposition attachment instead of inline
        schema: { type: boolean }
    get:
      operationId: getArtifactContent
      summary: The raw content of one version (markdown text, mockup SVG as image/svg+xml, or the stored file)
      tags: [artifacts]
      responses:
        "200":
          description: Raw bytes
          content:
            "*/*":
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Error" }

  /agents:
    post:
      operationId: createAgent
      summary: Create an agent with a default definition
      tags: [agents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [handle, name]
              properties:
                handle: { type: string }
                name: { type: string }
                role: { type: string }
                specialty: { type: string }
                color_index: { type: integer }
                kind: { $ref: "#/components/schemas/AgentKind" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentDetail" }
        default: { $ref: "#/components/responses/Error" }

  /agents/{handle}:
    parameters:
      - $ref: "#/components/parameters/AgentHandle"
    get:
      operationId: getAgent
      summary: An agent with its current definition, history and project overrides
      tags: [agents]
      responses:
        "200":
          description: The agent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentDetail" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteAgent
      summary: Delete an agent (archived, so run history stays); 409 while it has open tickets or runs in progress
      tags: [agents]
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }

  /agents/{handle}/definition:
    parameters:
      - $ref: "#/components/parameters/AgentHandle"
    put:
      operationId: saveAgentDefinition
      summary: Save a new immutable definition version (runs in progress keep their snapshot)
      tags: [agents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, role, specialty, color_index, spec]
              properties:
                name: { type: string }
                role: { type: string }
                specialty: { type: string }
                color_index: { type: integer }
                kind: { $ref: "#/components/schemas/AgentKind", description: "Omit to keep the current kind. A sub agent can't have open tickets assigned." }
                spec: { $ref: "#/components/schemas/AgentSpec" }
                note: { type: string, description: "What changed, for the version list" }
      responses:
        "200":
          description: The agent at its new version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentDetail" }
        default: { $ref: "#/components/responses/Error" }

  /agents/{handle}/overrides/{project}:
    parameters:
      - $ref: "#/components/parameters/AgentHandle"
      - name: project
        in: path
        required: true
        description: Project key
        schema: { type: string }
    put:
      operationId: setAgentOverride
      summary: Set a project's override. An empty override removes it. Scopes can only tighten.
      tags: [agents]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentOverride" }
      responses:
        "200":
          description: The agent with its overrides
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentDetail" }
        default: { $ref: "#/components/responses/Error" }

  /agents/{handle}/resolved:
    parameters:
      - $ref: "#/components/parameters/AgentHandle"
      - name: project
        in: query
        description: Project key; omit for the bare definition
        schema: { type: string }
    get:
      operationId: getResolvedDefinition
      summary: The definition merged with a project's override, as a run would snapshot it
      tags: [agents]
      responses:
        "200":
          description: Resolved definition
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResolvedDefinition" }
        default: { $ref: "#/components/responses/Error" }

  /agents/{handle}/tokens:
    parameters:
      - $ref: "#/components/parameters/AgentHandle"
    get:
      operationId: listAgentTokens
      summary: Tokens for unmanaged sessions (bring your own agent)
      tags: [agents]
      responses:
        "200":
          description: Tokens, newest first
          content:
            application/json:
              schema:
                type: object
                required: [tokens, mcp_url]
                properties:
                  tokens: { type: array, items: { $ref: "#/components/schemas/AgentToken" } }
                  mcp_url: { type: string, description: Where agents connect }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createAgentToken
      summary: Mint a token. The plaintext is returned once and never stored.
      tags: [agents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string, maxLength: 80 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [token, info, mcp_url]
                properties:
                  token: { type: string }
                  info: { $ref: "#/components/schemas/AgentToken" }
                  mcp_url: { type: string }
        default: { $ref: "#/components/responses/Error" }

  /agents/{handle}/tokens/{tokenId}:
    parameters:
      - $ref: "#/components/parameters/AgentHandle"
      - name: tokenId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: revokeAgentToken
      summary: Revoke a token immediately
      tags: [agents]
      responses:
        "204":
          description: Revoked
        default: { $ref: "#/components/responses/Error" }

  /instance/export:
    get:
      operationId: exportInstance
      summary: Every table and stored object as one zip, to move Vesper to another machine
      description: >
        Streamed, so a large instance never sits in memory; a failure partway
        ends the download early and leaves a zip that won't open. The archive
        holds all data, including secrets sealed with SECRETS_KEY. Import is
        the `vesper import` command, which needs the same key and an empty
        instance.
      tags: [workspace]
      responses:
        "200":
          description: Zip archive
          content:
            application/zip:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Error" }

  /secrets:
    get:
      operationId: listSecrets
      summary: Secret names and metadata (values are never returned)
      tags: [secrets]
      responses:
        "200":
          description: Secrets
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecretList" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: setSecret
      summary: Create or replace a secret's value (409 when SECRETS_KEY isn't set)
      tags: [secrets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, value]
              properties:
                name: { type: string }
                value: { type: string }
                grants_scope: { type: string }
                project_key: { type: string, description: Omit for a workspace-wide secret }
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecretInfo" }
        default: { $ref: "#/components/responses/Error" }

  /secrets/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: deleteSecret
      summary: Delete a secret
      tags: [secrets]
      responses:
        "204":
          description: Deleted
        default: { $ref: "#/components/responses/Error" }

  /sign-ins:
    post:
      operationId: startSignIn
      summary: >-
        Start a Claude, Codex or GitHub sign-in. The Docker runner runs the
        provider's CLI in a throwaway container and stores the login as
        harness:anthropic, harness:openai or git:pat. Replaces a sign-in
        already in progress for that provider. 409 without a Docker runner or SECRETS_KEY.
      tags: [secrets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider]
              properties:
                provider: { $ref: "#/components/schemas/SignInProvider" }
      responses:
        "201":
          description: Started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignIn" }
        default: { $ref: "#/components/responses/Error" }

  /sign-ins/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getSignIn
      summary: A sign-in's progress
      tags: [secrets]
      responses:
        "200":
          description: Sign-in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignIn" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: cancelSignIn
      summary: Cancel a sign-in in progress
      tags: [secrets]
      responses:
        "204":
          description: Cancelled
        default: { $ref: "#/components/responses/Error" }

  /sign-ins/{id}/code:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: submitSignInCode
      summary: Hand Claude's sign-in code to the waiting CLI (Claude only, once its link is shown)
      tags: [secrets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        "200":
          description: Handed over
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignIn" }
        default: { $ref: "#/components/responses/Error" }

  /approvals/{id}/{decision}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: decision
        in: path
        required: true
        schema: { type: string, enum: [approve, deny] }
    post:
      operationId: decideApproval
      summary: Approve or deny an agent's request. The run resumes with the decision.
      tags: [runs]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, maxLength: 2000 }
      responses:
        "200":
          description: Decided
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Approval" }
        default: { $ref: "#/components/responses/Error" }

  /tickets/{key}/dispatch:
    parameters:
      - $ref: "#/components/parameters/TicketKey"
    get:
      operationId: getDispatchPreview
      summary: Exactly what a run of this ticket would get, for the dispatch dialog
      tags: [runs]
      responses:
        "200":
          description: The preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DispatchPreview" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: dispatchTicket
      summary: "Approve & dispatch: queue a managed run for the assigned agent"
      tags: [runs]
      responses:
        "200":
          description: The ticket, with its queued run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        default: { $ref: "#/components/responses/Error" }

  /tickets/dispatch:
    post:
      operationId: dispatchTickets
      summary: Bulk dispatch (all or nothing)
      tags: [runs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [keys]
              properties:
                keys: { type: array, items: { type: string }, minItems: 1, maxItems: 100 }
      responses:
        "200":
          description: How many were queued
          content:
            application/json:
              schema:
                type: object
                required: [dispatched]
                properties:
                  dispatched: { type: integer }
        default: { $ref: "#/components/responses/Error" }

  /runner:
    get:
      operationId: getRunnerStatus
      summary: Runner heartbeats, slots and the queue
      tags: [runs]
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunnerStatus" }
        default: { $ref: "#/components/responses/Error" }

  /runner/settings:
    put:
      operationId: updateRunnerSettings
      summary: Turn host-folder workspaces on or off
      description: |
        With host_folder_workspaces on, a run started afterwards keeps its
        checkout in a folder on the person's machine (under the runner's
        RUNNER_HOST_WORKSPACES_DIR) instead of a Docker volume, so they can
        open it in their own editor. Runs that already have a workspace keep
        it where it is. The folder itself is runner configuration and can't
        be set here. Has no effect on a runner without that folder configured.
      tags: [runs]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RunnerSettings" }
      responses:
        "200":
          description: Status with the new setting
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunnerStatus" }
        default: { $ref: "#/components/responses/Error" }

  /image-engine:
    get:
      operationId: getImageEngine
      summary: Which engine makes images, and which are connected
      description: |
        Images are made by Codex or Antigravity. engine is the workspace's
        choice (auto uses the first connected, Codex first); a persona or a
        workflow step may override it. options says whether each engine can
        make an image right now.
      tags: [workspace]
      responses:
        "200":
          description: The choice and the engines
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImageEngineSettings" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: updateImageEngine
      summary: Choose the workspace's image engine
      tags: [workspace]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [engine]
              properties:
                engine: { type: string, enum: [auto, codex, antigravity] }
      responses:
        "200":
          description: The saved choice and the engines
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImageEngineSettings" }
        default: { $ref: "#/components/responses/Error" }

  /runner/environment:
    get:
      operationId: getRunnerEnvironment
      summary: Observed tools, dependencies and caches from workspace setup
      tags: [runs]
      parameters:
        - name: run_id
          in: query
          schema: { type: string, format: uuid }
          description: Return the environment recorded for this exact run
      responses:
        "200":
          description: Live runner capacity and the latest setup snapshots per runner and project (up to 50)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunnerEnvironment" }
        default: { $ref: "#/components/responses/Error" }

  /runner/test-environments:
    get:
      operationId: listTestEnvironments
      summary: What each repository's tests need in a turn, as inferred and learned
      description: |
        A repository's test environment is the services started next to each
        turn and the Nix packages installed when a run starts. Its first run
        infers it from the repository's CI workflows and compose files; tools
        agents install with Nix are added after each turn. Services declared
        on a project override win over it.
      tags: [runs]
      responses:
        "200":
          description: Test environments, by repository
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestEnvironmentList" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: putTestEnvironment
      summary: Replace a repository's test environment
      description: Agents keep adding Nix packages they install afterwards; services are only ever changed here or by forgetting it.
      tags: [runs]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TestEnvironmentInput" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestEnvironment" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteTestEnvironment
      summary: Forget a repository's test environment; its next run infers it again
      tags: [runs]
      parameters:
        - { name: repo, in: query, required: true, schema: { type: string }, description: "Repository key, e.g. github.com/acme/app" }
      responses:
        "204": { description: Forgotten }
        default: { $ref: "#/components/responses/Error" }

  /runs/{id}/turns/{seq}/log:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: seq
        in: path
        required: true
        schema: { type: integer }
    get:
      operationId: getTurnLog
      summary: The raw harness stream of one turn (JSONL)
      tags: [runs]
      responses:
        "200":
          description: Raw log
          content:
            application/x-ndjson:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Error" }

  /highlights:
    get:
      operationId: getHighlights
      summary: Your persona reply turns, grouped by recorded routing decisions
      description: >-
        Private to the signed-in person. Counts one sample per replying turn,
        including legacy replies without turn metadata as unknown. Dates are
        the first reply UTC date for each turn. Model usage does not imply automatic model selection.
      tags: [runs]
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: project, in: query, schema: { type: string } }
      responses:
        "200":
          description: Aggregated reply turns; never includes message content
          content:
            application/json:
              schema:
                type: object
                required: [buckets]
                properties:
                  buckets: { type: array, items: { $ref: "#/components/schemas/HighlightsBucket" } }
        default: { $ref: "#/components/responses/Error" }

  /costs:
    get:
      operationId: getCosts
      summary: Spend aggregated from run cost counters, for the Costs page and cost chips
      description: >-
        Every number is summed server-side from runs.cost_usd_micros (sub agent runs
        included), so breakdowns, days and chips reconcile with each other. Chat runs
        are split by the model of each reply. Omit from and to for all-time spend
        (cost chips); days are only listed when both are given.
      tags: [runs]
      parameters:
        - { name: from, in: query, description: First UTC day (inclusive), schema: { type: string, format: date } }
        - { name: to, in: query, description: Last UTC day (inclusive), schema: { type: string, format: date } }
        - { name: project, in: query, description: Project key, schema: { type: string } }
        - { name: ticket, in: query, description: Ticket key (its runs and their sub agents), schema: { type: string } }
        - { name: chat, in: query, description: Chat session id (every run segment of the chat), schema: { type: string, format: uuid } }
        - { name: epic, in: query, description: "Epic id (runs of its tickets, sub agents included)", schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The cost report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CostReport" }
        default: { $ref: "#/components/responses/Error" }

  /runs:
    get:
      operationId: listRuns
      summary: Top-level runs, newest first, 50 per page (delegated runs are counted in child_count; a ticket filter lists them too)
      tags: [runs]
      parameters:
        - name: state
          in: query
          description: "live (queued to waiting, the default), all, or one run state"
          schema: { type: string, enum: [live, all, queued, starting, running, waiting, waiting_for_quota, paused, blocked, completed, failed, cancelled], default: live }
        - { name: agent, in: query, description: Agent handle, schema: { type: string } }
        - { name: project, in: query, description: Project key, schema: { type: string } }
        - { name: purpose, in: query, schema: { type: string, enum: [ticket, planning, chat, research, workflow, learning] } }
        - { name: ticket, in: query, description: "Ticket key: every run on that ticket, delegated runs included", schema: { type: string } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 100000, default: 0 } }
      responses:
        "200":
          description: A page of runs
          content:
            application/json:
              schema:
                type: object
                required: [runs, has_more]
                properties:
                  runs: { type: array, items: { $ref: "#/components/schemas/Run" } }
                  has_more: { type: boolean }
        default: { $ref: "#/components/responses/Error" }

  /runs/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getRun
      summary: A run with its turns, plan, approvals and events (the run log)
      tags: [runs]
      parameters:
        - name: after
          in: query
          description: Only events after this sequence number
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: The run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunDetail" }
        default: { $ref: "#/components/responses/Error" }

  /runs/{id}/{action}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: action
        in: path
        required: true
        schema: { type: string, enum: [pause, resume, cancel, retry] }
    post:
      operationId: controlRun
      summary: Pause, resume or cancel a run, or retry a failed one (returns the new run). Resume on a waiting_for_quota run tries again immediately.
      tags: [runs]
      responses:
        "200":
          description: The run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        default: { $ref: "#/components/responses/Error" }

  /wiki/pages:
    get:
      operationId: listWikiPages
      summary: Every wiki page (the page tree), with pending suggestion counts
      tags: [wiki]
      parameters:
        - $ref: "#/components/parameters/IncludeAgent"
        - name: tag
          in: query
          description: Filter by an exact case-insensitive tag (including inline tags)
          schema: { type: string }
      responses:
        "200":
          description: Pages, sorted by path
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WikiTree" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createWikiPage
      summary: Create a page at a path
      tags: [wiki]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewWikiPage" }
      responses:
        "201":
          description: The new page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Artifact" }
        default: { $ref: "#/components/responses/Error" }

  /wiki/canvas-pages/{canvas_id}:
    get:
      operationId: getCanvasPage
      summary: The Knowledge page a deck or design is
      description: Every deck and design is a page (LAZYAGENTS-212); this finds it from the deck's or design's canvas id, for links made before they moved into Knowledge.
      tags: [wiki]
      parameters:
        - name: canvas_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CanvasPageRef" }
        default: { $ref: "#/components/responses/Error" }

  /wiki/page:
    get:
      operationId: getWikiPage
      summary: A page by path (or a renamed page's old path)
      tags: [wiki]
      parameters:
        - name: path
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Artifact" }
        default: { $ref: "#/components/responses/Error" }

  /wiki/patterns:
    get:
      operationId: findPatterns
      summary: Find published patterns (Patterns/<Topic>/<Title>) by fuzzy search; an empty q browses by topic then title
      tags: [wiki]
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: topic
          in: query
          description: Go, React, Postgres, Testing, API, Architecture or Process
          schema: { type: string }
        - name: tag
          in: query
          description: Only patterns with every one of these tags (repeat for several; AND)
          style: form
          explode: true
          schema: { type: array, items: { type: string } }
        - name: limit
          in: query
          description: Default 10, at most 50
          schema: { type: integer }
      responses:
        "200":
          description: Matching patterns, best first
          content:
            application/json:
              schema:
                type: object
                required: [patterns, tags]
                properties:
                  patterns: { type: array, items: { $ref: "#/components/schemas/WikiPattern" } }
                  tags:
                    type: array
                    description: Tag facet for q and topic (before the tag filter), most used first
                    items: { $ref: "#/components/schemas/TagCount" }
        default: { $ref: "#/components/responses/Error" }

  /wiki/adrs:
    get:
      operationId: listWikiADRs
      summary: Architecture decisions (wiki pages titled "ADR …" and ADR documents) with the status and open questions parsed from their body
      tags: [wiki]
      responses:
        "200":
          description: ADRs with open questions first, then newest first
          content:
            application/json:
              schema:
                type: object
                required: [adrs]
                properties:
                  adrs: { type: array, items: { $ref: "#/components/schemas/WikiADR" } }
        default: { $ref: "#/components/responses/Error" }

  /wiki/pages/{id}/citations:
    parameters:
      - $ref: "#/components/parameters/ArtifactId"
    get:
      operationId: getWikiCitations
      summary: Runs and chats that read a page (or any document), from recorded reads
      tags: [wiki]
      responses:
        "200":
          description: Citations, most recent first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WikiCitations" }
        default: { $ref: "#/components/responses/Error" }

  /wiki/pages/{id}:
    parameters:
      - $ref: "#/components/parameters/ArtifactId"
    put:
      operationId: saveWikiPage
      summary: Save a page's body (a new version, silently) and/or move it to a new path
      tags: [wiki]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WikiPageSave" }
      responses:
        "200":
          description: The page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Artifact" }
        default: { $ref: "#/components/responses/Error" }

  /wiki/suggestions:
    get:
      operationId: listWikiSuggestions
      summary: Agent edits waiting for a person, oldest first
      tags: [wiki]
      parameters:
        - name: artifact_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Pending suggestions
          content:
            application/json:
              schema:
                type: object
                required: [suggestions]
                properties:
                  suggestions: { type: array, items: { $ref: "#/components/schemas/WikiSuggestion" } }
        default: { $ref: "#/components/responses/Error" }

  /wiki/suggestions/{versionId}/{decision}:
    parameters:
      - name: versionId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: decision
        in: path
        required: true
        schema: { type: string, enum: [accept, reject] }
    post:
      operationId: decideWikiSuggestion
      summary: Accept (publish as the next version) or reject a suggestion
      tags: [wiki]
      responses:
        "204": { description: Decided }
        default: { $ref: "#/components/responses/Error" }

  /wiki/export:
    get:
      operationId: exportWiki
      summary: Every page as an Obsidian-compatible vault (zip of markdown files)
      tags: [wiki]
      responses:
        "200":
          description: Zip archive
          content:
            application/zip:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Error" }

  /wiki/import:
    post:
      operationId: importWiki
      summary: Import a vault zip; each .md file creates or replaces the page at its path
      tags: [wiki]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "200":
          description: What changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WikiImportResult" }
        default: { $ref: "#/components/responses/Error" }

  /knowledge/resolve:
    get:
      operationId: resolveLinks
      summary: Resolve [[link]] texts to what they point at (for rendering)
      tags: [knowledge]
      parameters:
        - name: ref
          in: query
          required: true
          description: Link texts as written inside [[…]], without the brackets
          style: form
          explode: true
          schema: { type: array, items: { type: string }, maxItems: 200 }
      responses:
        "200":
          description: One entry per distinct ref
          content:
            application/json:
              schema:
                type: object
                required: [links]
                properties:
                  links: { type: array, items: { $ref: "#/components/schemas/ResolvedLink" } }
        default: { $ref: "#/components/responses/Error" }

  /knowledge/suggest:
    get:
      operationId: suggestLinks
      summary: "[[ autocomplete over pages, artifacts, tickets, epics and agents"
      tags: [knowledge]
      parameters:
        - $ref: "#/components/parameters/IncludeAgent"
        - name: q
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Candidates, best first
          content:
            application/json:
              schema:
                type: object
                required: [targets]
                properties:
                  targets: { type: array, items: { $ref: "#/components/schemas/LinkTarget" } }
        default: { $ref: "#/components/responses/Error" }

  /knowledge/backlinks:
    get:
      operationId: getBacklinks
      summary: Linked and unlinked mentions of an artifact, ticket, epic or agent
      tags: [knowledge]
      parameters:
        - $ref: "#/components/parameters/NodeKind"
        - $ref: "#/components/parameters/NodeId"
      responses:
        "200":
          description: Mentions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Backlinks" }
        default: { $ref: "#/components/responses/Error" }

  /knowledge/link-mention:
    post:
      operationId: linkMention
      summary: Turn the first unlinked mention of a target in a source into a [[link]]
      tags: [knowledge]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_kind, target_id, source_kind, source_id]
              properties:
                target_kind: { $ref: "#/components/schemas/NodeKind" }
                target_id: { type: string, format: uuid }
                source_kind: { type: string, enum: [artifact, ticket] }
                source_id: { type: string, format: uuid }
      responses:
        "204": { description: Linked }
        default: { $ref: "#/components/responses/Error" }

  /knowledge/graph:
    get:
      operationId: getGraph
      summary: The local link graph around a node (1–2 hops, both directions)
      tags: [knowledge]
      parameters:
        - $ref: "#/components/parameters/IncludeAgent"
        - $ref: "#/components/parameters/NodeKind"
        - $ref: "#/components/parameters/NodeId"
        - name: depth
          in: query
          schema: { type: integer, minimum: 1, maximum: 2 }
      responses:
        "200":
          description: Nodes and edges
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Graph" }
        default: { $ref: "#/components/responses/Error" }

  /knowledge/search:
    get:
      operationId: searchKnowledge
      summary: Full-text search over pages, artifacts and tickets, boosted by links
      tags: [knowledge]
      parameters:
        - $ref: "#/components/parameters/IncludeAgent"
        - name: q
          in: query
          required: true
          schema: { type: string }
        - name: kind
          in: query
          style: form
          explode: true
          schema: { type: array, items: { type: string } }
      responses:
        "200":
          description: Hits
          content:
            application/json:
              schema:
                type: object
                required: [hits]
                properties:
                  hits: { type: array, items: { $ref: "#/components/schemas/SearchHit" } }
        default: { $ref: "#/components/responses/Error" }

  /planning-sessions:
    get:
      operationId: listPlanningSessions
      responses:
        '200':
          description: Recent planning sessions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PlanningSession' }
    post:
      operationId: startPlanning
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlanningInput' }
      responses:
        '201':
          description: Approved planning run queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanningSession' }
  /planning-sessions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getPlanningSession
      responses:
        '200':
          description: Planning session and draft proposals
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanningSession' }
    patch:
      operationId: reviewPlanning
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision, action, proposals]
              properties:
                revision: { type: integer }
                action: { type: string, enum: [save, accept, dismiss] }
                proposals:
                  type: array
                  items: { $ref: '#/components/schemas/TicketProposal' }
      responses:
        '200':
          description: Draft saved, accepted or dismissed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanningSession' }

  /projects:
    get:
      operationId: listProjects
      responses:
        '200':
          description: Active and archived workspace projects
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Project' } }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewProject' }
      responses:
        '201':
          description: Created project
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        default: { $ref: '#/components/responses/Error' }
  /saved-views:
    get:
      operationId: listSavedViews
      summary: The signed-in person's saved ticket-list views, by name
      tags: [tickets]
      responses:
        "200":
          description: Saved views, ordered by name
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedViewList" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createSavedView
      summary: Save a ticket-list view for the signed-in person
      tags: [tickets]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SavedViewInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedView" }
        default: { $ref: "#/components/responses/Error" }
  /saved-views/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateSavedView
      summary: Rename a saved view or replace its query
      tags: [tickets]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SavedViewPatch" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedView" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteSavedView
      summary: Delete a saved view (tickets are untouched)
      tags: [tickets]
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }
  /memories:
    get:
      operationId: listMemories
      summary: The signed-in person's assistant memories, newest change first (or ranked by q)
      description: |
        Memory is strictly per person: only the signed-in person's entries are
        ever returned. That includes each of their personas' own memories
        (persona_id set) unless about narrows it. With q, results are ranked
        by full-text relevance over title, tags, summary and body (plus fuzzy
        title matching).
      tags: [memories]
      parameters:
        - { name: q, in: query, description: Search text, schema: { type: string, maxLength: 500 } }
        - { name: type, in: query, description: Only entries of this type, schema: { $ref: "#/components/schemas/MemoryType" } }
        - { name: include_retired, in: query, description: Also list entries superseded by newer ones, schema: { type: boolean, default: false } }
        - { name: offset, in: query, description: "Skip this many (listing only; search returns the top 50)", schema: { type: integer, minimum: 0, maximum: 100000, default: 0 } }
        - { name: about, in: query, description: "Whose memory: all (default), person (what the assistant remembers about the person) or persona (personas' own memories)", schema: { $ref: "#/components/schemas/MemoryAbout" } }
        - { name: persona_id, in: query, description: Only this persona's own memory (implies about=persona), schema: { type: string, format: uuid } }
        - { name: space_id, in: query, description: "Only this space's memory", schema: { type: string, format: uuid } }
        - { name: sort, in: query, description: "updated: newest change first (default); created: newest first. Listing only", schema: { type: string, enum: [updated, created], default: updated } }
      responses:
        "200":
          description: Memories, 50 per page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemoryList" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createMemory
      summary: Add a memory by hand, e.g. a moment to a persona's own memory
      description: |
        Saved like the assistant's own save_memory: a near-duplicate in the same
        memory is updated instead (moments are always added), and text that
        looks like a credential is refused with 422. Source is "manual". A
        moment needs persona_id.
      tags: [memories]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemoryCreate" }
      responses:
        "200":
          description: The saved (or updated near-duplicate) entry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Memory" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteAllMemories
      summary: Forget everything the assistant remembers about the signed-in person, and its personas' own memories unless about narrows it
      tags: [memories]
      parameters:
        - { name: confirm, in: query, required: true, description: Must be true; guards against accidental wipes, schema: { type: boolean } }
        - { name: about, in: query, description: "Whose memory: all (default), person or persona", schema: { $ref: "#/components/schemas/MemoryAbout" } }
        - { name: persona_id, in: query, description: Only this persona's own memory (implies about=persona), schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted: { type: integer, description: Entries deleted (not counting retired entries they superseded) }
        default: { $ref: "#/components/responses/Error" }
  /memories/export:
    get:
      operationId: exportMemories
      summary: Every memory of the signed-in person, retired entries included, oldest first
      tags: [memories]
      responses:
        "200":
          description: Export
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemoryExport" }
        default: { $ref: "#/components/responses/Error" }
  /memories/import:
    post:
      operationId: importMemories
      summary: Add memories brought over from another assistant (e.g. ChatGPT or Claude)
      description: |
        Each entry is saved like the assistant's own save_memory: a near-duplicate
        of an existing entry updates it instead of adding another, and text that
        looks like a credential is refused. Entries are validated one by one, so
        a bad entry lands in failed and the rest are still saved. Source is
        recorded as "import".
      tags: [memories]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemoryImport" }
      responses:
        "200":
          description: What was saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemoryImportResult" }
        default: { $ref: "#/components/responses/Error" }
  /memories/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getMemory
      summary: One memory entry; another person's entry is a 404
      tags: [memories]
      responses:
        "200":
          description: Memory
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Memory" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateMemory
      summary: Edit a memory entry, retire it (superseded_by) or restore it (restore)
      description: Text that looks like a credential or token is refused with 422.
      tags: [memories]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemoryPatch" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Memory" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteMemory
      summary: Forget a memory entry and the retired entries it superseded
      tags: [memories]
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }
  /projects/{key}:
    parameters:
      - { name: key, in: path, required: true, schema: { type: string } }
    put:
      operationId: updateProject
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectUpdate' }
      responses:
        '200':
          description: Updated project (key is immutable)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        default: { $ref: '#/components/responses/Error' }
  /projects/{key}/board:
    parameters:
      - { name: key, in: path, required: true, description: "Project key, e.g. PAY", schema: { type: string } }
    get:
      operationId: getProjectBoard
      summary: Kanban board for a project, optionally one epic
      description: |
        One column per status in workflow order (backlog, todo, in_progress,
        in_review, done; canceled only when `include_canceled`). Cards are
        ordered by priority (urgent first), then `sort_order`, then ticket
        number; there's no manual ranking in v1. The done and canceled
        columns hold the 50 most recently updated cards (`truncated` says
        when more exist). "Blocked" is not a column: cards with
        `unmet_dependencies > 0` show a badge.
      tags: [tickets]
      parameters:
        - { name: epic, in: query, description: Only tickets in this epic; also fills `epic`, schema: { type: string, format: uuid } }
        - { name: assignee, in: query, description: Agent handle, schema: { type: string } }
        - { name: include_canceled, in: query, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: The board
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Board" }
        default: { $ref: "#/components/responses/Error" }
  /tickets/{key}/dependencies:
    parameters:
      - { name: key, in: path, required: true, schema: { type: string } }
    put:
      operationId: setTicketDependencies
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision, blocked_by]
              properties:
                revision: { type: integer }
                blocked_by: { type: array, maxItems: 50, items: { type: string } }
      responses:
        '200':
          description: Updated ticket with dependency relationships
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
        default: { $ref: '#/components/responses/Error' }

  /chats:
    get:
      operationId: listChats
      summary: The local user's chats, most recently active first
      tags: [chats]
      parameters:
        - { name: project, in: query, description: Project key; omit for all projects, schema: { type: string } }
        - { name: archived, in: query, description: "true lists archived chats instead", schema: { type: boolean, default: false } }
        - name: persona_id
          in: query
          description: |
            Only chats with this persona (as host or a participant who joined
            it): a persona id of the caller's, `all`
            for every persona, or `none` for chats without one (the built-in
            Assistant). Omitted: the caller's default persona, or `none` when
            they have no default. 422 for an unknown id or another person's.
          schema: { type: string, pattern: "^(all|none|[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$" }
        - name: space
          in: query
          description: |
            Only chats in this space: a space id of the caller's (each chat then
            carries a `preview`), `all` for personal chats in any space or none, or
            `none` (the default) for chats outside every space. 422 for an
            unknown id. App conversations are returned only for an explicit
            app space id, keeping them out of normal history.
          schema: { type: string, pattern: "^(all|none|[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$" }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 100000, default: 0 } }
      responses:
        "200":
          description: Chats, 50 per page
          content:
            application/json:
              schema:
                type: object
                required: [chats, has_more]
                properties:
                  chats: { type: array, items: { $ref: "#/components/schemas/ChatSession" } }
                  has_more: { type: boolean }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createChat
      summary: Start a chat, optionally with a project attached
      description: |
        Creates an idle chat. Nothing runs until the first message. When
        `message` is set it is posted as the first message (same rules as
        POST /chats/{id}/messages). Every chat is with the workspace's
        Personal Assistant, created on first use. The chat keeps `persona_id`
        (default: the caller's default persona, or none) for its whole life.
        422 for an unknown project, 409 for an archived one, 422 for a harness/model not in
        GET /chat-models, or a persona_id that isn't one of the caller's.
      tags: [chats]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewChat" }
      responses:
        "201":
          description: The chat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatSession" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /chat-attachments:
    post:
      operationId: uploadChatAttachment
      summary: Upload a file to attach to your next assistant message
      description: |
        Stores one file for the caller. It stays unattached and private to
        the caller until a message lists its id in `attachment_ids`; each
        upload can be attached to one message. Supported: PDF, PNG, JPEG,
        GIF, WebP, plain text, Markdown, CSV, JSON and zip archives, up to
        25 MB each. The assistant gets a zip's files unpacked (at most 200
        files, 5 MB each and 50 MB in all; the rest are named as skipped).
        422 for an unsupported type, an empty file, a zip that can't be read
        or has no files, or one over the limit.
      tags: [chats]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatAttachment" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /chat-attachments/{attachmentId}/content:
    parameters:
      - { name: attachmentId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getChatAttachmentContent
      summary: Download one of your chat attachments
      description: 404 unless the caller uploaded it.
      tags: [chats]
      responses:
        "200":
          description: The file
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /chat-messages/{messageId}/link-previews:
    parameters:
      - { name: messageId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listLinkPreviews
      summary: Preview cards for the pages and videos an assistant reply recommends
      description: Reads the reply's recommend fences, fetching each page once. 404 unless the chat is the caller's.
      tags: [chats]
      responses:
        "200":
          description: One preview per recommended URL, in reply order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LinkPreviews" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /link-previews/{id}/image:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getLinkPreviewImage
      summary: A recommended page's stored preview image
      tags: [chats]
      responses:
        "200":
          description: The image
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /workflows:
    get:
      operationId: listWorkflows
      summary: The signed-in person's workflows, most recently edited first
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workflows" }
    post:
      operationId: createWorkflow
      summary: Start a workflow draft
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewWorkflow" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workflow" }

  /workflows/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getWorkflow
      summary: One workflow with its draft and any pending suggestion
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workflow" }
    patch:
      operationId: updateWorkflow
      summary: Save the draft; publishing is what validates it
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkflowPatch" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workflow" }
    delete:
      operationId: deleteWorkflow
      summary: Delete a workflow; runs already started keep going
      responses:
        "204": { description: Deleted }

  /workflows/{id}/publish:
    post:
      operationId: publishWorkflow
      summary: Validate the draft and make it what new runs use
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workflow" }

  /workflows/{id}/proposals/{proposalId}/{action}:
    post:
      operationId: resolveWorkflowProposal
      summary: Apply or discard a persona's suggested edit
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: proposalId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: action, in: path, required: true, schema: { type: string, enum: [apply, discard] } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workflow" }

  /workflow-runs:
    get:
      operationId: listWorkflowRuns
      summary: The signed-in person's workflow runs, newest first
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowRuns" }

  /workflow-runs/{id}:
    get:
      operationId: getWorkflowRun
      summary: One workflow run and its steps
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowRun" }

  /workflow-runs/{id}/images/{imageId}/content:
    get:
      operationId: getWorkflowRunImageContent
      summary: One image a step of this run generated
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: imageId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The image
          content:
            image/*:
              schema: { type: string, format: binary }

  /workflow-runs/{id}/gate:
    post:
      operationId: decideWorkflowGate
      summary: Approve a gate, request changes or reject it
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkflowGateDecision" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowRun" }

  /workflow-runs/{id}/stop:
    post:
      operationId: stopWorkflowRun
      summary: Stop a workflow run
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowRun" }

  /chats/{id}/workflows:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listChatWorkflowRuns
      summary: The chat's workflow runs, oldest first
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowRuns" }
    post:
      operationId: startChatWorkflow
      summary: Confirm and start a published workflow from a chat
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkflowRunStart" }
      responses:
        "201":
          description: Started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowRun" }

  /chats/{id}/runs:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listChatTicketRuns
      summary: The ticket runs this chat started, oldest first
      tags: [chats]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatTicketRuns" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: startChatTicketRun
      summary: Start a ticket's run from a chat, as the signed-in person
      description: |
        The persona offers a ```dispatch card; nothing runs until the person
        presses Start here. Runs the same checks as dispatching from the
        ticket (an assigned main agent, no live run, no hard blockers) and
        records the person as the dispatcher. The chat then follows the run.
        A card may offer several tickets; each starts at most once from it
        (409 for a second start of the same ticket from the same reply).
      tags: [chats]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatTicketRunStart" }
      responses:
        "201":
          description: Started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatTicketRun" }
        default: { $ref: "#/components/responses/Error" }

  /library:
    get:
      operationId: listLibraryItems
      summary: The signed-in person's Library, newest first
      description: |
        The Library keeps what a person wants from their assistant chats for
        good: every image a persona generates is added automatically, and
        SVG diagrams when the person saves them. It is strictly per person,
        and items outlive the chat they came from.
      tags: [library]
      parameters:
        - { name: kind, in: query, description: Only items of this kind, schema: { $ref: "#/components/schemas/LibraryItemKind" } }
        - { name: offset, in: query, description: Skip this many, schema: { type: integer, minimum: 0, maximum: 100000, default: 0 } }
      responses:
        "200":
          description: Items, 60 per page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryList" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: uploadLibraryItem
      summary: Add an image or audio file of your own to your Library
      description: |
        Stores one image (PNG, JPEG, GIF or WebP), audio file (MP3, WAV,
        OGG or M4A) or any other file, up to 25 MB, in the caller's Library,
        e.g. a photo to use as their reference image, a voice memo, a script,
        a zip or a spreadsheet. Anything that isn't an image or audio is kept
        as a file and only ever downloaded: executables and disk images are
        refused, and a zip is listed, never unpacked. It counts against the same
        storage cap as generated images. An audio file is checked against its
        name, and its length and waveform are read for WAV and MP3. 422 for
        a file that isn't what its name says, an executable or disk image, an empty file,
        one over the limit or a full Library.
      tags: [library]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryItem" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /library/diagrams:
    post:
      operationId: saveLibraryDiagram
      summary: Save an SVG diagram from a chat reply to your Library
      description: |
        Keeps one SVG document from an assistant reply in a chat of the
        caller's. Saving the same diagram again returns the existing item. It
        counts against the same storage cap as images. 404 unless the message
        is in one of your chats; 422 unless it is an assistant reply and the
        source is an SVG document of at most 1 MiB, or for a full Library.
      tags: [library]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LibraryDiagramSave" }
      responses:
        "201":
          description: Saved, or already in the Library
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryItem" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /library/links:
    post:
      operationId: saveLibraryLink
      summary: Save a page or video a persona recommended to your Library
      description: The URL must be recommended by the reply. Saving the same link again returns the existing item.
      tags: [library]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LibraryLinkSave" }
      responses:
        "201":
          description: The saved link
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryItem" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /library/links/summary:
    post:
      operationId: saveLibraryLinkSummary
      summary: Keep a persona's summary with its Library link, saving the link if needed
      description: The reply must answer a request to summarize that URL, and a reply in the chat must recommend it.
      tags: [library]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LibraryLinkSummarySave" }
      responses:
        "201":
          description: The link, with its summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryItem" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /library/{itemId}/link-status:
    parameters:
      - { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: setLibraryLinkStatus
      summary: Mark a saved link to read or done
      tags: [library]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LibraryLinkStatusSet" }
      responses:
        "204": { description: Updated }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /library/{itemId}:
    parameters:
      - { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: renameLibraryItem
      summary: Rename an item in your Library
      description: 404 unless it is yours. 422 for an empty or over-long title.
      tags: [library]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, minLength: 1, maxLength: 300 }
      responses:
        "200":
          description: The renamed item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryItem" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteLibraryItem
      summary: Remove an item from your Library
      description: The image stays in its chat while that chat exists. 404 unless it is yours.
      tags: [library]
      responses:
        "204": { description: Removed }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /library/{itemId}/reference:
    parameters:
      - { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: setLibraryReference
      summary: Use an image as a reference likeness
      description: |
        Marks the image as what one of the caller's personas looks like
        (role persona, with persona_id) or what the caller looks like (role
        self). Generated images of that persona or person start from it. Each
        persona and the caller have at most one: this replaces the previous
        one, and replaces any reference the image already was. 404 unless the
        image is yours; 422 for a diagram, or unless persona_id is one of
        your personas.
      tags: [library]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LibraryReferenceSet" }
      responses:
        "204": { description: Set }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: clearLibraryReference
      summary: Stop using an image as a reference
      description: The image stays in the Library. 404 unless it is yours.
      tags: [library]
      responses:
        "204": { description: Cleared }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /library/{itemId}/content:
    parameters:
      - { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getLibraryItemContent
      summary: Download one of your Library items
      description: 404 unless it is yours.
      tags: [library]
      parameters:
        - { name: download, in: query, description: Serve as an attachment instead of inline, schema: { type: boolean, default: false } }
        - { name: Range, in: header, description: "One byte range, e.g. bytes=0-1023, so a video can seek", schema: { type: string } }
      responses:
        "200":
          description: The file
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "206":
          description: The requested range of the file
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/Error" }
        "416": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /library/{itemId}/preview:
    parameters:
      - { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getLibraryFilePreview
      summary: A file's contents at a glance
      description: |
        The first 200 lines of a text or code file, the first 20 rows of a CSV
        or TSV, or the names in a zip, read when asked for. Nothing is run,
        rendered or unpacked. 404 unless it is your file.
      tags: [library]
      responses:
        "200":
          description: The preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryFilePreview" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /library/{itemId}/poster:
    parameters:
      - { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getLibraryItemPoster
      summary: A video's poster image
      description: 404 unless it is yours and has one.
      tags: [library]
      responses:
        "200":
          description: The image
          content:
            image/*:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /chats/{id}:
    parameters:
      - { $ref: "#/components/parameters/ChatId" }
    get:
      operationId: getChat
      tags: [chats]
      responses:
        "200":
          description: The chat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatSession" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateChat
      summary: Rename, archive, restore or change the project of a chat (revision-checked)
      description: Archiving ends the chat's current run and removes its workspace. 409 on a stale revision or while a turn is running.
      tags: [chats]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatPatch" }
      responses:
        "200":
          description: The updated chat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatSession" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteChat
      summary: Delete a chat and its messages
      description: Cancels a running turn first. The chat's runs stay for cost history.
      tags: [chats]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /chats/{id}/messages:
    parameters:
      - { $ref: "#/components/parameters/ChatId" }
    get:
      operationId: listChatMessages
      summary: Messages in order of seq
      tags: [chats]
      parameters:
        - { name: after, in: query, description: Only messages with a greater seq (refetch after chat.updated), schema: { type: integer, minimum: 0 } }
        - { name: before, in: query, description: Only messages with a smaller seq (page back through history), schema: { type: integer, minimum: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 100 } }
      responses:
        "200":
          description: Messages, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [messages, has_more]
                properties:
                  messages: { type: array, items: { $ref: "#/components/schemas/ChatMessage" } }
                  has_more: { type: boolean, description: Older messages exist before the first one returned }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: postChatMessage
      summary: Send a message and start the assistant's turn
      description: |
        Stores the user message and queues a turn. The reply arrives
        later as an assistant message; watch for `chat.updated`.
        `harness`/`model`/`effort` switch the chat from this message on (same harness:
        same session, new model or effort; other harness: new session with a
        transcript handoff, see the ADR).
        A message sent while a turn is running interrupts it: the turn is
        stopped and the next one answers this message together with the
        previous one and what the stopped reply had written and which tools it
        called, in the same session. If the stopped turn hadn't started, the
        new turn replaces it at once. Otherwise the message is stored without a
        turn (`run_turn_id` empty), the chat stays `running`, and its turn
        starts once the stopped process has exited; Stop
        (`/chats/{id}/cancel`) in that window leaves it unanswered.
        404 unknown chat; 409 when the chat is archived, or while an earlier
        interruption is still waiting for its turn; 422 empty body, unknown
        harness/model, an effort the model doesn't offer, a context ref outside the chat's project, or an
        attachment id that isn't the caller's unattached upload.
      tags: [chats]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewChatMessage" }
      responses:
        "202":
          description: Message stored and turn queued
          content:
            application/json:
              schema:
                type: object
                required: [chat, message]
                properties:
                  chat: { $ref: "#/components/schemas/ChatSession" }
                  message: { $ref: "#/components/schemas/ChatMessage" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /chats/{id}/edit-last:
    parameters:
      - { $ref: "#/components/parameters/ChatId" }
    post:
      operationId: editLastChatMessage
      summary: Replace your last message and redo its turn
      description: |
        Removes everything after your newest message, replaces its text and
        queues a new turn. The same text retries the turn. 409 while a reply is
        running, or when the chat is archived or has no message.
      tags: [chats]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatMessageEdit" }
      responses:
        "202":
          description: Message updated and turn queued
          content:
            application/json:
              schema:
                type: object
                required: [chat, message]
                properties:
                  chat: { $ref: "#/components/schemas/ChatSession" }
                  message: { $ref: "#/components/schemas/ChatMessage" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /chat-search:
    get:
      operationId: searchChats
      summary: Search the messages of your own chats
      tags: [chats]
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Best matches first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatSearchResults" }
        default: { $ref: "#/components/responses/Error" }

  /chats/{id}/research:
    parameters:
      - { $ref: "#/components/parameters/ChatId" }
    get:
      operationId: listChatResearch
      summary: The chat's research jobs, oldest first
      tags: [chats]
      responses:
        "200":
          description: Jobs with progress and any finished report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResearchJobs" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: startChatResearch
      summary: Approve a research plan and start its researchers
      tags: [chats]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResearchStart" }
      responses:
        "201":
          description: The started job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResearchJob" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /chats/{id}/research/{jobId}/{action}:
    parameters:
      - { $ref: "#/components/parameters/ChatId" }
      - { name: jobId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: action, in: path, required: true, schema: { type: string, enum: [stop, finish] } }
    post:
      operationId: controlChatResearch
      summary: Stop a job without a report, or finish it early from what's been found
      tags: [chats]
      responses:
        "200":
          description: The job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResearchJob" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /learn/courses:
    get:
      operationId: listCourses
      summary: The person's learning modules, newest first
      tags: [learn]
      responses:
        "200":
          description: Modules
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/CourseSummary" } }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createCourse
      summary: Start a module by drafting its outline
      tags: [learn]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CourseCreate" }
      responses:
        "201":
          description: The module
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Course" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /learn/courses/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getCourse
      summary: A module with its lessons and the person's progress; answer keys stay on the server until earned
      tags: [learn]
      responses:
        "200":
          description: The module
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Course" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteCourse
      summary: Delete a module and its tutor chat, stopping any build
      tags: [learn]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /learn/courses/{id}/outline:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: editCourseOutline
      summary: Rearrange an outline awaiting approval; an unsound order is refused
      tags: [learn]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CourseOutlineEdit" }
      responses:
        "200":
          description: The module
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Course" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /learn/courses/{id}/approve:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: approveCourse
      summary: Approve the outline and start research
      tags: [learn]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CourseApprove" }
      responses:
        "200":
          description: The module
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Course" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /learn/courses/{id}/next-part:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: startCourseNextPart
      summary: Start outlining a module's next part
      description: For a ready module built in parts. Its outline comes back for approval like the first part's.
      tags: [learn]
      responses:
        "200":
          description: The module
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Course" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /learn/courses/{id}/stop:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: stopCourse
      summary: Stop a module's build
      tags: [learn]
      responses:
        "200":
          description: The module
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Course" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /learn/courses/{id}/checks/{checkId}/attempts:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: checkId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: attemptCourseCheck
      summary: Answer a check; the server grades it
      tags: [learn]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CourseAttemptCreate" }
      responses:
        "201":
          description: The result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseAttempt" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /learn/courses/{id}/attempts/{attemptId}/grade:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: attemptId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: gradeCourseAttempt
      summary: Mark your own short answer against its rubric
      tags: [learn]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [correct]
              properties:
                correct: { type: boolean }
      responses:
        "204": { description: Marked }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /learn/courses/{id}/tutor:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: postCourseTutorMessage
      summary: Ask the module's tutor about a lesson
      tags: [learn]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body, lesson]
              properties:
                body: { type: string, minLength: 1 }
                lesson: { type: string, description: The key of the lesson being studied }
      responses:
        "202": { description: Queued }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /chats/{id}/videos:
    parameters:
      - { $ref: "#/components/parameters/ChatId" }
    get:
      operationId: listChatVideos
      summary: The chat's videos, oldest first
      description: |
        Videos a coding chat renders with code during its turn. Each follows
        its stages (write, stills, render, encode, save) as the agent and its
        renderer report them; a finished one is also kept in the Library.
      tags: [chats]
      responses:
        "200":
          description: The chat's videos with their frames
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatVideos" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /chats/{id}/videos/{videoId}/frames/{kind}/{idx}:
    parameters:
      - { $ref: "#/components/parameters/ChatId" }
      - { name: videoId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: kind, in: path, required: true, schema: { $ref: "#/components/schemas/ChatVideoFrameKind" } }
      - { name: idx, in: path, required: true, schema: { type: integer, minimum: 0, maximum: 10000000 } }
    get:
      operationId: getChatVideoFrame
      summary: One picture of a video in progress
      description: A still, a filmstrip cell, the latest rendered frame or the poster. The URL's v changes with the picture, so it can be cached.
      tags: [chats]
      parameters:
        - { name: v, in: query, description: The frame's version, from ChatVideoFrame, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: The image
          content:
            image/*:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /chats/{id}/videos/{videoId}/content:
    parameters:
      - { $ref: "#/components/parameters/ChatId" }
      - { name: videoId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getChatVideoContent
      summary: A finished video, for playing or downloading
      description: Supports a single byte Range, so players can seek.
      tags: [chats]
      parameters:
        - { name: download, in: query, description: Serve as an attachment instead of inline, schema: { type: boolean, default: false } }
        - { name: Range, in: header, description: "One byte range, e.g. bytes=0-1023", schema: { type: string } }
      responses:
        "200":
          description: The video
          content:
            video/mp4:
              schema: { type: string, format: binary }
        "206":
          description: The requested range of the video
          content:
            video/mp4:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/Error" }
        "416": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /chats/{id}/audio:
    parameters:
      - { $ref: "#/components/parameters/ChatId" }
    get:
      operationId: listChatAudio
      summary: The chat's audio, oldest first
      description: |
        Audio a coding chat renders with code during its turn (MIDI through a
        soundfont, a synth script, ffmpeg). Each follows its stages (compose,
        render, check, save) as the agent and its renderer report them; a
        finished one is also kept in the Library.
      tags: [chats]
      responses:
        "200":
          description: The chat's audio
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatAudios" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /chats/{id}/audio/{audioId}/content:
    parameters:
      - { $ref: "#/components/parameters/ChatId" }
      - { name: audioId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getChatAudioContent
      summary: A finished audio file, for playing or downloading
      description: Supports a single byte Range, so players can seek.
      tags: [chats]
      parameters:
        - { name: download, in: query, description: Serve as an attachment instead of inline, schema: { type: boolean, default: false } }
        - { name: Range, in: header, description: "One byte range, e.g. bytes=0-1023", schema: { type: string } }
      responses:
        "200":
          description: The audio
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "206":
          description: The requested range of the audio
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/Error" }
        "416": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /chats/{id}/playground:
    parameters:
      - { $ref: "#/components/parameters/ChatId" }
    get:
      operationId: getChatPlayground
      summary: The chat's playground, if an agent started one
      description: |
        A playground is the app a coding chat is building, run from the chat's
        workspace with fresh services next to it. A runner serves it on a port
        of its own on Vesper's host; the browser builds its address from that
        port, and the runner admits only a browser signed in to Vesper.
      tags: [chats]
      responses:
        "200":
          description: The playground, or null
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatPlaygroundState" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /chats/{id}/playground/{action}:
    parameters:
      - { $ref: "#/components/parameters/ChatId" }
      - { name: action, in: path, required: true, schema: { type: string, enum: [start, reset, stop] } }
    post:
      operationId: chatPlaygroundAction
      summary: Start an ended playground again, reset its data, or stop it
      description: |
        start runs its last spec again in the chat's current workspace (refused
        once that workspace was cleaned up); a chat with no playground yet
        starts one from its repository's saved spec (saved_spec). reset starts every service empty
        and runs setup again; the code is untouched. The runner carries each
        out shortly after; the playground's action shows it pending until then.
      tags: [chats]
      responses:
        "200":
          description: The playground
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Playground" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /chats/{id}/canvases:
    parameters:
      - { $ref: "#/components/parameters/ChatId" }
    get:
      operationId: listChatCanvases
      summary: The chat's canvases, oldest first
      tags: [chats]
      responses:
        "200":
          description: Canvases with their current version numbers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatCanvases" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /chats/{id}/canvases/{canvasId}:
    parameters:
      - { $ref: "#/components/parameters/ChatId" }
      - { name: canvasId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: seq, in: query, required: false, description: A version number; the current version when omitted, schema: { type: integer, format: int32, minimum: 1 } }
    get:
      operationId: getChatCanvas
      summary: One canvas at a version, with its version history
      tags: [chats]
      responses:
        "200":
          description: The canvas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatCanvas" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /chats/{id}/canvases/{canvasId}/versions:
    parameters:
      - { $ref: "#/components/parameters/ChatId" }
      - { $ref: "#/components/parameters/CanvasId" }
    post:
      operationId: saveChatCanvas
      summary: Save a person's edit as a new version
      tags: [chats]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatCanvasSave" }
      responses:
        "201":
          description: The new version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatCanvasVersion" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /chats/{id}/canvases/{canvasId}/restore:
    parameters:
      - { $ref: "#/components/parameters/ChatId" }
      - { $ref: "#/components/parameters/CanvasId" }
    post:
      operationId: restoreChatCanvas
      summary: Make an earlier version current by writing it again
      tags: [chats]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seq]
              properties:
                seq: { type: integer, format: int32, minimum: 1 }
      responses:
        "201":
          description: The new version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatCanvasVersion" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /chats/{id}/canvases/{canvasId}/promote:
    parameters:
      - { $ref: "#/components/parameters/ChatId" }
      - { $ref: "#/components/parameters/CanvasId" }
    post:
      operationId: promoteChatCanvas
      summary: Save the current version as a project artifact; a canvas already promoted returns its artifact
      tags: [chats]
      responses:
        "200":
          description: The artifact
          content:
            application/json:
              schema:
                type: object
                required: [artifact_id]
                properties:
                  artifact_id: { type: string, format: uuid }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /chats/{id}/canvases/{canvasId}/comments:
    parameters:
      - { $ref: "#/components/parameters/ChatId" }
      - { $ref: "#/components/parameters/CanvasId" }
    get:
      operationId: listChatCanvasComments
      summary: The canvas's comments and replies, oldest first
      tags: [chats]
      responses:
        "200":
          description: Comments
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatCanvasComments" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createChatCanvasComment
      summary: Add a draft comment on the current version, or a reply to a thread
      tags: [chats]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewChatCanvasComment" }
      responses:
        "201":
          description: The comment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatCanvasComment" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /chats/{id}/canvases/{canvasId}/comments/send:
    parameters:
      - { $ref: "#/components/parameters/ChatId" }
      - { $ref: "#/components/parameters/CanvasId" }
    post:
      operationId: sendChatCanvasComments
      summary: Open these comments and send them to the agent as one message
      tags: [chats]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [comment_ids]
              properties:
                comment_ids:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { type: string, format: uuid }
                message: { type: string, maxLength: 4000, description: The chat message to send; a summary of the comments when omitted }
      responses:
        "204": { description: Sent }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /chats/{id}/canvases/{canvasId}/comments/{commentId}:
    parameters:
      - { $ref: "#/components/parameters/ChatId" }
      - { $ref: "#/components/parameters/CanvasId" }
      - { name: commentId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateChatCanvasComment
      summary: Move a sent thread between open, addressed and resolved
      tags: [chats]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string }
      responses:
        "200":
          description: The comment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatCanvasComment" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteChatCanvasComment
      summary: Delete a draft comment
      tags: [chats]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /chats/{id}/canvases/{canvasId}/comments/{commentId}/apply:
    parameters:
      - { $ref: "#/components/parameters/ChatId" }
      - { $ref: "#/components/parameters/CanvasId" }
      - { name: commentId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: applyChatCanvasComment
      summary: Apply a comment's suggested text as a new version
      tags: [chats]
      responses:
        "201":
          description: The new version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatCanvasVersion" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /connectors:
    get:
      operationId: listConnectors
      summary: The person's MCP connectors
      tags: [connectors]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConnectorList" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createConnector
      summary: Add a connector; OAuth connectors return a sign-in URL
      tags: [connectors]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewConnector" }
      responses:
        "200":
          description: OK
