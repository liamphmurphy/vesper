  /chats/{id}/ticket-changes:
    parameters:
      - { $ref: "#/components/parameters/ChatId" }
    get:
      operationId: listTicketChangeRequests
      summary: Ticket edits a persona proposed in this chat, waiting for the person
      tags: [tickets]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketChangeRequestList" }
        default: { $ref: "#/components/responses/Error" }
  /ticket-changes/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: decideTicketChangeRequest
      summary: Apply once, always allow (applies it and lets the persona edit tickets without asking) or decline
      description: |
        Applying runs the edit as the persona that proposed it, with the
        person's approval recorded on the ticket's timeline. When the ticket
        changed since the proposal (a stale revision, a run that has since
        started), nothing is applied: the request is marked failed and the
        response is a 409 or 422 naming why.
      tags: [tickets]
