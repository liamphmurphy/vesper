      required: [id, title, duration_ms, method, stage, state, script_path, checks, percent, stage_note, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        duration_ms: { type: integer, description: The planned length }
        method: { type: string, description: "How it was made, e.g. MIDI → FluidSynth; empty until named" }
        stage: { $ref: "#/components/schemas/ChatAudioStage" }
        state: { type: string, enum: [running, done, failed] }
        failure_kind: { type: string, enum: [error, stopped], description: "Why a failed job failed: stopped when the person stopped the reply" }
        error: { type: string }
        error_log: { type: string, description: The failing command's output, when the agent attached it }
        script_path: { type: string, description: "The renderer, relative to the chat's workspace; empty until named" }
        checks: { type: array, items: { $ref: "#/components/schemas/ChatVideoCheck" } }
        percent: { type: integer, minimum: 0, maximum: 100 }
        stage_note: { type: string }
        run_id: { type: string, format: uuid }
        message_id: { type: string, format: uuid, description: "The reply it belongs to, once that reply is stored; absent while the turn runs" }
        library_item_id: { type: string, format: uuid, description: "Its copy in the Library, while that exists" }
        peaks: { type: array, maxItems: 64, items: { type: integer, minimum: 0, maximum: 255 }, description: "The waveform of a finished file the server could decode" }
        output: { $ref: "#/components/schemas/ChatAudioOutput" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
    ChatAudios:
      type: object
      required: [audio]
      properties:
        audio: { type: array, items: { $ref: "#/components/schemas/ChatAudio" } }
    LibraryItemKind:
      type: string
      enum: [image, diagram, link, document, video, audio, file, export]
    LibraryItem:
      type: object
      required: [id, kind, title, filename, content_type, size_bytes, created_at]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/LibraryItemKind" }
        title: { type: string, description: "For a generated image or saved diagram, the title of the chat it came from" }
        filename: { type: string }
        content_type: { type: string }
        size_bytes: { type: integer, format: int64 }
        chat_id: { type: string, format: uuid, description: "The chat it came from, while that chat exists" }
        chat_title: { type: string }
        project_key: { type: string, description: The project of the chat it came from, for linking to it }
        persona_id: { type: string, format: uuid, description: "The persona that made it, while that persona exists" }
        persona_name: { type: string }
        source: { type: string, enum: [generated, upload], description: "generated: a persona made it in a chat; upload: the person added it" }
        reference: { $ref: "#/components/schemas/LibraryReferenceRole" }
        reference_persona_id: { type: string, format: uuid, description: "With reference persona: the persona this image shows" }
        reference_persona_name: { type: string }
        url: { type: string, description: "For a link: the page or video" }
        note: { type: string, description: "For a link: why the persona recommended it" }
        site: { type: string, description: "For a link: the site's name or a video's channel" }
        video_id: { type: string, description: "For a video link: the YouTube id" }
        link_status: { $ref: "#/components/schemas/LibraryLinkStatus" }
        summary: { type: string, description: "For a link: a saved summary, as markdown" }
        duration_ms: { type: integer, description: "For a video or audio: its length" }
        width: { type: integer, description: "For a video: frame width in pixels" }
        height: { type: integer, description: "For a video: frame height in pixels" }
        has_poster: { type: boolean, description: "For a video: a poster image is served at /library/{itemId}/poster" }
        detail: { type: string, description: "For a file or export: one line under the name, e.g. 18 files, 112 lines or 1,204 rows · 6 columns. Absent when there is nothing to say beyond the size." }
        export_source: { $ref: "#/components/schemas/LibraryExportSource" }
        method: { type: string, description: "For generated audio: how it was made, e.g. MIDI → FluidSynth; absent for an upload" }
        peaks: { type: array, maxItems: 64, items: { type: integer, minimum: 0, maximum: 255 }, description: "For audio: the waveform, one value (0-255) per bucket. Absent when the server can't decode the format (OGG, M4A); duration_ms is absent then too." }
        created_at: { type: string, format: date-time }
    LibraryExportSource:
      type: object
      required: [kind, id, status]
      description: "For an export: the Slides deck, Design or Doc it was made from, and whether that has changed since"
      properties:
        kind: { type: string, enum: [slides, designs, docs] }
        id: { type: string, format: uuid }
        title: { type: string, description: "The source's current title; absent once it is deleted" }
        status: { type: string, enum: [current, changed, deleted], description: "current: not edited since the export; changed: edited since; deleted: gone" }
    LibraryFilePreview:
      type: object
      required: [kind, total, truncated]
      description: "What a file's dialog shows. Nothing is run or rendered: text is shown as text."
      properties:
        kind: { type: string, enum: [text, table, zip, none] }
        lines: { type: array, items: { type: string }, description: "text: the first 200 lines" }
        rows: { type: array, items: { type: array, items: { type: string } }, description: "table: the first 20 rows" }
        entries: { type: array, items: { $ref: "#/components/schemas/LibraryFileEntry" }, description: "zip: the first 200 file names" }
        total: { type: integer, description: "Lines, rows or files in the whole file; 0 when it isn't known" }
        truncated: { type: boolean }
    LibraryFileEntry:
      type: object
      required: [name, size]
      properties:
        name: { type: string }
        size: { type: integer, format: int64, description: "Uncompressed size in bytes" }
    LibraryLinkStatus:
      type: string
      enum: [to_read, done]
    LibraryLinkStatusSet:
      type: object
      required: [status]
      properties:
        status: { $ref: "#/components/schemas/LibraryLinkStatus" }
    LibraryLinkSummarySave:
      type: object
      required: [message_id, url]
      properties:
        message_id: { type: string, format: uuid, description: The assistant reply holding the summary }
        url: { type: string, description: The link it summarizes }
    LibraryReferenceRole:
      type: string
      enum: [persona, self]
      description: "persona: what one of the person's personas looks like; self: what the person looks like"
    LibraryReferenceSet:
      type: object
      required: [role]
      properties:
        role: { $ref: "#/components/schemas/LibraryReferenceRole" }
        persona_id: { type: string, format: uuid, description: Required for role persona; one of your personas }
    LibraryDiagramSave:
      type: object
      required: [message_id, svg]
      properties:
        message_id: { type: string, format: uuid, description: The assistant reply the diagram is in }
        svg: { type: string, description: The SVG document }
    LibraryLinkSave:
      type: object
      required: [message_id, url]
      properties:
        message_id: { type: string, format: uuid, description: The assistant reply that recommends the link }
        url: { type: string, description: "The URL, exactly as in the reply's recommend fence" }
    LibraryList:
      type: object
      required: [items, has_more]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/LibraryItem" } }
        has_more: { type: boolean }
    ChatMessage:
      type: object
      required: [id, seq, role, body_md, created_at]
      properties:
        id: { type: string, format: uuid }
        seq: { type: integer, description: "1-based, monotonic per chat" }
        role: { type: string, enum: [user, assistant, system], description: "system: switches, handoffs, cancels and errors, shown inline" }
        body_md: { type: string }
        harness: { $ref: "#/components/schemas/Harness" }
        model: { type: string }
        run_id: { type: string, format: uuid }
        turn_seq: { type: integer, description: "The run turn that produced an assistant message, or that a system message ended (the turn failed)" }
        context_refs: { type: array, items: { $ref: "#/components/schemas/ChatContextRef" } }
        citations: { type: array, items: { $ref: "#/components/schemas/ChatCitation" } }
        attachments: { type: array, items: { $ref: "#/components/schemas/ChatAttachment" }, description: "Files the person attached to a user message, or files (images) the assistant generated in an assistant message" }
        code_changes:
          type: array
          maxItems: 50
          description: "Files a coding persona changed during the turn that produced an assistant message (git diff from the turn's starting commit to the working tree, commits included, plus new untracked files). Secrets the run used are redacted. Absent when nothing changed."
          items: { $ref: "#/components/schemas/ChatCodeChange" }
        author: { $ref: "#/components/schemas/UserRef" }
        persona: { $ref: "#/components/schemas/PersonaSummary" }
        input_tokens: { type: integer, format: int64 }
        output_tokens: { type: integer, format: int64 }
        cached_input_tokens: { type: integer, format: int64, description: Input served from cache where the provider reported cache usage }
        uncached_input_tokens: { type: integer, format: int64, description: Reported input not served from cache }
        unreported_input_tokens: { type: integer, format: int64, description: Input whose cache breakdown was not reported }
        cost_usd: { type: number }
        effort: { $ref: "#/components/schemas/ChatEffort" }
        effort_level:
          type: string
          enum: [low, medium, high, xhigh]
          description: "Set when Vesper picked the effort (the chat's effort is automatic): the level the message called for. effort is the highest the model offers at or below it."
        effort_reasons:
          type: array
          items: { type: string, enum: [confirmation, effort_mismatch] }
          description: "Rules that raised effort_level above the message's own: confirmation (a go-ahead takes the weight of what it approves), effort_mismatch (a retry or edit steps it up)"
        created_at: { type: string, format: date-time }
    ChatCodeChange:
      type: object
      required: [path, status, additions, deletions, binary, truncated]
      properties:
        repository: { type: string, description: "Repository URL for this change" }
        path: { type: string, description: Repository-relative path after the change }
        old_path: { type: string, description: The path before a rename }
        status: { type: string, enum: [added, modified, deleted, renamed] }
        additions: { type: integer }
        deletions: { type: integer }
        binary: { type: boolean, description: "Binary files have no patch" }
        patch: { type: string, description: "The file's unified diff hunks (from the first @@ line; no diff --git header), at most 40 KB; absent for binary files or when the turn's total budget (200 KB) ran out" }
        truncated: { type: boolean, description: The patch was cut short or left out to stay within the limits }
    ChatModel:
      type: object
      required: [id, label, default, efforts]
      properties:
        id: { type: string, description: "Value for the model field, e.g. opus-5.5 or gpt-5-codex" }
        label: { type: string }
        default: { type: boolean, description: The harness's default model }
        efforts:
          type: array
          items: { $ref: "#/components/schemas/ChatEffort" }
          description: Reasoning efforts the model offers, lowest first; empty when it has no effort control
        default_effort: { $ref: "#/components/schemas/ChatEffort" }
    HarnessVerifyRequest:
      type: object
      required: [kind, credential]
      properties:
        kind: { type: string, enum: [subscription, api_key] }
        credential: { type: string, minLength: 1, maxLength: 16384, description: "The setup-token, auth.json or API key; stored encrypted, never returned" }
    HarnessVerifyResult:
      type: object
      required: [ok, models]
      properties:
        ok: { type: boolean, description: True when discovery returned at least one chat model }
        models:
          type: array
          items:
            type: object
            required: [id, label]
            properties:
              id: { type: string }
              label: { type: string }
        checking: { type: boolean, description: "A runner hasn't listed a plan login's models yet; verify again shortly" }
        error: { type: string, description: Why it isn't usable; safe to show }
    ChatEffort:
      type: string
      enum: [low, medium, high, xhigh, max]
      description: "Reasoning effort; absent means the harness's own default"
    ChatHarnessModels:
      type: object
      required: [harness, label, available, models]
      properties:
        harness: { $ref: "#/components/schemas/Harness" }
        label: { type: string }
        available: { type: boolean }
        checking: { type: boolean, description: "True while initial model discovery is pending; clients should poll until it finishes" }
        unavailable_reason: { type: string, description: "e.g. no harness:openai secret" }
        models: { type: array, items: { $ref: "#/components/schemas/ChatModel" } }
    PersonaTone:
      type: string
      enum: [neutral, friendly, concise, formal, playful]
      description: How the assistant writes; each maps to one fixed prompt sentence on the server
    ConnectorTool:
      type: object
      required: [name, description, write, policy]
      properties:
        name: { type: string }
        description: { type: string }
        write: { type: boolean, description: "False only when the server marks the tool read-only" }
        policy: { type: string, enum: [allow, ask, off] }
    Connector:
      type: object
      required: [id, name, slug, url, auth_kind, status, last_error, tools, persona_ids, revision, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        url: { type: string }
        auth_kind: { type: string, enum: [oauth, token, none] }
        status: { type: string, enum: [connected, needs_sign_in, offline] }
        last_error: { type: string }
        last_checked_at: { type: string, format: date-time }
        tools: { type: array, items: { $ref: "#/components/schemas/ConnectorTool" } }
        persona_ids: { type: array, items: { type: string, format: uuid } }
        revision: { type: integer }
        created_at: { type: string, format: date-time }
    ConnectorList:
      type: object
      required: [connectors]
      properties:
        connectors: { type: array, items: { $ref: "#/components/schemas/Connector" } }
    ConnectorCreated:
      type: object
      required: [connector]
      properties:
        connector: { $ref: "#/components/schemas/Connector" }
        authorize_url: { type: string, description: "Open this to finish OAuth sign-in" }
    NewConnector:
      type: object
      required: [name, url, auth_kind]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        url: { type: string }
        auth_kind: { type: string, enum: [oauth, token, none] }
        token: { type: string, description: "Stored encrypted and never returned" }
        proposal_id: { type: string, format: uuid, description: "The persona proposal this completes; that persona gets access" }
    ConnectorProbeRequest:
      type: object
      required: [url]
      properties:
        url: { type: string }
        token: { type: string }
    ConnectorProbe:
      type: object
      required: [reachable, needs_auth, tools]
      properties:
        reachable: { type: boolean }
        needs_auth: { type: boolean }
        tools: { type: integer }
        error: { type: string }
    ConnectorPatch:
      type: object
      required: [revision]
      properties:
        revision: { type: integer }
        name: { type: string, minLength: 1, maxLength: 60 }
        persona_ids: { type: array, items: { type: string, format: uuid } }
        token: { type: string, description: "Replace an API token connector's token; stored encrypted" }
        policies: { type: object, additionalProperties: { type: string, enum: [allow, ask, off] }, description: "Tool name to permission; tools not named are unchanged" }
    ConnectorApproval:
      type: object
      required: [id, connector_id, connector_name, tool, arguments, created_at]
      properties:
        id: { type: string, format: uuid }
        connector_id: { type: string, format: uuid }
        connector_name: { type: string }
        tool: { type: string }
        arguments: { type: object, additionalProperties: true }
        persona: { $ref: "#/components/schemas/PersonaSummary" }
        created_at: { type: string, format: date-time }
    ConnectorApprovalList:
      type: object
      required: [approvals]
      properties:
        approvals: { type: array, items: { $ref: "#/components/schemas/ConnectorApproval" } }
    ConnectorApprovalDecision:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [allow, always, deny] }
    TicketChange:
      type: object
      description: One line of a proposed ticket edit, as it was when proposed.
      required: [field, label, after]
      properties:
        field: { type: string, enum: [title, description, status, priority, estimate, epic, agent, requires_mockup, labels, due_date, criteria, pr_url, comment, blocked_by] }
        label: { type: string, description: "Display name of the field" }
        before: { type: string, description: "Absent for a comment, which only adds" }
        after: { type: string }
    TicketChangeRequest:
      type: object
      required: [id, ticket_key, ticket_title, tool, changes, state, created_at]
      properties:
        id: { type: string, format: uuid }
        ticket_key: { type: string }
        ticket_title: { type: string }
        tool: { type: string, enum: [update_ticket, comment_ticket, update_ticket_blockers] }
        changes: { type: array, items: { $ref: "#/components/schemas/TicketChange" } }
        state: { type: string, enum: [pending, applied, declined, failed] }
        error: { type: string, description: "Why applying it failed" }
        persona: { $ref: "#/components/schemas/PersonaSummary" }
        created_at: { type: string, format: date-time }
    TicketChangeRequestList:
      type: object
      required: [requests]
      properties:
        requests: { type: array, items: { $ref: "#/components/schemas/TicketChangeRequest" } }
    TicketChangeDecision:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [allow, always, deny], description: "allow applies it once; always applies it and lets the persona edit tickets without asking; deny declines it" }
    ConnectorProposal:
      type: object
      required: [id, name, url, auth_kind, reason, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        url: { type: string }
        auth_kind: { type: string, enum: [oauth, token, none] }
        reason: { type: string }
        proposed_by: { $ref: "#/components/schemas/PersonaSummary" }
        created_at: { type: string, format: date-time }
    ConnectorProposalList:
      type: object
      required: [proposals]
      properties:
        proposals: { type: array, items: { $ref: "#/components/schemas/ConnectorProposal" } }
    ApiSecretPlacement:
      type: string
      enum: [bearer, header, query, basic]
      description: "Where the value goes: Authorization: Bearer, a named header, a named query parameter, or Basic auth (value is user:password)"
    ApiSecretPolicy:
      type: string
      enum: [allow, ask, off]
    ApiSecret:
      type: object
      required: [id, name, handle, placement, placement_key, allowed_hosts, read_policy, write_policy, persona_ids, revision, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        handle: { type: string, description: "The only name personas see" }
        placement: { $ref: "#/components/schemas/ApiSecretPlacement" }
        placement_key: { type: string, description: "Header or query parameter name; empty for bearer and basic" }
        allowed_hosts: { type: array, items: { type: string } }
        read_policy: { $ref: "#/components/schemas/ApiSecretPolicy" }
        write_policy: { $ref: "#/components/schemas/ApiSecretPolicy" }
        persona_ids: { type: array, items: { type: string, format: uuid } }
        expires_at: { type: string, format: date-time, description: "From the value's JWT exp claim" }
        last_used_at: { type: string, format: date-time }
        revision: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ApiSecretList:
      type: object
      required: [secrets, key_configured]
      properties:
        secrets: { type: array, items: { $ref: "#/components/schemas/ApiSecret" } }
        key_configured: { type: boolean, description: "False until SECRETS_KEY is set; nothing can be stored until then" }
    NewApiSecret:
      type: object
      required: [name, value, placement, allowed_hosts]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        value: { type: string, description: "Stored encrypted and never returned" }
        placement: { $ref: "#/components/schemas/ApiSecretPlacement" }
        placement_key: { type: string }
        allowed_hosts: { type: array, items: { type: string } }
        read_policy: { $ref: "#/components/schemas/ApiSecretPolicy" }
        write_policy: { $ref: "#/components/schemas/ApiSecretPolicy" }
        persona_ids: { type: array, items: { type: string, format: uuid } }
        proposal_id: { type: string, format: uuid, description: "The persona request this completes; that persona gets access" }
    ApiSecretPatch:
      type: object
      required: [revision]
      properties:
        revision: { type: integer }
        name: { type: string, minLength: 1, maxLength: 60 }
        value: { type: string, description: "Replace the value; stored encrypted" }
        placement: { $ref: "#/components/schemas/ApiSecretPlacement" }
        placement_key: { type: string }
        allowed_hosts: { type: array, items: { type: string } }
        read_policy: { $ref: "#/components/schemas/ApiSecretPolicy" }
        write_policy: { $ref: "#/components/schemas/ApiSecretPolicy" }
        persona_ids: { type: array, items: { type: string, format: uuid } }
    ApiSecretCall:
      type: object
      required: [id, method, host, path, decision, error, redactions, duration_ms, persona_name, created_at]
      properties:
        id: { type: string, format: uuid }
        method: { type: string }
        host: { type: string }
        path: { type: string }
        decision: { type: string, enum: [auto, approved, denied, blocked] }
        status: { type: integer, description: "The HTTP status, when the request was sent" }
        error: { type: string }
        redactions: { type: integer }
        duration_ms: { type: integer }
        persona_name: { type: string }
        chat_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
    ApiSecretCallList:
      type: object
      required: [calls]
      properties:
        calls: { type: array, items: { $ref: "#/components/schemas/ApiSecretCall" } }
    ChatApiSecret:
      type: object
      required: [id, name, handle, calls, methods, last_used_at, enabled]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        handle: { type: string }
        calls: { type: integer }
        methods: { type: array, items: { type: string } }
        last_used_at: { type: string, format: date-time }
        enabled: { type: boolean, description: "False once turned off for this chat" }
    ChatApiSecretList:
      type: object
      required: [secrets]
      properties:
        secrets: { type: array, items: { $ref: "#/components/schemas/ChatApiSecret" } }
    ApiSecretApproval:
      type: object
      required: [id, secret_id, secret_name, secret_handle, placement, placement_key, method, url, headers, body, created_at]
      properties:
        id: { type: string, format: uuid }
        secret_id: { type: string, format: uuid }
        secret_name: { type: string }
        secret_handle: { type: string }
        placement: { $ref: "#/components/schemas/ApiSecretPlacement" }
        placement_key: { type: string }
        method: { type: string }
        url: { type: string }
        headers: { type: object, additionalProperties: { type: string } }
        body: { type: string, description: "The whole request body, exactly as it will be sent" }
        persona: { $ref: "#/components/schemas/PersonaSummary" }
        created_at: { type: string, format: date-time }
    ApiSecretApprovalList:
      type: object
      required: [approvals]
      properties:
        approvals: { type: array, items: { $ref: "#/components/schemas/ApiSecretApproval" } }
    ApiSecretProposal:
      type: object
      required: [id, name, host, placement, placement_key, reason, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        host: { type: string }
        placement: { $ref: "#/components/schemas/ApiSecretPlacement" }
        placement_key: { type: string }
        reason: { type: string }
        proposed_by: { $ref: "#/components/schemas/PersonaSummary" }
        created_at: { type: string, format: date-time }
    ApiSecretProposalList:
      type: object
      required: [proposals]
      properties:
        proposals: { type: array, items: { $ref: "#/components/schemas/ApiSecretProposal" } }
    ScheduledTaskInput:
      type: object
      required: [name, kind, frequency, at_time, timezone, enabled]
      properties:
        revision: { type: integer, description: Required when updating }
        name: { type: string, minLength: 1, maxLength: 120 }
        kind: { type: string, enum: [prompt, workflow] }
        instructions: { type: string, maxLength: 20000 }
        workflow_id: { type: string, format: uuid }
        persona_id: { type: string, format: uuid }
        project: { type: string, description: "Project key to attach; omit for none" }
        connector_ids: { type: array, items: { type: string, format: uuid } }
        frequency: { type: string, enum: [daily, weekly, monthly, cron] }
        weekdays: { type: array, items: { type: integer, minimum: 0, maximum: 6 }, description: "0 is Sunday; weekly only" }
        month_day: { type: integer, minimum: 1, maximum: 31, description: "Runs on the last day of shorter months" }
        at_time: { type: string, pattern: "^[0-2][0-9]:[0-5][0-9]$" }
        timezone: { type: string, description: IANA name }
        cron: { type: string, description: "Five fields, in timezone; cron only" }
        enabled: { type: boolean }
        max_minutes: { type: integer, minimum: 1, maximum: 240 }
        max_cost_micros: { type: integer, format: int64, minimum: 1 }
    ScheduledRun:
      type: object
      required: [id, trigger, state, summary, error, cost_micros, started_at]
      properties:
        id: { type: string, format: uuid }
        trigger: { type: string, enum: [schedule, manual, catchup] }
        state: { type: string, enum: [running, waiting, done, failed] }
        summary: { type: string }
        error: { type: string }
        cost_micros: { type: integer, format: int64 }
        href: { type: string }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
    ScheduledTask:
      type: object
      required: [id, name, kind, instructions, connector_ids, frequency, weekdays, month_day, at_time, timezone, cron, enabled, max_minutes, max_cost_micros, revision, runs, upcoming]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, enum: [prompt, workflow] }
        instructions: { type: string }
        workflow_id: { type: string, format: uuid }
        persona_id: { type: string, format: uuid }
        project: { type: string }
        connector_ids: { type: array, items: { type: string, format: uuid } }
        frequency: { type: string, enum: [daily, weekly, monthly, cron] }
        weekdays: { type: array, items: { type: integer } }
        month_day: { type: integer }
        at_time: { type: string }
        timezone: { type: string }
        cron: { type: string }
        enabled: { type: boolean }
        max_minutes: { type: integer }
        max_cost_micros: { type: integer, format: int64 }
        next_run_at: { type: string, format: date-time }
        upcoming: { type: array, items: { type: string, format: date-time }, description: "The next two run times" }
        revision: { type: integer }
        runs: { type: array, items: { $ref: "#/components/schemas/ScheduledRun" }, description: "Newest first, at most 10" }
    ScheduledTaskList:
      type: object
      required: [tasks]
      properties:
        tasks: { type: array, items: { $ref: "#/components/schemas/ScheduledTask" } }
    PersonaCapabilities:
      type: object
      description: |
        What a persona may do beyond answering. These are enforced in code
        (chat scopes, sandbox and harness options), never by prompt text.
      required: [code, images]
      properties:
        code: { type: boolean, description: "Clone the chat's repo, edit and run code, commit and push its own work branch, open PRs" }
        images: { type: boolean, description: "Generate images with an image engine (Codex or Antigravity); works with any chat model (a chat on another harness hands the image to a one-off step on the engine)" }
        image_engine: { type: string, description: "Which engine makes this persona's images: codex, antigravity or auto (the first connected, Codex first). Empty inherits the workspace's choice (GET /image-engine). Absent in a request means unchanged." }
        personas: { type: boolean, description: "Propose new personas from a chat; each is created only when the person approves it, with every capability off. Absent in a request means unchanged (false for a new persona)." }
        connectors: { type: boolean, description: "Propose new MCP connectors from a chat; each is added only when the person approves it and signs in. Absent in a request means unchanged (false for a new persona)." }
        svg: { type: boolean, description: "Show SVG images in chat replies; a reply from a persona without it keeps its SVG as plain code. Absent in a request means unchanged (false for a new persona)." }
        workflows: { type: boolean, description: "Propose new workflows and edits to them from a chat; each is applied only when the person accepts it. Absent in a request means unchanged (false for a new persona)." }
        ticket_edits: { type: string, enum: [ask, allow], description: "Whether the persona's ticket edits from a chat (update_ticket, comment_ticket, update_ticket_blockers) wait for the person on a card (ask) or apply at once (allow). Canceling, or reopening a canceled ticket, always asks. Absent in a request means unchanged (ask for a new persona)." }
    PersonaSummary:
      type: object
      description: What a chat needs to render its persona. Absent on a chat means the built-in Assistant.
      required: [id, name, color]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        color: { type: string, pattern: "^#[0-9a-f]{6}$" }
        avatar_url: { type: string, description: "GET /personas/{id}/avatar with a cache-busting ?v=<revision>; absent without an avatar" }
        capabilities: { $ref: "#/components/schemas/PersonaCapabilities" }
    PersonaDockState:
      type: string
      enum: [working, replied, needs_you]
    PersonaDockChat:
      type: object
      required: [id, title, state, harness, unread, last_line, last_seq, waiting_approval, last_activity_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        state: { $ref: "#/components/schemas/PersonaDockState" }
        harness: { type: string, description: "The harness the chat's current turn runs on (claude-code, codex or antigravity), after any fallback" }
        unread: { type: integer }
        last_line: { type: string, description: "Last line of the latest reply" }
        last_seq: { type: integer, format: int64, description: "Sequence of the latest reply, for marking the chat read" }
        waiting_approval: { type: boolean, description: "A persona proposal awaits the person; reading the chat doesn't clear it" }
        last_activity_at: { type: string, format: date-time }
    PersonaDockEntry:
      type: object
      required: [persona, state, unread, last_activity_at, chats]
      properties:
        persona: { $ref: "#/components/schemas/PersonaSummary" }
        state: { $ref: "#/components/schemas/PersonaDockState" }
        unread: { type: integer }
        last_activity_at: { type: string, format: date-time }
        chats: { type: array, items: { $ref: "#/components/schemas/PersonaDockChat" } }
    SpaceChatActivity:
      type: object
      description: A chat in one of the person's spaces that is working or needs them, for the space's row in the menu.
      required: [id, space_id, title, state, last_activity_at]
      properties:
        id: { type: string, format: uuid }
        space_id: { type: string, format: uuid }
        title: { type: string }
        state: { $ref: "#/components/schemas/PersonaDockState" }
        persona: { $ref: "#/components/schemas/PersonaSummary" }
        started_at: { type: string, format: date-time, description: "When the working turn began; absent unless the chat is working" }
        last_activity_at: { type: string, format: date-time }
    PersonaDock:
      type: object
      required: [personas, space_chats, harnesses]
      properties:
        personas: { type: array, items: { $ref: "#/components/schemas/PersonaDockEntry" } }
        space_chats: { type: array, items: { $ref: "#/components/schemas/SpaceChatActivity" }, description: "Working chats and chats that need the person, in a space, most recently started first. Unlike personas, includes the built-in Assistant's chats." }
        harnesses: { type: array, items: { $ref: "#/components/schemas/HarnessActivity" }, description: "Claude Code, Codex, then Antigravity: what each is running and how much of its plan allowance is left (Antigravity has none to read: usage_available is false)" }
    UsageWindow:
      type: object
      description: One plan allowance window, as the harness CLI reports it.
      required: [id, kind, label, used_percent]
      properties:
        id: { type: string, description: "five_hour, seven_day, seven_day_opus, seven_day_sonnet, or codex_<minutes>" }
        kind: { type: string, enum: [session, weekly, other] }
        label: { type: string, description: "Session, Weekly, Weekly · Opus…" }
        used_percent: { type: number, minimum: 0, maximum: 100 }
        resets_at: { type: string, format: date-time }
    HarnessActivity:
      type: object
      required: [harness, label, connected, running, usage_available, usage_checking, windows]
      properties:
        harness: { type: string, description: "claude-code, codex or antigravity" }
        label: { type: string }
        connected: { type: boolean, description: "The harness has the credential its runs need (its harness key secret), or the runner needs none. The sidebar shows only connected harnesses." }
        running: { type: integer, description: Runs and chat turns working on this harness now }
        limited_until: { type: string, format: date-time, description: "Present while the harness is out of allowance; runs fall back to another harness until then" }
        plan: { type: string, description: "Subscription name when the CLI reports one (max, pro, plus…)" }
        usage_available: { type: boolean, description: "False when plan limits don't apply or can't be read (API key, signed out, or no reading yet)" }
        usage_checked_at: { type: string, format: date-time, description: When the windows were read; absent before the first reading }
        usage_checking: { type: boolean, description: "A usage check is in flight; a newer reading may arrive on a later poll" }
        windows: { type: array, items: { $ref: "#/components/schemas/UsageWindow" }, description: "Session first, then weekly; windows that renewed since the reading are left out" }
    PersonaProposal:
      type: object
      description: A persona one of the chat's personas asked to create; nothing exists until the person approves it.
      required: [id, chat_id, name, tone, color, custom_instructions, reason, state, created_at]
      properties:
        id: { type: string, format: uuid }
        chat_id: { type: string, format: uuid }
        proposed_by: { $ref: "#/components/schemas/PersonaSummary" }
        name: { type: string }
        tone: { $ref: "#/components/schemas/PersonaTone" }
        color: { type: string, pattern: "^#[0-9a-f]{6}$" }
        custom_instructions: { type: string }
        reason: { type: string, description: Why the proposing persona thinks it helps }
        state: { type: string, enum: [pending, approved, declined] }
        persona: { $ref: "#/components/schemas/PersonaSummary" }
        avatar_state:
          type: string
          enum: [pending, ready, failed]
          description: |
            The picture the proposing persona asked to make for it; absent
            when it asked for none. pending: still being made, and the
            proposal can't be approved until it settles. ready: approving
            makes it the persona's avatar and reference image. failed: it
            wasn't made, and approving creates the persona without one.
        avatar_attachment_id: { type: string, format: uuid, description: "The picture (GET /chat-attachments/{attachmentId}/content), while avatar_state is ready" }
        created_at: { type: string, format: date-time }
        decided_at: { type: string, format: date-time }
    Persona:
      type: object
      description: |
        A named variant of the caller's Personal Assistant, private to them.
        Its tone and custom instructions shape the assistant's voice in chats
        only; they never change scopes, tools or memory rules. Only the
        structured capabilities (and repos) widen what its chats may do.
      required: [id, name, tone, color, custom_instructions, capabilities, repos, is_default, chat_count, revision, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        tone: { $ref: "#/components/schemas/PersonaTone" }
        color: { type: string, pattern: "^#[0-9a-f]{6}$", description: Stored in lower case }
        avatar_url: { type: string, description: "GET /personas/{id}/avatar with a cache-busting ?v=<revision>; absent without an avatar" }
        custom_instructions: { type: string }
        capabilities: { $ref: "#/components/schemas/PersonaCapabilities" }
        repos: { type: array, maxItems: 10, items: { type: string }, deprecated: true, description: "Legacy repository favorites and first-chat default; never an access allowlist. Use shared repository sources for discovery." }
        is_default: { type: boolean }
        chat_count: { type: integer, description: Chats (archived included) that use this persona }
        last_used_at: { type: string, format: date-time, description: When a chat with this persona last got a message }
        revision: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PersonaList:
      type: object
      required: [personas]
      properties:
        personas: { type: array, items: { $ref: "#/components/schemas/Persona" } }
        default_persona_id: { type: string, format: uuid, description: Absent when the built-in Assistant is the default }
    NewPersona:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 60, description: Unique per person (case-insensitive) after trimming }
        tone: { $ref: "#/components/schemas/PersonaTone" }
        color: { type: string, pattern: "^#[0-9a-fA-F]{6}$", description: "Defaults to #64748b" }
        custom_instructions: { type: string, maxLength: 2000 }
        capabilities: { $ref: "#/components/schemas/PersonaCapabilities" }
        repos: { type: array, maxItems: 10, items: { type: string, maxLength: 500 }, description: "https://host/owner/repo(.git), ssh://git@host/owner/repo(.git) or git@host:owner/repo(.git); no credentials in the URL" }
        is_default: { type: boolean, default: false, description: Make it the default (replacing the current one) }
    PersonaPatch:
      type: object
      required: [revision]
      properties:
        revision: { type: integer }
        name: { type: string, minLength: 1, maxLength: 60 }
        tone: { $ref: "#/components/schemas/PersonaTone" }
        color: { type: string, pattern: "^#[0-9a-fA-F]{6}$" }
        custom_instructions: { type: string, maxLength: 2000, description: Empty string clears them }
        capabilities: { $ref: "#/components/schemas/PersonaCapabilities" }
        repos: { type: array, maxItems: 10, items: { type: string, maxLength: 500 }, description: Replaces the whole list; existing chats keep their repo }
