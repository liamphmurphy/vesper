            application/json:
              schema: { $ref: "#/components/schemas/ScheduledTask" }
        default: { $ref: "#/components/responses/Error" }
  /scheduled-tasks/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: updateScheduledTask
      summary: Replace a task's settings (revision-checked)
      tags: [scheduled]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScheduledTaskInput" }
      responses:
        "200":
