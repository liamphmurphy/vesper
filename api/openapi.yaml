        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }
  /scheduled-tasks/{id}/run:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: runScheduledTask
      summary: Run a task now; 409 while it is already running
      tags: [scheduled]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScheduledTask" }
        default: { $ref: "#/components/responses/Error" }
  /finance:
    get:
      operationId: getFinanceOverview
      summary: The signed-in person's Finance dashboard
      description: |
        Cash flow by month (oldest first, ending with this one), net worth
        rolled from each account's newest balance, savings rate, spending by
        category for the last full month against the months before, the
        transactions waiting for a category, and monthly recurring charges.
        Opening it makes the person's Finance space the first time: the
        space the Ask drawer's chats live in.
      tags: [finance]
      parameters:
        - { name: months, in: query, description: "Months of cash flow, 1–24 (default 12)", schema: { type: integer, minimum: 1, maximum: 24 } }
      responses:
        "200":
          description: The dashboard
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinanceOverview" }
        default: { $ref: "#/components/responses/Error" }
  /finance/accounts:
    post:
      operationId: createFinanceAccount
      summary: Add an account by hand, for CSV imports
      description: OFX imports add their own accounts. 422 for an invalid field or a name already in use.
      tags: [finance]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewFinanceAccount" }
      responses:
        "201":
          description: The account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinanceAccount" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /finance/accounts/{accountId}/balance:
    parameters:
      - { name: accountId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: setFinanceAccountBalance
      summary: Record an account's balance on a day
      description: Net worth rolls the newest balance of each account through its transactions. CSV exports rarely carry one, so the person enters it.
      tags: [finance]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinanceBalanceInput" }
      responses:
        "200":
          description: The account with its balance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinanceAccount" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /finance/imports:
    post:
      operationId: importFinanceStatement
      summary: Import a bank's CSV or OFX/QFX export
      description: |
        Transactions already imported are skipped, so overlapping exports
        are safe. New ones are categorized by the person's rules, then
        built-in keywords; card payments are paired with their other side
        as transfers. An OFX file finds or creates its account; a CSV needs
        account_id. Up to 5 MB and 20,000 transactions. 422 for a file that
        can't be read, a CSV without an account, or an OFX for a different
        account than the one picked.
      tags: [finance]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                account_id: { type: string, format: uuid }
                flip_sign: { type: boolean, description: "The CSV shows purchases as positive amounts (some card exports do)" }
      responses:
        "201":
          description: What was imported
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinanceImportResult" }
        "202":
          description: |
            A CSV layout Vesper doesn't know yet: nothing was imported. The
            file waits for its columns to be mapped, and the assistant is
            asked for a mapping in a hidden chat. Confirm one with commit.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinancePendingImport" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /finance/imports/pending/{importId}:
    parameters:
      - { name: importId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getFinancePendingImport
      summary: A CSV waiting for its columns to be mapped
      description: Poll it while assistant is asking; the assistant's mapping appears once it reads every row.
      tags: [finance]
      responses:
        "200":
          description: The pending import
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinancePendingImport" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: cancelFinancePendingImport
      summary: Drop a pending import without importing it
      tags: [finance]
      responses:
        "204": { description: Dropped }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /finance/imports/pending/{importId}/preview:
    parameters:
      - { name: importId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: previewFinanceMapping
      summary: What a mapping reads from the whole file, without importing
      description: 422 names the first row the mapping can't read.
      tags: [finance]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinanceCSVMapping" }
      responses:
        "200":
          description: The preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinanceMappingPreview" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /finance/imports/pending/{importId}/commit:
    parameters:
      - { name: importId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: commitFinanceMapping
      summary: Import a pending CSV with a mapping, and remember the mapping
      description: The next file with the same delimiter and first line imports with it directly. 422 names the first row the mapping can't read.
      tags: [finance]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinanceCSVMapping" }
      responses:
        "201":
          description: What was imported
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinanceImportResult" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /finance/transactions/{transactionId}/category:
    parameters:
      - { name: transactionId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: categorizeFinanceTransaction
      summary: Set a transaction's category
      description: |
        With save_rule (the default), the merchant's first words become a
        rule: it recategorizes past matches (except ones set by hand or
        matched transfers) and categorizes future imports. Moving a matched
        transfer to another category sends its other side back to review.
      tags: [finance]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinanceCategorize" }
      responses:
        "200":
          description: The result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinanceCategorizeResult" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /chat-spaces:
    get:
      operationId: listChatSpaces
      summary: The signed-in person's spaces, oldest first
      description: |
        A space groups a person's chats around a topic. Its instructions and
        sources reach every chat in it on every turn (below the persona), and
        with space_memory on, what the assistant saves about the person there
        stays in the space. Spaces are strictly per person.
      tags: [spaces]
      responses:
        "200":
          description: Spaces
          content:
            application/json:
              schema:
                type: object
                required: [spaces]
                properties:
                  spaces: { type: array, items: { $ref: "#/components/schemas/ChatSpace" } }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createChatSpace
      summary: Create a space
      description: 422 for an invalid field, an unknown persona, project or connector; 409 for an archived project.
      tags: [spaces]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewChatSpace" }
      responses:
        "201":
          description: The space
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatSpace" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /chat-spaces/{spaceId}:
    parameters:
      - { name: spaceId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getChatSpace
      summary: One of your spaces
      tags: [spaces]
      responses:
        "200":
          description: The space
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatSpace" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateChatSpace
      summary: Change a space
      description: Chats in the space see new instructions, sources and memory settings on their next turn; the defaults apply to chats started after.
      tags: [spaces]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatSpacePatch" }
      responses:
        "200":
          description: The space
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatSpace" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteChatSpace
      summary: Delete a space
      description: Its sources and its memories go with it. Its chats stay, outside any space.
      tags: [spaces]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /chat-spaces/{spaceId}/sources:
    parameters:
      - { name: spaceId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listChatSpaceSources
      summary: A space's sources, in the order they were added
      tags: [spaces]
      responses:
        "200":
          description: Sources
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatSpaceSourceList" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: addChatSpaceSource
      summary: Add pasted text, a web page, a Library item, a saved link or a canvas
      description: |
        The source is a snapshot taken now: a web page or saved link is
        fetched once (public addresses only), a canvas or Library item is
        copied. 422 for an invalid field, a page that can't be read, an
        unknown item or canvas, or a space that is full.
      tags: [spaces]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewChatSpaceSource" }
      responses:
        "201":
          description: The source
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatSpaceSource" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /chat-spaces/{spaceId}/sources/upload:
    parameters:
      - { name: spaceId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: uploadChatSpaceSource
      summary: Add a file to a space
      description: PDF, Markdown, text, CSV, JSON and images (PNG, JPEG, GIF, WebP), up to 20 MB each and 100 MB per space. 422 otherwise.
      tags: [spaces]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: The source
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatSpaceSource" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /chat-spaces/{spaceId}/sources/{sourceId}:
    parameters:
      - { name: spaceId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: sourceId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: deleteChatSpaceSource
      summary: Remove a source from a space
      tags: [spaces]
      responses:
        "204": { description: Removed }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /canvases:
    get:
      operationId: listMyCanvases
      summary: The signed-in person's canvases across their chats, most recently changed first
      tags: [spaces]
      responses:
        "200":
          description: Up to 100 canvases
          content:
            application/json:
              schema:
                type: object
                required: [canvases]
                properties:
                  canvases: { type: array, items: { $ref: "#/components/schemas/MyCanvas" } }
        default: { $ref: "#/components/responses/Error" }

  /canvases/{canvasId}:
    parameters:
      - { name: canvasId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getMyCanvas
      summary: One of the signed-in person's canvases, with the chat it lives in
      description: For opening a canvas outside its chat, such as a document in the Docs app. 404 for anyone else's.
      tags: [spaces]
      responses:
        "200":
          description: The canvas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyCanvas" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /slides:
    get:
      operationId: listDecks
      summary: The signed-in person's slide decks, most recently changed first
      tags: [slides]
      responses:
        "200":
          description: Up to 200 decks
          content:
            application/json:
              schema:
                type: object
                required: [decks]
                properties:
                  decks: { type: array, items: { $ref: "#/components/schemas/DeckSummary" } }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createDeck
      summary: Start a deck in the Slides app
      description: |
        Makes a deck canvas with one title slide (the title, unless it is
        empty) in a new chat in the person's Slides space. theme is a built-in
        theme (light by default). With starter, the deck is a copy of that
        starter deck (see listSlideStarters) in the theme, with fresh ids; an
        empty title then takes the starter's name, and a title replaces the
        first slide's title.
      tags: [slides]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 200, description: "Empty starts an untitled deck" }
                theme: { type: string, enum: [light, dark, paper, contrast, dusk, ocean, forest, sunset, mono, blueprint] }
                starter: { type: string, enum: [project-update, pitch, retro, teaching, research-findings], description: "Start from this starter deck instead of one blank title slide" }
      responses:
        "201":
          description: The deck
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyCanvas" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /slides/{canvasId}:
    parameters:
      - { name: canvasId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: renameDeck
      summary: Rename a deck (and its chat)
      tags: [slides]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, maxLength: 200 }
      responses:
        "200":
          description: The deck
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyCanvas" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteDeck
      summary: Delete a deck with its chat, versions and images
      description: 404 for anyone else's deck or a canvas that isn't a deck.
      tags: [slides]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /slides/{canvasId}/library:
    parameters:
      - { name: canvasId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: saveDeckExportToLibrary
      summary: Save an export of a deck (PDF or PowerPoint) to the Library
      description: |
        Stores one finished export file, built by the Export menu, as an
        export linked to its deck. The file's content decides its type: a PDF,
        or a .pptx (a zip holding ppt/presentation.xml). It counts against the
        Library's 1 GB storage cap. 404 for anyone else's deck; 422 for another
        type, an empty file, one over 25 MB or a full Library.
      tags: [slides]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryItem" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /slides/{canvasId}/duplicate:
    parameters:
      - { name: canvasId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: duplicateDeck
      summary: Copy a deck's current version and images into a new deck
      tags: [slides]
      responses:
        "201":
          description: The copy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyCanvas" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /slides/{canvasId}/assets:
    parameters:
      - { name: canvasId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: uploadDeckAsset
      summary: Add an image to a deck
      description: |
        PNG or JPEG (sniffed by the server), at most 10 MB and 8192 pixels on
        a side. Returns the asset to put in the deck's assets map; uploading
        doesn't change the deck. Counts toward the 1 GB Library quota.
      tags: [slides]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: The stored image
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeckAsset" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /slides/{canvasId}/assets/{assetId}:
    parameters:
      - { name: canvasId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: assetId, in: path, required: true, schema: { type: string, pattern: "^a_[a-z0-9_]{1,40}$" } }
    get:
      operationId: getDeckAsset
      summary: One of a deck's images (owner only)
      tags: [slides]
      responses:
        "200":
          description: The image
          headers:
            X-Content-Type-Options: { schema: { type: string, enum: [nosniff] } }
            Cache-Control: { schema: { type: string } }
          content:
            image/*:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /designs:
    get:
      operationId: listDesigns
      summary: The signed-in person's designs, most recently changed first
      tags: [designs]
      parameters:
        - { name: project, in: query, required: false, schema: { type: string }, description: "Only designs in this project (by key)" }
      responses:
        "200":
          description: Up to 200 designs
          content:
            application/json:
              schema:
                type: object
                required: [designs]
                properties:
                  designs: { type: array, items: { $ref: "#/components/schemas/DesignSummary" } }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createDesign
      summary: Start a design in the Designs app
      description: |
        Makes a design canvas (schema 1, docs/design/ADR-designs.md) in a new
        chat in the person's Designs space, blank or from a starter, with
        fresh ids. project is a project key the design's chat belongs to.
      tags: [designs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 200, description: "Empty starts an untitled design" }
                starter: { type: string, enum: [blank, mobile-flow, web-flow, diagram, wireframe] }
                project: { type: string, description: "A project key" }
      responses:
        "201":
          description: The design
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyCanvas" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /designs/{canvasId}:
    parameters:
      - { name: canvasId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getDesign
      summary: One of the person's designs, with its switches and pending suggestions
      description: The body comes from the chat canvas endpoints or getDesignVersion. 404 for anyone else's design or a canvas that isn't a design.
      tags: [designs]
      responses:
        "200":
          description: The design
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Design" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: renameDesign
      summary: Rename a design
      tags: [designs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, maxLength: 200 }
      responses:
        "200":
          description: The design
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyCanvas" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteDesign
      summary: Delete a design with its chat, versions, suggestions and images
      description: Its images' blobs are swept once nothing else uses them. 404 for anyone else's design.
      tags: [designs]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /designs/{canvasId}/duplicate:
    parameters:
      - { name: canvasId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: duplicateDesign
      summary: Copy a design's current version (with fresh ids) and images into a new design
      tags: [designs]
      responses:
        "201":
          description: The copy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyCanvas" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /designs/{canvasId}/versions:
    parameters:
      - { name: canvasId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: saveDesign
      summary: Save the person's edit as a new version
      description: |
        The body is normalised (schema 1) and must be at most 2 MB. 409 when
        base_seq isn't the current version: merge with it and save again.
      tags: [designs]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatCanvasSave" }
      responses:
        "201":
          description: The new version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DesignVersion" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /designs/{canvasId}/versions/{seq}:
    parameters:
      - { name: canvasId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: seq, in: path, required: true, schema: { type: integer, format: int32, minimum: 1 } }
    get:
      operationId: getDesignVersion
      summary: One version of a design, with its body
      tags: [designs]
      responses:
        "200":
          description: The version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DesignVersion" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /designs/{canvasId}/settings:
    parameters:
      - { name: canvasId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateDesignSettings
      summary: Change a design's persona switches
      description: Not a version, and no patch can change them.
      tags: [designs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                direct_edit: { type: boolean, description: "Let personas edit directly: their patches apply at once as versions instead of waiting as suggestions" }
                persona_paused: { type: boolean, description: "Refuse persona patches until resumed" }
      responses:
        "200":
          description: The switches
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DesignSettings" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /designs/{canvasId}/proposals:
    parameters:
      - { name: canvasId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listDesignProposals
      summary: A design's persona suggestions, oldest first
      tags: [designs]
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [pending, resolved, applied, withdrawn] }, description: "Only these; all by default" }
      responses:
        "200":
          description: Up to 200 suggestions
          content:
            application/json:
              schema:
                type: object
                required: [proposals]
                properties:
                  proposals: { type: array, items: { $ref: "#/components/schemas/DesignProposal" } }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /designs/{canvasId}/proposals/{proposalId}/resolve:
    parameters:
      - { name: canvasId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: proposalId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: resolveDesignProposal
      summary: Accept or reject each change of a pending suggestion
      description: |
        Every op needs one decision. The accepted ops are applied on the
        current version (not the suggestion's base) as one new version by the
        person; an accepted op whose target is gone is recorded as stale and
        skipped. Accepting an op that needs one you rejected (it refers to
        something that op creates) is refused. 409 when it's no longer pending.
      tags: [designs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decisions]
              properties:
                decisions:
                  type: array
                  maxItems: 100
                  items:
                    type: object
                    required: [i, state]
                    properties:
                      i: { type: integer, minimum: 0, description: "The op's index in the suggestion" }
                      state: { type: string, enum: [accepted, rejected] }
                      reason: { type: string, maxLength: 500, description: "Why it was rejected; goes back to the persona" }
      responses:
        "200":
          description: The resolved suggestion and the version it wrote, if any
          content:
            application/json:
              schema:
                type: object
                required: [proposal]
                properties:
                  proposal: { $ref: "#/components/schemas/DesignProposal" }
                  version: { $ref: "#/components/schemas/DesignVersion" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /designs/{canvasId}/assets:
    parameters:
      - { name: canvasId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: uploadDesignAsset
      summary: Add an image to a design
      description: |
        PNG or JPEG (sniffed by the server), at most 10 MB and 4096 pixels on
        a side. Returns the asset to put in the design's assets map; uploading
        doesn't change the design. Counts toward the 1 GB Library quota.
      tags: [designs]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: The stored image
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeckAsset" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /designs/{canvasId}/render:
    parameters:
      - { name: canvasId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: node, in: query, schema: { type: string, pattern: "^n_[a-z0-9_]{1,40}$" }, description: Render this node }
      - { name: page, in: query, schema: { type: string, pattern: "^p_[a-z0-9_]{1,40}$" }, description: "Render this page; the first page when neither node nor page is given" }
      - { name: scale, in: query, schema: { type: number, minimum: 1, maximum: 3, default: 1 } }
    get:
      operationId: renderDesign
      summary: A PNG of a design's node or page, drawn by the design worker (owner only)
      tags: [designs]
      responses:
        "200":
          description: The PNG, with its size in design pixels
          headers:
            X-Design-Width: { schema: { type: integer } }
            X-Design-Height: { schema: { type: integer } }
            X-Content-Type-Options: { schema: { type: string, enum: [nosniff] } }
          content:
            image/png:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /designs/{canvasId}/library:
    parameters:
      - { name: canvasId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: saveDesignExportToLibrary
      summary: Save an export of a design (PNG, SVG or PDF) to the Library
      description: |
        Stores one finished export file (PNG, SVG or PDF), built by the Export
        menu, as an export linked to its design, titled after the file name.
        The file's content decides its type, not its name. It counts against the Library's 1 GB storage
        cap. 404 for anyone else's design; 422 for another type, an empty
        file, one over 25 MB or a full Library, and then nothing is stored.
      tags: [designs]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryItem" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /designs/{canvasId}/assets/{assetId}:
    parameters:
      - { name: canvasId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: assetId, in: path, required: true, schema: { type: string, pattern: "^a_[a-z0-9_]{1,40}$" } }
    get:
      operationId: getDesignAsset
      summary: One of a design's images (owner only)
      tags: [designs]
      responses:
        "200":
          description: The image
          headers:
            X-Content-Type-Options: { schema: { type: string, enum: [nosniff] } }
            Cache-Control: { schema: { type: string } }
          content:
            image/*:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /slide-starters:
    get:
      operationId: listSlideStarters
      summary: The starter decks a new deck can start from, in chooser order
      tags: [slides]
      responses:
        "200":
          description: The starter decks
          content:
            application/json:
              schema:
                type: object
                required: [starters]
                properties:
                  starters: { type: array, items: { $ref: "#/components/schemas/SlideStarter" } }
        default: { $ref: "#/components/responses/Error" }

  /slide-themes:
    get:
      operationId: listSlideThemes
      summary: The signed-in person's saved Slides themes, by name
      tags: [slides]
      responses:
        "200":
          description: Their saved themes
          content:
            application/json:
              schema:
                type: object
                required: [themes]
                properties:
                  themes: { type: array, items: { $ref: "#/components/schemas/SlideTheme" } }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createSlideTheme
      summary: Save a theme for use in any of the person's decks
      description: |
        Names are unique per person, ignoring case (409 otherwise); a person
        keeps at most 100 themes. Decks embed a copy of their theme, so a saved
        theme is applied by copying it into the deck.
      tags: [slides]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SlideThemeInput" }
      responses:
        "201":
          description: The saved theme
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SlideTheme" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /slide-themes/{themeId}:
    parameters:
      - { name: themeId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateSlideTheme
      summary: Rename or change a saved theme
      description: Only the fields given change. Decks already using the theme keep their copy. 404 for anyone else's theme.
      tags: [slides]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 60 }
                fonts: { $ref: "#/components/schemas/SlideThemeFonts" }
                colors: { $ref: "#/components/schemas/SlideThemeColors" }
      responses:
        "200":
          description: The theme
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SlideTheme" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteSlideTheme
      summary: Delete a saved theme (decks using it keep their copy)
      description: 404 for anyone else's theme.
      tags: [slides]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /docs:
    post:
      operationId: createDoc
      summary: Start a document in the Docs app
      description: |
        Makes a text canvas whose first version is the title as a heading, in a
        new chat in the person's Docs space (made the first time). That space
        keeps the chat out of the chat list and the Spaces menu; the document
        page opens the chat in its drawer.
      tags: [docs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 200, description: "Empty starts an untitled document" }
      responses:
        "201":
          description: The document
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyCanvas" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /docs/{canvasId}/reviewed:
    parameters:
      - { name: canvasId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: markDocReviewed
      summary: Record that the person reviewed a document up to a version
      description: |
        The Docs app shows a persona's versions after the person's last edit
        and after this mark as changes to accept or reject. Accepting all of
        them changes nothing in the text, so this records it. The mark never
        moves back. 404 for anyone else's document; 422 for a version it
        doesn't have.
      tags: [docs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seq]
              properties:
                seq: { type: integer, format: int32, minimum: 1 }
      responses:
        "200":
          description: The document's reviewed version
          content:
            application/json:
              schema:
                type: object
                required: [reviewed_seq]
                properties:
                  reviewed_seq: { type: integer, format: int32 }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /docs/{canvasId}/library:
    parameters:
      - { name: canvasId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: saveDocToLibrary
      summary: Save a document's current version to the Library as Markdown
      description: |
        Keeps a copy of the text as it is now, as an export linked to the
        document; later edits don't change it.
        Saving the same text again returns the existing item. It counts
        against the Library's storage cap. 404 for anyone else's canvas; 422
        for an SVG canvas or a full Library.
      tags: [docs]
      responses:
        "201":
          description: Saved, or already in the Library
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryItem" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /docs/{canvasId}/wiki:
    parameters:
      - { name: canvasId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: promoteDocToWiki
      summary: Publish a document's current version as a wiki page
      description: |
        A person's decision to share a draft: copies the text as it is now into
        a wiki page that agents can read, ending with a line saying which
        document it came from. Later edits to the document don't change the
        page. The page is published directly (it is your own action, so there
        is nothing to approve). Without `path` the page is named after the
        document. 409 when the page exists, unless `replace` is true; 404 for
        anyone else's canvas; 422 for an SVG canvas or an invalid path.
      tags: [docs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                path: { type: string, maxLength: 300, description: "Wiki page path, e.g. Payments/Rollback runbook. Empty names it after the document." }
                replace: { type: boolean, description: "Overwrite the page when it exists" }
      responses:
        "201":
          description: Published
          content:
            application/json:
              schema:
                type: object
                required: [path, created]
                properties:
                  path: { type: string, description: "The wiki page's path" }
                  created: { type: boolean, description: "False when an existing page was replaced" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /chats/{id}/cancel:
    parameters:
      - { $ref: "#/components/parameters/ChatId" }
    post:
      operationId: cancelChatTurn
      summary: Stop the running turn
      description: Interrupts the current turn (like run pause, SIGINT then kill); the chat returns to idle with a system message. 409 when no turn is running.
      tags: [chats]
      responses:
        "200":
          description: The chat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatSession" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /chats/{id}/followups:
    parameters:
      - { $ref: "#/components/parameters/ChatId" }
    get:
      operationId: listChatFollowups
      summary: Your follow-ups queued behind the running reply, next to send first
      tags: [chats]
      responses:
        "200":
          description: The queue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatFollowupList" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: queueChatFollowup
      summary: Queue a message to send once the running reply ends
      description: |
        Unlike posting a message, this doesn't interrupt the running reply.
        When a turn ends with a reply, the oldest queued follow-up is sent as
        the next message, one per turn. After a turn that was stopped or
        failed the queue is held until the person sends something. A follow-up
        queued while nothing runs and nothing else is queued is sent at once.
        409 when the chat is archived, is an aside, or already has 20 queued.
      tags: [chats]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatMessageEdit" }
      responses:
        "201":
          description: Queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatFollowup" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /chats/{id}/followups/{followupId}:
    parameters:
      - { $ref: "#/components/parameters/ChatId" }
      - { name: followupId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: deleteChatFollowup
      summary: Remove a queued follow-up before it is sent
      description: 404 once it has been sent or removed.
      tags: [chats]
      responses:
        "204": { description: Removed }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /chats/{id}/asides:
    parameters:
      - { $ref: "#/components/parameters/ChatId" }
    get:
      operationId: listChatAsides
      summary: The chat's asides, oldest first
      description: Each aside is a hidden chat (parent_chat_id is this chat); read its messages from /chats/{id}/messages.
      tags: [chats]
      responses:
        "200":
          description: The asides
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatAsideList" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: startChatAside
      summary: Ask about the running reply, or start a thread on a message, without interrupting the chat
      description: |
        Starts an aside: a hidden chat whose first turn answers the question.
        The same persona answers in a fresh session that gets the chat's
        recent conversation and a snapshot of the running reply (what it has
        written and which tools it called, with their output). With
        anchor_message_id it is a thread about that message instead: it gets
        the message rather than the running reply, and can start while
        nothing runs. The person can keep replying in it (POST its
        /messages). An aside only reads: no shell, images, connectors or
        secrets, and no Vesper tool that changes anything. Neither
        conversation sees the other afterwards. 409 when nothing is running
        (and there is no anchor), the chat is archived or is itself an aside,
        or 3 asides are still answering; 422 when the anchor isn't a person's
        or persona's message of this chat.
      tags: [chats]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatAsideStart" }
      responses:
        "201":
          description: The aside, answering
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatSession" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /chats/{id}/persona-proposals:
    parameters:
      - { $ref: "#/components/parameters/ChatId" }
    get:
      operationId: listPersonaProposals
      summary: Personas the chat's personas proposed, oldest first
      description: Pending proposals wait for the person's decision; decided ones stay for the record. 404 unknown chat.
      tags: [chats]
      responses:
        "200":
          description: Proposals, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [proposals]
                properties:
                  proposals: { type: array, items: { $ref: "#/components/schemas/PersonaProposal" } }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /chats/{id}/persona-proposals/{proposal_id}:
    parameters:
      - { $ref: "#/components/parameters/ChatId" }
      - { name: proposal_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: decidePersonaProposal
      summary: Approve or decline a proposed persona
      description: |
        Approving creates the persona with the proposed name, tone, colour and
        instructions and every capability off, adds it to the chat, and (when
        the chat is idle) gives it a turn to introduce itself. Both add a system
        message. With a ready picture (avatar_state), approving also makes
        it the persona's avatar and its reference image in the Library; if
        storing the avatar fails, the persona is still created, without one.
        404 unknown chat or proposal; 409 already decided, or approving while
        its picture is still pending; 422 when the persona can't be created
        (name taken, persona limit).
      tags: [chats]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approve, decline] }
      responses:
        "200":
          description: The decided proposal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PersonaProposal" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /chats/{id}/read:
    parameters:
      - { $ref: "#/components/parameters/ChatId" }
    post:
      operationId: markChatRead
      summary: Record that the person has seen the chat up to a message
      tags: [chats]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seq]
              properties:
                seq: { type: integer, format: int64, minimum: 0 }
      responses:
        "204": { description: Recorded }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /chats/{id}/commit-email:
    parameters:
      - { $ref: "#/components/parameters/ChatId" }
    put:
      operationId: setChatCommitEmail
      summary: Pick which of your email addresses a coding chat commits as
      description: |
        Applies from the chat's next turn, so it can be picked while a turn is
        running and needs no revision. 422 when the chat has no repository or
        the address isn't one of the caller's.
      tags: [chats]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, description: "One of the caller's emails (compared case-insensitively)" }
      responses:
        "200":
          description: The updated chat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatSession" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /persona-dock:
    get:
      operationId: getPersonaDock
      summary: The caller's personas with live or unread chat activity, most recent first, plus harness activity and plan usage
      tags: [chats]
      responses:
        "200":
          description: The dock
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PersonaDock" }
        default: { $ref: "#/components/responses/Error" }

  /chat-models:
    get:
      operationId: listChatModels
      summary: Harnesses and models the chat picker offers
      description: Live model catalog for all supported harnesses. Local mode queries the installed CLIs using their existing logins; Docker mode queries provider APIs using stored secrets. A harness is unavailable when discovery fails or no chat models are returned.
      tags: [chats]
      responses:
        "200":
          description: Harnesses in display order
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ChatHarnessModels" }
        default: { $ref: "#/components/responses/Error" }

  /chat-suggestions:
    get:
      operationId: listChatSuggestions
      summary: Conversation starters for the signed-in person's empty chats
      description: Written ahead of time from the person's memory and recent messages, so this never waits on a model. Empty until the first batch exists.
      tags: [chats]
      responses:
        "200":
          description: Four suggestions, or none
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatSuggestionList" }
        default: { $ref: "#/components/responses/Error" }

  /personas:
    get:
      operationId: listPersonas
      summary: The caller's assistant personas, default first, then most recently used
      description: |
        Personas are private to the person who made them: only the caller's
        are ever returned. At most 20 per person, so there's no paging.
      tags: [personas]
      responses:
        "200":
          description: Personas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PersonaList" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createPersona
      summary: Create a persona
      description: |
        422 for an empty, over-long or already used name (case-insensitive),
        an unknown tone, a color that isn't #rrggbb, custom instructions over
        2,000 characters or that look like a credential, or a 21st persona.
        With is_default it replaces the current default.
      tags: [personas]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewPersona" }
      responses:
        "201":
          description: The persona
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Persona" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /personas/{id}:
    parameters:
      - { $ref: "#/components/parameters/PersonaId" }
    get:
      operationId: getPersona
      summary: One persona; another person's is a 404
      tags: [personas]
      responses:
        "200":
          description: The persona
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Persona" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updatePersona
      summary: Edit a persona (revision-checked)
      description: |
        Changes apply from the next turn of every chat using the persona.
        404 for another person's persona, 409 on a stale revision, 422 under
        the same rules as POST /personas.
      tags: [personas]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PersonaPatch" }
      responses:
        "200":
          description: The updated persona
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Persona" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deletePersona
      summary: Delete a persona and its avatar
      description: |
        Its chats keep their history and fall back to the built-in Assistant
        (no persona). Deleting the default promotes the most recently used
        remaining persona; with none left, the built-in Assistant is the
        default. 404 for another person's persona, 409 when revision is given
        and stale.
      tags: [personas]
      parameters:
        - { name: revision, in: query, description: The revision the caller saw; omit to delete regardless, schema: { type: integer, minimum: 1 } }
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /personas/{id}/default:
    parameters:
      - { $ref: "#/components/parameters/PersonaId" }
    post:
      operationId: setDefaultPersona
      summary: Make this the caller's default persona (idempotent)
      description: New chats and the unfiltered chat list use the default. 404 for another person's persona.
      tags: [personas]
      responses:
        "200":
          description: The new default
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Persona" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /personas/{id}/avatar:
    parameters:
      - { $ref: "#/components/parameters/PersonaId" }
    get:
      operationId: getPersonaAvatar
      summary: The persona's avatar image
      description: |
        Served with the type sniffed at upload (PNG, JPEG or WebP only),
        `X-Content-Type-Options: nosniff` and a locked-down CSP. 404 when the
        persona has no avatar or isn't the caller's.
      tags: [personas]
      responses:
        "200":
          description: The image
          headers:
            X-Content-Type-Options: { schema: { type: string, enum: [nosniff] } }
            Content-Security-Policy: { schema: { type: string } }
            Cache-Control: { schema: { type: string } }
          content:
            image/*:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: uploadPersonaAvatar
      summary: Set or replace the persona's avatar
      description: |
        PNG, JPEG or WebP, at most 1 MB (1,048,576 bytes). The server sniffs
        the bytes and ignores the declared type and filename; SVG is never
        accepted. 413 over the limit, 415 for any other type, 422 for an
        empty file, 404 for another person's persona.
      tags: [personas]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "200":
          description: The persona with its new avatar_url
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Persona" }
        "404": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deletePersonaAvatar
      summary: Remove the persona's avatar (idempotent)
      tags: [personas]
      responses:
        "200":
          description: The persona without an avatar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Persona" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /repositories/presets:
    get:
      operationId: getRepositoryPresets
      summary: Connected GitHub account and organization presets
      responses:
        "200":
          description: Owners visible to the configured GitHub token; does not save sources
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RepositoryPresets" }
        default: { $ref: "#/components/responses/Error" }

  /repositories/sources:
    get:
      operationId: listRepositorySources
      responses:
        "200":
          description: Saved repositories and organizations
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/RepositorySource" } }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: saveRepositorySource
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RepositorySource" }
      responses:
        "204": { description: Saved }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteRepositorySource
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RepositorySource" }
      responses:
        "204": { description: Removed shortcut }
        default: { $ref: "#/components/responses/Error" }
  /repositories:
    get:
      operationId: searchRepositories
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: refresh, in: query, schema: { type: boolean } }
      responses:
        "200":
          description: Repositories matching saved sources and GitHub access
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/RepositoryEntry" } }
        default: { $ref: "#/components/responses/Error" }
  /chats/{id}/repository:
    put:
      operationId: setChatRepository
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repository]
              properties:
                repository: { type: string, description: "Saved short name, owner/repository or GitHub URL" }
      responses:
        "200":
          description: Same conversation with the selected repository
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatSession" }
        default: { $ref: "#/components/responses/Error" }

components:
  parameters:
    IncludeAgent:
      name: include_agent
      in: query
      description: Include agent memory and proposed patterns in discovery; false by default.
      schema: { type: boolean, default: false }
    NodeKind:
      name: kind
      in: query
      required: true
      schema: { $ref: "#/components/schemas/NodeKind" }
    NodeId:
      name: id
      in: query
      required: true
      schema: { type: string, format: uuid }
    TicketKey:
      name: key
      in: path
      required: true
      description: Ticket key, e.g. PAY-214
      schema: { type: string, pattern: "^[A-Z][A-Z0-9]{1,9}-[0-9]+$" }

    AgentHandle:
      name: handle
      in: path
      required: true
      schema: { type: string }
    ArtifactId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    CanvasId:
      name: canvasId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ChatId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    PersonaId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    RepositoryOwnerPreset:
      type: object
      required: [login, organization]
      properties:
        login: { type: string }
        organization: { type: boolean }
    RepositoryPresets:
      type: object
      required: [owners]
      properties:
        owners: { type: array, items: { $ref: "#/components/schemas/RepositoryOwnerPreset" } }
        warning: { type: string, description: "A partial discovery failure; the connected account and successfully discovered organizations remain available" }
    RepositorySource:
      type: object
      required: [kind, name]
      description: "Save one repository, or all repositories under an account or organization. A repository name ending in /* is saved as an owner source."
      properties:
        kind: { type: string, enum: [repository, organization], description: "organization is the legacy wire name for a GitHub owner, including personal accounts" }
        name: { type: string }
    RepositoryEntry:
      type: object
      required: [name, url]
      properties:
        name: { type: string }
        url: { type: string }
    ChatRepository:
      type: object
      required: [repo_url, directory, work_branches]
      properties:
        repo_url: { type: string }
        directory: { type: string, description: "Checkout path relative to the chat workspace" }
        work_branches: { type: array, items: { type: string } }
    Health:
      type: object
      required: [status, version, checks]
      properties:
        status: { type: string, enum: [ok, degraded] }
        version: { type: string }
        checks:
          type: object
          additionalProperties: { $ref: "#/components/schemas/HealthCheck" }
    HealthCheck:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        error: { type: string }
        latency_ms: { type: integer }
