        credit: { type: integer, minimum: 0, description: Money in column }
        balance: { type: integer, minimum: 0, description: Running balance column }
        decimal_comma: { type: boolean, description: "Amounts are written 1.234,56" }
        flip_sign: { type: boolean, description: Purchases show as positive amounts }
