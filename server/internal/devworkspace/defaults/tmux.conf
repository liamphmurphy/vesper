set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -g default-command "if command -v zsh >/dev/null 2>&1; then exec zsh; else exec bash; fi"
set -g mouse on
set -g set-clipboard on
set -as terminal-features ",xterm*:clipboard"
set -sg escape-time 0
set -g focus-events on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g status-style "bg=#1d2021,fg=#ebdbb2"
set -g status-left "#[fg=#fabd2f,bold][dev] "
set -g status-right "#[fg=#a89984]#(uname -m) · /workspace"
